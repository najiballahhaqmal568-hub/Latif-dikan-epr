name: ساخت APK دوکان لطیف

on:
  push:
    branches: [claude/grocery-shop-flutter-app-uzl9qx]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: گرفتن کد
        uses: actions/checkout@v4

      - name: نصب جاوا
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: نصب فلاتر
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: ساختن پوشه‌های اندروید
        run: flutter create --platforms=android --org com.latif .

      - name: گرفتن وابستگی‌ها
        run: flutter pub get

      - name: بررسی کد (اختیاری)
        run: flutter analyze || true

      - name: ساخت APK
        run: flutter build apk --release

      - name: آپلود APK به‌عنوان artifact
        uses: actions/upload-artifact@v4
        with:
          name: dukan-latif-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: انتشار APK (لینک دانلود مستقیم)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: آخرین APK دوکان لطیف
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
