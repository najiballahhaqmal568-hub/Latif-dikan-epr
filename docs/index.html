<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#1F7A4D" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="دوکان لطیف" />
<meta name="mobile-web-app-capable" content="yes" />
<title>دوکان لطیف</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<style>
  :root {
    --ground: #F4F3ED;
    --surface: #FFFFFF;
    --surface-2: #FBFAF6;
    --ink: #1B241F;
    --ink-soft: #5C665E;
    --line: #E5E3DA;
    --primary: #1F7A4D;
    --primary-ink: #FFFFFF;
    --primary-soft: #E4F1E9;
    --credit: #C8781A;
    --credit-soft: #F8EAD3;
    --danger: #C0392B;
    --danger-soft: #F7E1DD;
    --radius: 16px;
    --radius-sm: 11px;
    --shadow: 0 2px 10px rgba(20, 45, 30, .08);
    --shadow-lg: 0 -6px 22px rgba(20, 45, 30, .10);
    --nav-h: 62px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0F1310;
      --surface: #191E18;
      --surface-2: #1F251E;
      --ink: #ECF0E9;
      --ink-soft: #9AA69D;
      --line: #2B322A;
      --primary: #3FA96E;
      --primary-ink: #08130C;
      --primary-soft: #17301F;
      --credit: #E1A24A;
      --credit-soft: #3A2C13;
      --danger: #E5675A;
      --danger-soft: #3A1E1A;
      --shadow: 0 2px 10px rgba(0, 0, 0, .35);
      --shadow-lg: 0 -6px 22px rgba(0, 0, 0, .45);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0F1310; --surface: #191E18; --surface-2: #1F251E;
    --ink: #ECF0E9; --ink-soft: #9AA69D; --line: #2B322A;
    --primary: #3FA96E; --primary-ink: #08130C; --primary-soft: #17301F;
    --credit: #E1A24A; --credit-soft: #3A2C13;
    --danger: #E5675A; --danger-soft: #3A1E1A;
    --shadow: 0 2px 10px rgba(0,0,0,.35); --shadow-lg: 0 -6px 22px rgba(0,0,0,.45);
  }
  :root[data-theme="light"] {
    --ground: #F4F3ED; --surface: #FFFFFF; --surface-2: #FBFAF6;
    --ink: #1B241F; --ink-soft: #5C665E; --line: #E5E3DA;
    --primary: #1F7A4D; --primary-ink: #FFFFFF; --primary-soft: #E4F1E9;
    --credit: #C8781A; --credit-soft: #F8EAD3;
    --danger: #C0392B; --danger-soft: #F7E1DD;
    --shadow: 0 2px 10px rgba(20,45,30,.08); --shadow-lg: 0 -6px 22px rgba(20,45,30,.10);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    direction: rtl;
    font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", "Noto Naskh Arabic", -apple-system, system-ui, sans-serif;
    background: var(--ground);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-variant-numeric: tabular-nums; }

  /* App shell */
  .app {
    max-width: 520px;
    margin: 0 auto;
    /* بلندی ثابت: فقط فهرست وسط سکرول می‌شود تا سبد و نوار پایین هرگز پنهان نشوند */
    height: 100dvh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--ground);
    position: relative;
    overflow: hidden;
  }

  header.bar {
    background: var(--primary);
    color: var(--primary-ink);
    padding: 14px 18px calc(14px);
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  header.bar .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: rgba(255,255,255,.18);
    display: grid; place-items: center; font-size: 20px;
    flex: 0 0 auto;
  }
  header.bar h1 { font-size: 20px; margin: 0; font-weight: 800; letter-spacing: .2px; }
  header.bar .sub { font-size: 12.5px; opacity: .85; margin-top: 1px; }

  main { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .screen { display: none; }
  .screen.active { display: block; }

  /* Search */
  .searchwrap { padding: 12px 14px 6px; position: sticky; top: 0; background: var(--ground); z-index: 10;
    display: flex; align-items: center; gap: 8px; }
  .searchwrap .search { flex: 1 1 auto; min-width: 0; }
  .search {
    width: 100%; display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1.5px solid var(--line);
    border-radius: 14px; padding: 4px 14px; box-shadow: var(--shadow);
  }
  .search svg { flex: 0 0 auto; color: var(--ink-soft); }
  .search input {
    border: 0; outline: 0; background: transparent; color: var(--ink);
    font: inherit; font-size: 18px; padding: 13px 0; width: 100%;
  }
  .search button.clr {
    border: 0; background: transparent; color: var(--ink-soft);
    font-size: 22px; line-height: 1; padding: 6px; cursor: pointer;
  }

  /* نوار نرخ‌ها بالای اجناس — در شلوغی نرخ زودتر از نام به یاد می‌آید */
  .pricebar {
    display: flex; gap: 7px; padding: 4px 14px 2px; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .pricebar::-webkit-scrollbar { display: none; }
  .pricebar button {
    flex: 0 0 auto; border: 2px solid var(--line); background: var(--surface); color: var(--ink);
    font: inherit; font-size: 15px; font-weight: 800; padding: 7px 14px;
    border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .pricebar button.on { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }

  /* Product grid (sales) */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 11px; padding: 10px 14px 6px;
  }
  .tile {
    background: var(--surface); border: 1.5px solid var(--line);
    border-radius: var(--radius); padding: 13px 10px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; box-shadow: var(--shadow); text-align: center;
    transition: transform .06s ease, border-color .12s ease;
    min-height: 118px; justify-content: center; position: relative;
  }
  .tile:active { transform: scale(.96); }
  .tile .ico {
    width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
    font-size: 22px; margin-bottom: 2px;
  }
  .tile.w .ico { background: var(--primary-soft); color: var(--primary); }
  .tile.u .ico { background: var(--credit-soft); color: var(--credit); }
  .tile .nm { font-weight: 700; font-size: 16.5px; line-height: 1.25; }
  .tile .pr { font-size: 14px; font-weight: 700; }
  .tile.w .pr { color: var(--primary); }
  .tile.u .pr { color: var(--credit); }
  .tile .badge { font-size: 11px; color: var(--ink-soft); }
  .tile .oos { font-size: 11px; color: var(--danger); font-weight: 700; }

  /* تایل عکس‌دار: عکس تمام تایل را می‌گیرد تا از دور شناخته شود،
     نام و نرخ روی نوار پایین آن می‌آید. */
  .tile.photo { padding: 0; overflow: hidden; justify-content: flex-start; gap: 0; min-height: 158px; }
  .tile.photo .ph {
    width: 100%; flex: 1 1 auto; min-height: 0; display: block;
    object-fit: cover; background: var(--card);
  }
  .tile.photo .phcap {
    width: 100%; flex: 0 0 auto; padding: 7px 8px 8px;
    background: var(--surface); border-top: 1px solid var(--line);
  }
  .tile.photo .phcap .nm { font-size: 16px; font-weight: 800; line-height: 1.2; }
  .tile.photo .oos {
    position: absolute; top: 6px; inset-inline-start: 6px;
    background: var(--danger-soft); padding: 2px 8px; border-radius: 999px;
  }
  .tile.photo .startag {
    background: rgba(0,0,0,.45); border-radius: 999px; padding: 1px 5px; font-size: 13px;
  }
  .tile.photo .typetag {
    position: absolute; top: 6px; inset-inline-start: 6px; font-size: 13px;
    background: rgba(0,0,0,.45); border-radius: 999px; padding: 1px 5px;
  }

  /* Cart bar */
  .cartbar {
    position: sticky; bottom: 0; z-index: 15;
    background: var(--surface); border-top: 1px solid var(--line);
    box-shadow: var(--shadow-lg);
    border-radius: 18px 18px 0 0;
    padding: 8px 14px 12px;
    /* ستون منعطف با سقف بلندی: فهرست سبد کوچک می‌شود تا دکمه‌های «تمام» همیشه دیده شوند */
    display: flex; flex-direction: column; max-height: 66vh;
  }
  .cartbar > .carthead, .cartbar > .totrow, .cartbar > .changerow, .cartbar > .payrow { flex: 0 0 auto; }
  .cartbar > #cartArea { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  /* سبد بلندتر (تا ~۶ قلم) ولی در جای تنگ خودش کوچک می‌شود */
  .cartlist { flex: 1 1 auto; min-height: 0; max-height: 300px; overflow-y: auto; margin: 2px 0 4px; }

  /* سر سبد: شمارندهٔ اقلام + پاک‌کردن */
  .carthead { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 4px; }
  .carthead span { font-size: 13.5px; font-weight: 800; color: var(--ink-soft); }
  .carthead button {
    border: 0; background: var(--danger-soft); color: var(--danger); font: inherit;
    font-size: 13px; font-weight: 800; padding: 5px 10px; border-radius: 9px; cursor: pointer;
  }

  /* کم/زیادکردن تعداد در سبد */
  .citem .qbtn {
    width: 32px; height: 32px; flex: 0 0 auto; border-radius: 9px; border: 0;
    background: var(--primary-soft); color: var(--primary); font: inherit;
    font-size: 20px; font-weight: 900; line-height: 1; cursor: pointer;
    display: grid; place-items: center;
  }
  .citem .qbtn:active { transform: scale(.92); }

  /* حساب باقی (پیسهٔ پس‌دادن) — با دکمه باز/بسته می‌شود تا جای دکمه‌های «تمام» را نگیرد */
  .chtoggle {
    border: 2px solid var(--line); background: var(--card); color: var(--ink-soft);
    font: inherit; font-size: 14px; font-weight: 800; padding: 6px 12px;
    border-radius: 10px; cursor: pointer; margin-inline-start: auto; margin-inline-end: 10px;
  }
  .chtoggle.on { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }
  .changerow { padding: 2px 0 8px; }
  .chline { display: flex; align-items: center; gap: 8px; }
  .chline input {
    flex: 1 1 0; min-width: 0; font: inherit; font-size: 16px; font-weight: 700;
    padding: 9px 10px; border: 2px solid var(--line); border-radius: 10px; background: var(--card);
    color: var(--ink);
  }
  .chline input:focus { outline: 0; border-color: var(--primary); }
  .chclr {
    width: 32px; height: 32px; flex: 0 0 auto; border: 0; border-radius: 9px;
    background: var(--danger-soft); color: var(--danger); font-size: 18px; cursor: pointer;
  }
  .chres { flex: 0 0 auto; font-size: 15.5px; font-weight: 900; color: var(--primary); }
  .chres.short { color: var(--danger); }
  .chips { display: flex; gap: 6px; margin-top: 6px; }
  .chips button {
    flex: 1 1 0; border: 2px solid var(--line); background: var(--card); color: var(--ink);
    font: inherit; font-size: 14px; font-weight: 800; padding: 7px 2px; border-radius: 9px; cursor: pointer;
  }
  .chips button:active { background: var(--primary-soft); }

  /* دکمهٔ فروش‌های امروز کنار جستجو */
  .todaybtn {
    flex: 0 0 auto; width: 46px; height: 46px; border: 2px solid var(--line); border-radius: 12px;
    background: var(--card); font-size: 21px; cursor: pointer; display: grid; place-items: center;
  }
  .todaybtn:active { background: var(--primary-soft); }

  /* ستارهٔ جنس پرفروش */
  .star {
    width: 38px; height: 38px; flex: 0 0 auto; border: 0; background: transparent;
    font-size: 20px; cursor: pointer; display: grid; place-items: center;
    opacity: .25; filter: grayscale(1); transition: opacity .12s, filter .12s;
  }
  .star.on { opacity: 1; filter: none; }
  .tile .startag { position: absolute; top: 5px; inset-inline-end: 7px; font-size: 12px; }
  .tile.oosdim { opacity: .45; }
  .retbadge { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 7px;
    background: var(--danger-soft); color: var(--danger); }

  /* حسابگر کارتن و نشان «تخمینی» */
  .cartonlink {
    margin-top: 8px; border: 2px dashed var(--line); background: transparent;
    color: var(--ink-soft); font: inherit; font-size: 13.5px; font-weight: 800;
    padding: 7px 12px; border-radius: 10px; cursor: pointer;
  }
  .cartonlink.on { border-style: solid; border-color: var(--primary); color: var(--primary); }
  .estrow { display: flex; align-items: center; gap: 9px; margin-top: 12px;
    font-size: 14.5px; cursor: pointer; }
  .estrow input { width: 20px; height: 20px; flex: 0 0 auto; accent-color: var(--credit); }
  .estbadge { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 7px;
    background: var(--credit-soft); color: var(--credit); }
  .citem { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .citem:last-child { border-bottom: 0; }
  .citem .x {
    width: 30px; height: 30px; flex: 0 0 auto; border-radius: 8px; border: 0;
    background: var(--danger-soft); color: var(--danger); font-size: 19px; line-height: 1;
    cursor: pointer; display: grid; place-items: center;
  }
  .citem .cn { flex: 1 1 auto; min-width: 0; }
  .citem .cn b { font-weight: 700; font-size: 16px; display: block; }
  .citem .cn small { color: var(--ink-soft); font-size: 12.5px; }
  .citem .lt { font-weight: 800; font-size: 16px; white-space: nowrap; }
  .cart-empty { text-align: center; color: var(--ink-soft); padding: 14px 0; font-size: 15px; }
  .totrow { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 2px 10px; }
  .totrow .lbl { font-size: 19px; font-weight: 700; }
  .totrow .tot { font-size: 24px; font-weight: 900; color: var(--primary); }
  .payrow { display: flex; gap: 10px; }
  .btn {
    flex: 1 1 0; border: 0; border-radius: 14px; padding: 16px 8px;
    font: inherit; font-size: 18px; font-weight: 800; cursor: pointer; color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .06s ease, opacity .12s;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.cash { background: var(--primary); color: var(--primary-ink); }
  .btn.credit { background: var(--credit); }

  /* Products list */
  .listwrap { padding: 6px 0 16px; }
  .prow {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); margin: 8px 14px; padding: 12px 14px;
    border: 1.5px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  }
  .prow .ico { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex: 0 0 auto; }
  .prow.w .ico { background: var(--primary-soft); color: var(--primary); }
  .prow.u .ico { background: var(--credit-soft); color: var(--credit); }
  .prow .ico.ph { object-fit: cover; background: var(--card); }

  /* خانهٔ عکس در فورم جنس */
  .photorow { display: flex; align-items: center; gap: 12px; }
  .photobox {
    width: 78px; height: 78px; border-radius: 14px; flex: 0 0 auto; overflow: hidden;
    border: 1.5px solid var(--line); display: grid; place-items: center; background: var(--card);
  }
  .photobox img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photobox .ico { border-radius: 0; }
  .prow .info { flex: 1 1 auto; min-width: 0; }
  .prow .info b { font-size: 18px; font-weight: 800; display: block; }
  .prow .info small { color: var(--ink-soft); font-size: 13px; }
  .prow .qty { text-align: left; flex: 0 0 auto; }
  .prow .qty .q { font-size: 17px; font-weight: 800; }
  .prow .qty .q.low { color: var(--danger); }
  .prow .qty small { display: block; font-size: 11.5px; color: var(--ink-soft); }
  .prow .del {
    width: 38px; height: 38px; border: 0; border-radius: 10px; flex: 0 0 auto;
    background: var(--danger-soft); color: var(--danger); font-size: 18px; cursor: pointer;
    display: grid; place-items: center;
  }
  .prow .tapzone { display: flex; align-items: center; gap: 12px; flex: 1 1 auto; min-width: 0; cursor: pointer; }

  .empty { text-align: center; color: var(--ink-soft); padding: 60px 30px; }
  .empty .big { font-size: 54px; }
  .empty p { font-size: 17px; margin: 10px 0 0; }

  .fab {
    position: fixed; bottom: calc(var(--nav-h) + 16px); inset-inline-start: 50%;
    transform: translateX(50%);
    max-width: 520px; width: calc(100% - 28px); pointer-events: none;
    display: flex; justify-content: flex-start;
  }
  .fab button {
    pointer-events: auto; border: 0; background: var(--primary); color: var(--primary-ink);
    font: inherit; font-weight: 800; font-size: 17px; padding: 15px 22px; border-radius: 30px;
    box-shadow: 0 6px 18px rgba(20,80,45,.3); cursor: pointer; display: flex; gap: 8px; align-items: center;
  }
  .fab button:active { transform: scale(.96); }

  /* Bottom nav */
  nav.tabs {
    position: sticky; bottom: 0; z-index: 25;
    height: var(--nav-h); display: flex; background: var(--surface);
    border-top: 1px solid var(--line);
  }
  nav.tabs button {
    flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink-soft);
    font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  }
  nav.tabs button.active { color: var(--primary); }
  nav.tabs button .dico { font-size: 22px; line-height: 1; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(10,20,14,.5); z-index: 40;
    display: none; align-items: flex-end; justify-content: center;
    padding: 0;
  }
  .overlay.open { display: flex; }
  @media (min-width: 560px) { .overlay { align-items: center; padding: 20px; } }
  .sheet {
    background: var(--surface); width: 100%; max-width: 520px;
    border-radius: 20px 20px 0 0; max-height: 92dvh; overflow-y: auto;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    animation: rise .18s ease;
  }
  @media (min-width: 560px) { .sheet { border-radius: 20px; } }
  @keyframes rise { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .sheet, .tile, .btn { animation: none; transition: none; } }
  .sheet h2 { margin: 2px 0 16px; font-size: 21px; font-weight: 800; }
  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 15px; font-weight: 700; margin-bottom: 7px; color: var(--ink-soft); }
  .field input[type=text], .field input[type=number], .field input[type=date] {
    width: 100%; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink);
    border-radius: 12px; padding: 14px; font: inherit; font-size: 18px; outline: 0;
  }
  .field input:focus { border-color: var(--primary); }
  .field input[type=number] { direction: ltr; text-align: right; }
  .err { color: var(--danger); font-size: 13.5px; margin-top: 6px; display: none; }
  .err.show { display: block; }

  .seg { display: flex; gap: 8px; }
  .seg button {
    flex: 1; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink);
    font: inherit; font-size: 16px; font-weight: 700; padding: 13px 6px; border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .seg button.on { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  .seg.credit button.on { background: var(--credit); border-color: var(--credit); color: #fff; }

  .qbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin: 4px 0 14px; }
  .qbtns button {
    border: 1.5px solid var(--primary); background: var(--primary-soft); color: var(--primary);
    font: inherit; font-size: 19px; font-weight: 800; padding: 16px; border-radius: 13px; cursor: pointer;
  }
  .qbtns button:active { transform: scale(.96); }

  .sheet .actions { display: flex; gap: 10px; margin-top: 8px; }
  .sheet .actions .ghost {
    flex: 0 0 auto; border: 1.5px solid var(--line); background: transparent; color: var(--ink-soft);
    font: inherit; font-size: 17px; font-weight: 700; padding: 15px 20px; border-radius: 13px; cursor: pointer;
  }
  .sheet .actions .primary {
    flex: 1 1 auto; border: 0; background: var(--primary); color: var(--primary-ink);
    font: inherit; font-size: 18px; font-weight: 800; padding: 15px; border-radius: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .sheet .actions .primary.danger { background: var(--danger); color: #fff; }

  /* Toast */
  .toast {

<script>
"use strict";
(function () {
  // ---------- Storage ----------
  var LS_P = "dukan.products.v1", LS_S = "dukan.sales.v1", LS_SEED = "dukan.seeded.v1";
  var LS_SUP = "dukan.suppliers.v1", LS_PUR = "dukan.purchases.v1", LS_CUST = "dukan.customers.v1";
  var LS_SPAY = "dukan.supPayments.v1", LS_CPAY = "dukan.custPayments.v1", LS_WASTE = "dukan.waste.v1", LS_EXP = "dukan.expenses.v1", LS_COUNTS = "dukan.stockCounts.v1";
  var LS_CASH = "dukan.cash.v1"; // صندوق: موجودی اول، پول دستی، و تعدیل شمارش
  var EXPIRY_WARN_DAYS = 14;
  var WIFI_LOW_GB = 20;
  function load(key, def) { try { return JSON.parse(localStorage.getItem(key)) || def; } catch (e) { return def; } }
  // ذخیرهٔ خام (بدون سنک). هر ذخیره، حافظهٔ موقت قرض‌ها را باطل می‌کند
  // تا رقم قرض همیشه از رویدادهای تازه حساب شود.
  function save0(key, val) {
    localStorage.setItem(key, JSON.stringify(val));
    if (typeof invalidateDebts === "function") invalidateDebts();
  }
  function save(key, val) { save0(key, val); if (typeof syncOnLocalSave === "function") syncOnLocalSave(); }

  var products = load(LS_P, null);
  var sales = load(LS_S, []);
  var suppliers = load(LS_SUP, []);
  var purchases = load(LS_PUR, []);
  var customers = load(LS_CUST, []);
  var supPayments = load(LS_SPAY, []); // رسیدهای پرداخت به تامین‌کننده
  var custPayments = load(LS_CPAY, []); // رسیدهای دریافت از مشتری
  var waste = load(LS_WASTE, []); // ضایعات
  var expenses = load(LS_EXP, []); // مصارف خانه
  var stockCounts = load(LS_COUNTS, []); // شمارش ماهانه (فرق‌ها)
  var cashEntries = load(LS_CASH, []); // رویدادهای صندوق: opening | in | out | count
  if (products === null) {
    // نمونه‌های اولیه تا فوری امتحان شود (قابل حذف)
    products = [
      { id: id(), name: "بوره", type: "weighted", unit: "kg", buy: 55, sell: 70, qty: 20, expiry: "" },
      { id: id(), name: "برنج", type: "weighted", unit: "kg", buy: 80, sell: 100, qty: 15, expiry: "" },
      { id: id(), name: "روغن", type: "weighted", unit: "kg", buy: 110, sell: 140, qty: 12, expiry: "" },
      { id: id(), name: "کیک", type: "unit", unit: "piece", buy: 8, sell: 10, qty: 40, expiry: "" },
      { id: id(), name: "بوتل آب", type: "unit", unit: "piece", buy: 15, sell: 20, qty: 24, expiry: "" },
      { id: id(), name: "بسته چای", type: "unit", unit: "piece", buy: 45, sell: 60, qty: 10, expiry: "" },
      { id: id(), name: "صابون", type: "unit", unit: "piece", buy: 25, sell: 35, qty: 18, expiry: "" }
    ];
    save(LS_P, products);
    localStorage.setItem(LS_SEED, "1");
  }

  var cart = []; // {productId, qty}
  var currentTab = "sales";

  // ---------- Helpers ----------
  function id() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  var nf = new Intl.NumberFormat("en-US", { maximumFractionDigits: 3 });
  // n === 0 برای -0 هم درست است؛ +0 می‌کند تا «-0» نمایش داده نشود.
  // گرد و غبار اعشار شناور (مثل -4.5e-13 پس از باطل‌کردن) هم صفر شود.
  function money(n) { var v = (typeof n === "number" && Math.abs(n) < 0.005) ? 0 : n; return nf.format(v) + " افغانی"; }
  function unitLabel(u) { return u === "kg" ? "کیلو" : (u === "gb" ? "جی‌بی" : "دانه"); }
  function qtyUnit(n, u) { return nf.format(n) + " " + unitLabel(u); }
  function findP(pid) { for (var i = 0; i < products.length; i++) if (products[i].id === pid) return products[i]; return null; }
  function findS(sid) { for (var i = 0; i < suppliers.length; i++) if (suppliers[i].id === sid) return suppliers[i]; return null; }
  function findC(cid) { for (var i = 0; i < customers.length; i++) if (customers[i].id === cid) return customers[i]; return null; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function $(s) { return document.querySelector(s); }

  // ---------- دفتر قرض ----------
  // رقم قرض هیچ‌جا ذخیره نمی‌شود؛ همیشه از رویدادها حساب می‌گردد:
  //   قرض مشتری   = قرض قبلی + فروش‌های قرضی (برگشتی منفی است) − دریافت‌ها
  //   قرض تامین‌کننده = قرض قبلی + باقی‌ماندهٔ فاکتورها − پرداخت‌ها
  // پس رقم هرگز نمی‌تواند از واقعیت دور شود، و هر رقم قابل پیگیری است.
  var _debtCache = null;
  function invalidateDebts() { _debtCache = null; }
  // ---------- باطل‌کردن رکوردهای غلط ----------
  // هیچ رکورد مالی پاک نمی‌شود. «باطل» یک رکورد وارونه می‌سازد که همه چیز
  // را پس می‌گیرد، و اصلِ رکورد با نشان «باطل شد» می‌ماند. چون همهٔ رقم‌ها
  // از جمع رویدادها حساب می‌شوند، رکورد منفی خودکار همه‌جا اثر می‌کند.
  function isReversal(x) { return !!(x && x.reverseOf); }
  function isVoided(x) { return !!(x && (x.reversed || x.reverseOf)); }

  // مهر زمانی دقیق رویداد. تاریخ فاکتور خرید فقط «روز» دارد (کاربر خودش
  // انتخابش می‌کند)، پس دو فاکتور یک روز از هم فرق کرده نمی‌توانستند و
  // باطل‌کردن اولی، قیمت خرید را خاموش غلط برمی‌گرداند. ts لحظهٔ ثبت است.
  function eventTs(r) { return (r && (r.ts || r.date)) || ""; }

  // آیا بعد از این رویداد، خرید/دریافتِ دیگری از همان جنس شده؟ اگر شده،
  // قیمت خرید اوسط دیگر به عقب برنمی‌گردد و باید خود دوکان‌دار ببیندش.
  function hasLaterBuyEvent(productId, rec) {
    var mine = eventTs(rec), myId = rec && rec.id;
    // اگر مهر زمانی دقیق نباشد و روزشان یکی باشد، محتاطانه «بعدی» شمرده
    // می‌شود — اخطاردادن بی‌جا بهتر از برگرداندن خاموشِ رقم غلط است.
    function isLater(other) {
      if (other.id === myId) return false;
      var t = eventTs(other);
      return t >= mine;
    }
    var later = false;
    purchases.forEach(function (pu) {
      if (isReversal(pu) || !isLater(pu)) return;
      (pu.items || []).forEach(function (it) { if (it.productId === productId) later = true; });
    });
    custPayments.forEach(function (p) {
      if (!isGoodsPay(p) || isReversal(p) || !isLater(p)) return;
      if (p.productId === productId) later = true;
    });
    return later;
  }

  // قیمت خرید را به عکسِ پیش از این رویداد برمی‌گرداند — اگر امن باشد.
  // نام جنس‌هایی که امن نبود برگردانده می‌شود تا به کاربر گفته شود.
  function restoreBuyPrice(productId, prevBuy, prevEst, rec, warnOut) {
    var p = findP(productId);
    if (!p) return;
    if (prevBuy === undefined || prevBuy === null) { warnOut.push(p.name); return; }
    if (hasLaterBuyEvent(productId, rec)) { warnOut.push(p.name); return; }
    p.buy = prevBuy;
    p.buyEstimated = !!prevEst;
  }

  function voidWarnSheet(names, then) {
    if (!names.length) { then(); return; }
    then();
    setTimeout(function () {
      openSheet(
        '<h2 style="color:var(--credit)">قیمت خرید را خودتان ببینید</h2>' +
        '<p style="font-size:14.5px;line-height:2;margin:-4px 0 14px">' +
          'باطل شد و موجودی، قرض و صندوق پس آمدند. ولی <b>قیمت خرید</b> این جنس‌ها ' +
          'به عقب برنگشت، چون بعد از آن خرید دیگری هم شده:<br>' +
          '<b>' + names.map(esc).join("، ") + '</b><br><br>' +
          'از «اجناس» یا «بازبینی نرخ‌ها» قیمت خریدشان را ببینید و اگر غلط بود درست کنید.</p>' +
        '<div class="actions"><button class="primary" data-close>فهمیدم</button></div>'
      );
    }, 300);
  }

  // ---------- محافظ موجودی ----------
  // مثل محافظ صندوق: موجودی نباید خاموش منفی شود. اگر در شلوغی به‌جای ۵۰
  // عدد ۵۰۰ تایپ شود، اپ تا حال بی‌صدا موجودی را −۴۵۰ می‌کرد و فایده و
  // صندوقِ ساختگی می‌ساخت. حالا می‌پرسد.
  // wants = [{ productId, qty }] — مقداری که از موجودی کم می‌شود
  function stockShortages(wants) {
    var need = {};
    wants.forEach(function (w) { need[w.productId] = (need[w.productId] || 0) + w.qty; });
    var out = [];
    Object.keys(need).forEach(function (pid) {
      var p = findP(pid); if (!p) return;
      if (need[pid] > p.qty) out.push({ name: p.name, have: p.qty, want: +need[pid].toFixed(3), unit: p.unit });
    });
    return out;
  }
  // شمار دفعاتی که دوکان‌دار خودش «به‌هرحال ثبت کن» را زده و موجودی را
  // آگاهانه منفی کرده. ذخیره نمی‌شود؛ فقط تا آخر همین نشست می‌ماند.
  //
  // چرا هست: منفی‌شدن موجودی یک حالت **قانونی** است — وقتی دوکان‌دار
  // خودش تصمیم گرفته باشد. ولی اگر بدون تصمیم او منفی شود، یعنی یک راه
  // خروج جنس محافظ ندارد. با این شمارنده، حلقهٔ آزمایش می‌تواند این دو
  // حالت را از هم جدا کند و راه بی‌محافظ را لو بدهد.
  // (دو راه از شش راه واقعاً محافظ نداشتند و همین‌طور پیدا شدند.)
  var stockOverrides = 0;

  // اگر موجودی بس است true؛ ورنه شیت باز می‌شود و false برمی‌گردد.
  function guardStockOut(wants, what, proceed, onBack) {
    var short = stockShortages(wants);
    if (short.length === 0) return true;
    openSheet(
      '<h2 style="color:var(--danger)">موجودی کم است</h2>' +
      '<p style="font-size:14.5px;line-height:2;margin:-4px 0 12px">' + esc(what) + '</p>' +
      '<div class="sumbox" style="margin-bottom:12px">' +
        short.map(function (s) {
          return '<div class="sumrow"><span>' + esc(s.name) + '</span>' +
            '<span class="num">موجود ' + qtyUnit(s.have, s.unit) + ' — لازم ' + qtyUnit(s.want, s.unit) + '</span></div>';
        }).join("") +
      '</div>' +
      '<p style="font-size:13px;color:var(--ink-soft);line-height:1.9;margin:0 0 12px">' +
        'اگر رقم غلط تایپ شده، اصلاحش کنید. اگر واقعاً جنس بیشتر از دفتر داشتید، ' +
        '«به‌هرحال» را بزنید — موجودی منفی می‌شود تا با شمارش ماهانه درست گردد.</p>' +
      '<button class="wbtn" id="stAnyway" style="width:100%;padding:13px;background:var(--danger)">به‌هرحال ثبت کن</button>' +
      '<div class="actions"><button class="ghost" id="stBack" style="width:100%">رقم را اصلاح می‌کنم</button></div>'
    );
    $("#stAnyway").addEventListener("click", function () { stockOverrides++; closeSheet(); proceed(); });
    $("#stBack").addEventListener("click", function () { closeSheet(); if (onBack) onBack(); });
    return false;
  }

  // پرسیدن پیش از باطل‌کردن — با نوشتن دقیق اینکه چه چیزی پس می‌آید
  function confirmVoid(title, lines, run) {
    openSheet(
      '<h2 style="color:var(--danger)">' + esc(title) + '</h2>' +
      '<p style="font-size:14.5px;line-height:2;margin:-4px 0 12px">این چیزها پس می‌آیند:</p>' +
      '<div class="sumbox" style="margin-bottom:12px">' +
        lines.map(function (l) {
          return '<div class="sumrow"><span>' + l[0] + '</span><span class="num">' + l[1] + '</span></div>';
        }).join("") +
      '</div>' +
      '<p style="font-size:13px;color:var(--ink-soft);line-height:1.9;margin:0 0 12px">' +
        'رکورد پاک نمی‌شود — با نشان «باطل شد» می‌ماند و یک رکورد وارونه ثبت می‌گردد. ' +
        'بعد رقم درست را از نو ثبت کنید.</p>' +
      '<div class="actions"><button class="ghost" data-close>نی، لغو</button>' +
        '<button class="primary" id="voidOk" style="background:var(--danger)">بلی، باطل کن</button></div>'
    );
    $("#voidOk").addEventListener("click", run);
  }

  // ---- ۱) فاکتور خرید ----
  function voidPurchase(pu) {
    if (isVoided(pu)) return;
    confirmVoid("باطل‌کردن فاکتور خرید", [
      ["موجودی اجناس", "کم می‌شود"],
      ["پرداخت‌شده (به صندوق)", "＋ " + money(pu.paid || 0)],
      ["باقی‌ماندهٔ قرض تامین‌کننده", "− " + money(pu.remaining || 0)]
    ], function () {
      // اگر اجناس این فاکتور فروخته شده باشند، باطل‌کردن موجودی را منفی
      // می‌کند — این باید گفته شود، نه خاموش انجام گیرد.
      var wants = (pu.items || []).map(function (it) { return { productId: it.productId, qty: it.qty }; });
      if (!guardStockOut(wants, "اجناس این فاکتور تا حال فروخته شده‌اند، پس باطل‌کردنش موجودی را منفی می‌کند:",
        function () { doVoidPurchase(pu); },
        function () { openPurchaseDetail(pu); })) return;
      doVoidPurchase(pu);
    });
  }

  function doVoidPurchase(pu) {
    var warn = [];
    (pu.items || []).forEach(function (it) {
      var p = findP(it.productId);
      if (p) p.qty = +(p.qty - it.qty).toFixed(3);
      restoreBuyPrice(it.productId, it.prevBuy, it.prevEst, pu, warn);
    });
    pu.reversed = true;
    var now = new Date().toISOString();
    purchases.push({ id: id(), supplierId: pu.supplierId, supplierName: pu.supplierName,
      date: now, ts: now, total: -pu.total, paid: -(pu.paid || 0),
      remaining: -(pu.remaining || 0), reverseOf: pu.id,
      items: (pu.items || []).map(function (it) {
        return { productId: it.productId, productName: it.productName, qty: -it.qty, buyPrice: it.buyPrice };
      }) });
    save(LS_PUR, purchases); save(LS_P, products);
    closeSheet();
    renderPurchases(); renderSuppliers(); renderProducts(); renderSaleGrid();
    toast("فاکتور باطل شد ✓");
    voidWarnSheet(warn, function () {});
  }

  // ---- ۲) رسید پرداخت به تامین‌کننده ----
  function voidSupPayment(rec) {
    if (isVoided(rec)) return;
    var s = findS(rec.supplierId);
    confirmVoid("باطل‌کردن رسید پرداخت", [
      ["پول به صندوق", "＋ " + money(rec.amount)],
      ["قرض " + (s ? s.name : "تامین‌کننده"), "＋ " + money(rec.amount)]
    ], function () {
      rec.reversed = true;
      supPayments.push({ id: id(), supplierId: rec.supplierId, date: new Date().toISOString(),
        amount: -rec.amount, reverseOf: rec.id });
      save(LS_SPAY, supPayments);
      closeSheet(); renderSuppliers();
      if (s) openSupplierDetail(s);
      toast("رسید باطل شد ✓");
    });
  }

  // ---- ۳) رسید دریافت از مشتری (نقدی یا به جنس) ----
  function voidCustPayment(rec) {
    if (isVoided(rec)) return;
    var c = findC(rec.customerId);
    var goods = isGoodsPay(rec);
    confirmVoid("باطل‌کردن رسید دریافت", goods
      ? [["موجودی " + (rec.productName || "جنس"), "− " + nf.format(rec.qty)],
         ["قرض " + (c ? c.name : "مشتری"), "＋ " + money(rec.amount)],
         ["صندوق", "دست‌نخورده"]]
      : [["پول از صندوق", "− " + money(rec.amount)],
         ["قرض " + (c ? c.name : "مشتری"), "＋ " + money(rec.amount)]],
    function () {
      // باطل‌کردن «دریافت به جنس» جنس را از گدام پس می‌گیرد. اگر همان جنس
      // در این میان فروخته شده باشد، موجودی خاموش منفی می‌شد — پس مثل هر
      // راه دیگرِ خروج جنس، از محافظ موجودی می‌گذرد.
      if (goods && !guardStockOut([{ productId: rec.productId, qty: rec.qty }],
        "این جنس پس گرفته می‌شود، ولی در گدام کم است:",
        function () { doVoidCustPayment(rec, c, goods); },
        function () { voidCustPayment(rec); })) return;
      doVoidCustPayment(rec, c, goods);
    });
  }
  function doVoidCustPayment(rec, c, goods) {
    {
      var warn = [];
      if (goods) {
        var p = findP(rec.productId);
        if (p) p.qty = +(p.qty - rec.qty).toFixed(3);
        restoreBuyPrice(rec.productId, rec.prevBuy, rec.prevEst, rec, warn);
        save(LS_P, products);
      }
      rec.reversed = true;
      var rev = { id: id(), customerId: rec.customerId, date: new Date().toISOString(),
        amount: -rec.amount, reverseOf: rec.id };
      if (goods) {
        rev.kind = "goods"; rev.productId = rec.productId; rev.productName = rec.productName;
        rev.unit = rec.unit; rev.qty = -rec.qty; rev.unitPrice = rec.unitPrice;
      }
      custPayments.push(rev);
      save(LS_CPAY, custPayments);
      closeSheet(); renderCustomers(); renderProducts(); renderSaleGrid();
      if (c) openCustomerDetail(c);
      toast("رسید باطل شد ✓");
      voidWarnSheet(warn, function () {});
    }
  }

  // ---- ۴) پول داخل / پول خارج صندوق ----
  function voidCashEntry(rec) {
    if (isVoided(rec)) return;
    var isIn = rec.kind === "in";
    confirmVoid("باطل‌کردن " + (isIn ? "«پول داخل»" : "«پول خارج»"),
      [["صندوق", (isIn ? "− " : "＋ ") + money(rec.amount)]],
      function () {
        rec.reversed = true;
        cashEntries.push({ id: id(), date: new Date().toISOString(), kind: rec.kind,
          amount: -rec.amount, note: "باطل‌کردن: " + (rec.note || ""), reverseOf: rec.id });
        save(LS_CASH, cashEntries);
        closeSheet(); renderMore();
        toast("باطل شد ✓");
      });
  }

  // ---- ۵) ضایعات ----
  function voidWaste(rec) {
    if (isVoided(rec)) return;
    confirmVoid("باطل‌کردن ضایعات", [
      ["موجودی " + (rec.productName || "جنس"), "＋ " + nf.format(rec.quantity)],
      ["ضرر ضایعات", "− " + money(rec.quantity * rec.buyPrice)]
    ], function () {
      var p = findP(rec.productId);
      if (p) p.qty = +(p.qty + rec.quantity).toFixed(3);
      rec.reversed = true;
      // countMonth باید همراه بیاید: شمارش دوبارهٔ همان ماه، ضایعات کسریِ
      // آن ماه را پاک می‌کند. اگر رکورد وارونه این نشان را نداشت، تنها
      // می‌ماند و ضرر منفی → «فایدهٔ ساختگی» می‌ساخت.
      var rev = { id: id(), date: new Date().toISOString(), productId: rec.productId,
        productName: rec.productName, unit: rec.unit, quantity: -rec.quantity,
        buyPrice: rec.buyPrice, reason: rec.reason, reverseOf: rec.id };
      if (rec.countMonth) rev.countMonth = rec.countMonth;
      waste.push(rev);
      save(LS_WASTE, waste); save(LS_P, products);
      closeSheet(); renderMore(); renderProducts(); renderSaleGrid();
      toast("ضایعات باطل شد ✓");
    });
  }

  // «دریافت به جنس»: مشتری به‌جای پول، جنس می‌دهد (تخم مرغ به ۵، آرد کیلو ۱۰).
  // این رسید قرض او را کم می‌کند و موجودی دوکان را زیاد، ولی **صندوق را
  // دست نمی‌زند** — چون پولی نگرفته‌ایم. هرجا صندوق حساب می‌شود باید
  // جدا شود، ورنه پول ساختگی در صندوق نشان داده می‌شد.
  function isGoodsPay(p) { return !!p && p.kind === "goods"; }

  // «مصرف خانه به جنس»: جنس از گدام برای خانه برداشته می‌شود.
  // موجودی کم می‌شود و ارزشش مصرف خانه است، ولی **صندوق دست نمی‌خورد** —
  // پولی از جعبه نرفته. ارزشش به **قیمت خرید** حساب می‌شود، نه فروش:
  // چیزی فروخته نشده، پس فایده‌ای هم نبوده؛ آنچه از دوکان رفته همان است
  // که برایش پول داده‌اید. اگر به نرخ فروش حساب می‌شد، مصرف خانه بزرگ‌تر
  // از واقعیت و فایده کوچک‌تر از واقعیت نشان داده می‌شد.
  function isGoodsExpense(e) { return !!e && e.kind === "goods"; }

  function debtMaps() {
    if (_debtCache) return _debtCache;
    var c = {}, s = {};
    sales.forEach(function (x) {
      if (x.paymentType === "credit" && x.customerId)
        c[x.customerId] = (c[x.customerId] || 0) + x.total;
    });
    custPayments.forEach(function (p) {
      if (p.customerId) c[p.customerId] = (c[p.customerId] || 0) - p.amount;
    });
    purchases.forEach(function (p) {
      if (p.supplierId) s[p.supplierId] = (s[p.supplierId] || 0) + (p.remaining || 0);
    });
    supPayments.forEach(function (p) {
      if (p.supplierId) s[p.supplierId] = (s[p.supplierId] || 0) - p.amount;
    });
    _debtCache = { c: c, s: s };
    return _debtCache;
  }
  function custDebt(c) {
    if (!c) return 0;
    return +(((c.opening || 0) + (debtMaps().c[c.id] || 0))).toFixed(2);
  }
  function supDebt(s) {
    if (!s) return 0;
    return +(((s.opening || 0) + (debtMaps().s[s.id] || 0))).toFixed(2);
  }
  // اجزای قرض مشتری/تامین‌کننده — برای نشان‌دادن «این رقم از کجا آمد»
  function custBreakdown(c) {
    var sale = 0, paid = 0;
    sales.forEach(function (x) {
      if (x.paymentType === "credit" && x.customerId === c.id) sale += x.total;
    });
    var goods = 0;
    custPayments.forEach(function (p) {
      if (p.customerId !== c.id) return;
      paid += p.amount;
      if (isGoodsPay(p)) goods += p.amount; // فقط برای نشان‌دادن، جدا شمرده می‌شود
    });
    // paid همیشه مجموع است (نقد + به جنس)، تا opening + sales − paid همان قرض بماند
    return { opening: c.opening || 0, sales: +sale.toFixed(2), paid: +paid.toFixed(2),
             paidGoods: +goods.toFixed(2), paidCash: +(paid - goods).toFixed(2) };
  }
  function supBreakdown(s) {
    var buy = 0, paid = 0;
    purchases.forEach(function (p) { if (p.supplierId === s.id) buy += (p.remaining || 0); });
    supPayments.forEach(function (p) { if (p.supplierId === s.id) paid += p.amount; });
    return { opening: s.opening || 0, buys: +buy.toFixed(2), paid: +paid.toFixed(2) };
  }
  // فیلد debt فقط یک «آینه» برای بک‌آپ/سنک است؛ اپ هیچ‌وقت از آن نمی‌خواند.
  function refreshDebtMirrors() {
    customers.forEach(function (c) { c.debt = custDebt(c); });
    suppliers.forEach(function (s) { s.debt = supDebt(s); });
  }
  // ---------- صندوق نقد ----------
  // مثل قرض‌ها، رقم صندوق هیچ‌جا ذخیره نمی‌شود؛ از رویدادها حساب می‌گردد:
  //   موجودی اول + فروش نقد + دریافت از مشتری + پول دستی داخل + تعدیل شمارش
  //   − خرید نقد − پرداخت به تامین‌کننده − مصارف خانه − پول دستی خارج
  function cashOpeningEntry() {
    var e = null;
    cashEntries.forEach(function (x) { if (x.kind === "opening") e = x; });
    return e;
  }
  // یگانه جایی که نوشته می‌شود «کدام رکورد پول را در صندوق می‌آورد یا می‌برد».
  // مانده، تفصیل، رد پول، و بخش صندوقِ گزارش‌ها همه از همین یک فهرست ساخته
  // می‌شوند.
  //
  // چرا: پیش از این همین قانون سه بار جدا نوشته شده بود (تفصیل، رد پول،
  // گزارش) و دو بار یکی از سه جا از قلم افتاد — یک بار «مصرف خانه به جنس»
  // که در رد پول نبود، و یک بار رکورد باطل‌کردن خرید که با شرط `paid > 0`
  // از رد پول می‌افتاد. هر دو بار رقم صندوق غلط شد و هیچ اروری بلند نشد.
  // حالا قانون تازه یک بار نوشته می‌شود و هر سه جا خودکار درست می‌مانند.
  //
  // هر رویداد: { date, amount, kind, label, entry?, opening? }
  //   amount → مثبت: پول داخل شد، منفی: پول خارج شد
  //   kind   → opening | sales | custPaid | purchasePaid | supPaid |
  //            expenses | manualIn | manualOut | adjust
  //
  // کارِ نمایش (مرتب‌کردن، ماندهٔ پی‌درپی) اینجا نیست؛ در cashMovements است.
  function cashEvents() {
    var out = [];
    sales.forEach(function (s) {
      if (s.paymentType !== "cash") return;
      out.push({ date: s.date, amount: s.total, kind: "sales",
        label: s.returnOf ? "برگشتی فروش نقد" : "فروش نقد" });
    });
    custPayments.forEach(function (p) {
      if (isGoodsPay(p)) return; // به جنس بود، پولی داخل صندوق نشد
      var c = findC(p.customerId);
      out.push({ date: p.date, amount: p.amount, kind: "custPaid",
        label: "دریافت از " + (c ? c.name : "مشتری") });
    });
    purchases.forEach(function (p) {
      // شرط «صفر نبودن» است، نه «بزرگ‌تر از صفر»: رکورد باطل‌کردن paid منفی
      // دارد و باید پول را پس بیاورد.
      if (!p.paid) return;
      out.push({ date: p.date, amount: -p.paid, kind: "purchasePaid",
        label: (p.reverseOf ? "برگشت خرید نقد — " : "خرید نقد — ") + (p.supplierName || "") });
    });
    supPayments.forEach(function (p) {
      var s = findS(p.supplierId);
      out.push({ date: p.date, amount: -p.amount, kind: "supPaid",
        label: "پرداخت به " + (s ? s.name : "تامین‌کننده") });
    });
    expenses.forEach(function (e) {
      if (isGoodsExpense(e)) return; // جنس از گدام رفت، نه پول از صندوق
      out.push({ date: e.date, amount: -e.amount, kind: "expenses",
        label: "مصرف خانه" + (e.note ? " — " + e.note : "") });
    });
    cashEntries.forEach(function (e) {
      // موجودی اول همیشه یکی است — openCashOpening پیش از ثبت، قبلی را
      // برمی‌دارد؛ پس این حلقه رقم را دوباره نمی‌شمارد.
      if (e.kind === "opening") out.push({ date: e.date, amount: e.amount, kind: "opening",
        label: "موجودی اول صندوق", opening: true });
      else if (e.kind === "in") out.push({ date: e.date, amount: e.amount, kind: "manualIn",
        entry: e, label: "پول داخل شد" + (e.note ? " — " + e.note : "") });
      else if (e.kind === "out") out.push({ date: e.date, amount: -e.amount, kind: "manualOut",
        entry: e, label: "پول خارج شد" + (e.note ? " — " + e.note : "") });
      else if (e.kind === "count") out.push({ date: e.date, amount: e.amount, kind: "adjust",
        label: (e.amount < 0 ? "کسری شمارش صندوق" : "زیادت شمارش صندوق") });
    });
    return out;
  }

  // در جدول تفصیل، رقم‌های خارج‌شونده مثبت نوشته می‌شوند (چون در نمایش
  // خودشان علامت «−» دارند)، پس علامت رویداد اینجا برگردانده می‌شود.
  var CASH_OUT_KINDS = { purchasePaid: 1, supPaid: 1, expenses: 1, manualOut: 1 };
  function cashBreakdown() {
    var b = { opening: 0, sales: 0, custPaid: 0,
              purchasePaid: 0, supPaid: 0, expenses: 0,
              manualIn: 0, manualOut: 0, adjust: 0 };
    cashEvents().forEach(function (e) {
      if (b[e.kind] === undefined) return;
      b[e.kind] += CASH_OUT_KINDS[e.kind] ? -e.amount : e.amount;
    });
    Object.keys(b).forEach(function (k) { b[k] = +b[k].toFixed(2); });
    return b;
  }
  function cashBalance() {
    var s = 0;
    cashEvents().forEach(function (e) { s += e.amount; });
    return +s.toFixed(2);
  }
  // جمع همهٔ حرکت‌ها بدون موجودی اول — برای حساب‌کردن موجودی اولِ درست
  // از روی پول شمرده‌شدهٔ امشب: موجودی اول = پول واقعی − همین جمع.
  function cashNetWithoutOpening() {
    var s = 0;
    cashEvents().forEach(function (e) { if (e.kind !== "opening") s += e.amount; });
    return +s.toFixed(2);
  }

  // ---------- محافظ صندوق ----------
  // در واقعیت از جعبه‌ای که ۳٬۰۰۰ دارد ۵٬۰۰۰ پرداخته نمی‌شود، پس صندوق
  // نباید منفی شود. هر جایی که پول از صندوق خارج می‌شود از اینجا می‌گذرد.
  //
  // تلهٔ مهم: اگر «موجودی اول» ثبت نشده باشد، رقم صندوق خودش غلط و پایین
  // است. آن‌وقت این محافظ خرید نقدیِ واقعی را به قرض ساختگی تبدیل می‌کرد
  // و روزی دفتر دوکان با دفتر تامین‌کننده جور نمی‌آمد — این از منفی‌بودن
  // صندوق بدتر است. پس در آن حالت هیچ رقمی عوض نمی‌شود؛ فقط ثبت موجودی
  // اول خواسته می‌شود، و راه «به‌هرحال ثبت کن» هم باز می‌ماند.
  //
  // o = { amount, what, fundNote, proceed(amount), creditLabel(bal, short),
  //       onCredit(bal, short), onBack() }
  // اگر پول کافی باشد true برمی‌گرداند و کار همان‌جا ادامه می‌یابد؛
  // ورنه شیت باز می‌شود، false برمی‌گردد و تصمیم با دکمه‌های شیت است.
  function guardCashOut(o) {
    var bal = cashBalance();
    if (o.amount <= bal) return true;
    var short = +(o.amount - bal).toFixed(2);

    function back() { closeSheet(); if (o.onBack) o.onBack(); }

    if (!cashOpeningEntry()) {
      openSheet(
        '<h2 style="color:var(--credit)">موجودی اول صندوق ثبت نشده</h2>' +

          'واقعیت است و اپ نمی‌داند پول کافی هست یا نی.<br>' +

          'در دفتر می‌نشست.</p>' +
        '<div class="actions"><button class="ghost" id="lcBack">لغو</button>' +

    var creditBtn = o.creditLabel
      ? '<button class="wbtn" id="lcCredit" style="width:100%;padding:13px;margin-bottom:9px;background:var(--credit)">' +
          esc(o.creditLabel(bal, short)) + '</button>'

    openSheet(
      '<h2 style="color:var(--danger)">پول صندوق کم است</h2>' +
      '<div class="sumbox" style="margin-bottom:12px">' +
        '<div class="sumrow"><span>پول در صندوق</span><span class="num">' + money(bal) + '</span></div>' +
        '<div class="sumrow"><span>' + esc(o.what) + '</span><span class="num">' + money(o.amount) + '</span></div>' +
        '<div class="sumrow total"><span>کم است</span><span class="num" style="color:var(--danger)">' + money(short) + '</span></div>' +
      '</div>' +
      '<p style="font-size:13.5px;line-height:1.9;color:var(--ink-soft);margin:0 0 12px">' +
        'صندوق منفی نمی‌شود. یکی از این راه‌ها را بزنید:</p>' +
      creditBtn +
      '<button class="wbtn" id="lcFund" style="width:100%;padding:13px;background:var(--primary)">' +
        'پول از جای دیگر آمد — ' + money(short) + ' «پول داخل» ثبت شود</button>' +
      '<div class="actions"><button class="ghost" id="lcBack" style="width:100%">رقم را اصلاح می‌کنم</button></div>'
    );
    if (o.creditLabel) {
      $("#lcCredit").addEventListener("click", function () {
        closeSheet(); o.onCredit(bal, short);
      });
    }
    $("#lcFund").addEventListener("click", function () {
      cashEntries.push({ id: id(), date: new Date().toISOString(), kind: "in",
        amount: short, note: o.fundNote || "پول از جای دیگر" });
      save(LS_CASH, cashEntries);
      closeSheet(); o.proceed(o.amount);
