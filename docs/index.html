  // کلید روز شمسی، برای اینکه شمارش هر شب یکی باشد
  function dayKeyOf(d) {
    var j = toJalali(d); if (!j) return "";
    var p = function (n) { return (n < 10 ? "0" + n : n); };
    return j.jy + "/" + p(j.jm) + "/" + p(j.jd);
  }

  // یک‌بار: «قرض قبلی» طوری حساب شود که رقم نشان‌داده‌شده هیچ تغییر نکند.
  function migrateDebtsToLedger() {
    var m = debtMaps(), changed = false;
    customers.forEach(function (c) {
      if (c.opening === undefined) {
        var stored = typeof c.debt === "number" ? c.debt : 0;
        c.opening = +(stored - (m.c[c.id] || 0)).toFixed(2);
        changed = true;
      }
    });
    suppliers.forEach(function (s) {
      if (s.opening === undefined) {
        var stored = typeof s.debt === "number" ? s.debt : 0;
        s.opening = +(stored - (m.s[s.id] || 0)).toFixed(2);
        changed = true;
      }
    });
    if (changed) { save0(LS_CUST, customers); save0(LS_SUP, suppliers); }
  }
  // ---------- تقویم هجری شمسی (نام ماه‌های افغانی) ----------
  // تاریخ‌ها در دیتا همیشه میلادی (ISO) ذخیره می‌شوند؛ فقط نمایش و
  // مرز ماه‌ها شمسی است. الگوریتم استاندارد جلالی (Borkowski).
  var J_MONTHS = ["حمل", "ثور", "جوزا", "سرطان", "اسد", "سنبله",
                  "میزان", "عقرب", "قوس", "جدی", "دلو", "حوت"];
  var J_BREAKS = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210,
                  1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];
  // تقسیم و باقی‌مانده با «بریدن به‌سوی صفر» (نه گِردکردن به پایین) —
  // الگوریتم جلالی بر همین بنا است و برای عددهای منفی فرق می‌کند.
  function jdiv(a, b) { return Math.trunc(a / b); }
  function jmod(a, b) { return a - Math.trunc(a / b) * b; }

  function jalCal(jy, withoutLeap) {
    var bl = J_BREAKS.length, gy = jy + 621, leapJ = -14, jp = J_BREAKS[0];
    var jm, jump, leap, leapG, march, n, i;
    if (jy < jp || jy >= J_BREAKS[bl - 1]) return null;
    for (i = 1; i < bl; i += 1) {
      jm = J_BREAKS[i]; jump = jm - jp;
      if (jy < jm) break;
      leapJ = leapJ + jdiv(jump, 33) * 8 + jdiv(jmod(jump, 33), 4);
      jp = jm;
    }
    n = jy - jp;
    leapJ = leapJ + jdiv(n, 33) * 8 + jdiv(jmod(n, 33) + 3, 4);
    if (jmod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
    leapG = jdiv(gy, 4) - jdiv((jdiv(gy, 100) + 1) * 3, 4) - 150;
    march = 20 + leapJ - leapG;
    if (!withoutLeap) {
      if (jump - n < 6) n = n - jump + jdiv(jump + 4, 33) * 33;
      leap = jmod(jmod(n + 1, 33) - 1, 4);
      if (leap === -1) leap = 4;
    }
    return { leap: leap, gy: gy, march: march };
  }
  function g2d(gy, gm, gd) {
    var d = jdiv((gy + jdiv(gm - 8, 6) + 100100) * 1461, 4) +
            jdiv(153 * jmod(gm + 9, 12) + 2, 5) + gd - 34840408;
    return d - jdiv(jdiv(gy + 100100 + jdiv(gm - 8, 6), 100) * 3, 4) + 752;
  }
  function d2g(jdn) {
    var j = 4 * jdn + 139361631;
    j = j + jdiv(jdiv(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
    var i = jdiv(jmod(j, 1461), 4) * 5 + 308;
    var gd = jdiv(jmod(i, 153), 5) + 1;
    var gm = jmod(jdiv(i, 153), 12) + 1;
    var gy = jdiv(j, 1461) - 100100 + jdiv(8 - gm, 6);
    return { gy: gy, gm: gm, gd: gd };
  }
  function d2j(jdn) {
    var gy = d2g(jdn).gy, jy = gy - 621, r = jalCal(jy, false);
    if (!r) return null;
    var jdn1f = g2d(gy, 3, r.march), jd, jm, k;
    k = jdn - jdn1f;
    if (k >= 0) {
      if (k <= 185) return { jy: jy, jm: 1 + jdiv(k, 31), jd: jmod(k, 31) + 1 };
      k -= 186;
    } else {
      jy -= 1; k += 179;
      if (r.leap === 1) k += 1;
    }
    jm = 7 + jdiv(k, 30); jd = jmod(k, 30) + 1;
    return { jy: jy, jm: jm, jd: jd };
  }
  function j2d(jy, jm, jd) {
    var r = jalCal(jy, true);
    if (!r) return null;
    return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - jdiv(jm, 7) * (jm - 7) + jd - 1;
  }
  // تاریخ میلادی → شمسی
  function toJalali(d) { return d2j(g2d(d.getFullYear(), d.getMonth() + 1, d.getDate())); }
  // شمسی → تاریخ میلادی (نیمه‌شب محلی)
  function jalaliToDate(jy, jm, jd) {
    var n = j2d(jy, jm, jd); if (n === null) return null;
    var g = d2g(n);
    return new Date(g.gy, g.gm - 1, g.gd, 0, 0, 0, 0);
  }

  function fmtDate(iso) {
    if (!iso) return "";
    var d = new Date(iso); if (isNaN(d)) return iso;
    var j = toJalali(d); if (!j) return iso;
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    return j.jy + "/" + p(j.jm) + "/" + p(j.jd);
  }
  // برچسب خوانا: «۴ اسد ۱۴۰۵»
  function fmtDateLong(iso) {
    if (!iso) return "";
    var d = new Date(iso); if (isNaN(d)) return iso;
    var j = toJalali(d); if (!j) return iso;
    return j.jd + " " + J_MONTHS[j.jm - 1] + " " + j.jy;
  }
  function todayISO() { return new Date().toISOString().slice(0, 10); }
  // کلید ماه شمسی، مثل «1405/05»
  function monthKeyOf(d) {
    var j = toJalali(d); if (!j) return "";
    return j.jy + "/" + (j.jm < 10 ? "0" + j.jm : j.jm);
  }
  function monthKey() { return monthKeyOf(new Date()); }
  // نام ماه از روی کلید «1405/05» → «اسد ۱۴۰۵»
  function monthKeyLabel(key) {
    var m = /^(\d{3,4})\/(\d{2})$/.exec(key || "");
    if (!m) return key || "";
    var mi = parseInt(m[2], 10);
    if (mi < 1 || mi > 12) return key;
    return J_MONTHS[mi - 1] + " " + m[1];
  }
  // روزهای مانده تا تاریخ خرابی (منفی = تیر شده). اگر تاریخ نبود null.
  function daysToExpiry(expiry) {
    if (!expiry) return null;
    var d = new Date(expiry); if (isNaN(d)) return null;
    var today = new Date(); today.setHours(0, 0, 0, 0);
    d.setHours(0, 0, 0, 0);
    return Math.round((d - today) / 86400000);
  }
  function expiryLabel(days) {
    if (days === null) return "";
    if (days < 0) return "تاریخ تیر شده";
    if (days === 0) return "امروز تیر می‌شود";
    return days + " روز تا خرابی";
  }
  function reasonLabel(r) { return r === "expired" ? "تاریخ‌تیر" : (r === "shortage" ? "کسری شمارش" : "خراب"); }
  // ---------- انبار عکس‌ها (IndexedDB) ----------
  // عکس‌ها عمداً جدا از فروش/قرض نگه داشته می‌شوند: جای localStorage
  // حدود ۵ مگابایت است و اگر عکس‌ها آنجا می‌رفتند، روزی پر می‌شد و
  // ثبت فروش ناکام می‌گردید. IndexedDB جای بسیار بیشتری دارد.
  var photoCache = {}; // {productId: dataURL} — برای رسم فوری صفحه
  var _pdb = null;
  function photoDB() {
    return new Promise(function (res, rej) {
      if (_pdb) return res(_pdb);
      if (!window.indexedDB) return rej(new Error("no-idb"));
      var r = indexedDB.open("dukan-photos", 1);
      r.onupgradeneeded = function () {
        if (!r.result.objectStoreNames.contains("photos")) r.result.createObjectStore("photos");
      };
      r.onsuccess = function () { _pdb = r.result; res(_pdb); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function photoTx(mode) {
    return photoDB().then(function (db) { return db.transaction("photos", mode).objectStore("photos"); });
  }
  function photoSave(pid, dataUrl) {
    photoCache[pid] = dataUrl;
    return photoTx("readwrite").then(function (st) {
      return new Promise(function (res, rej) {
        var q = st.put(dataUrl, pid);
        q.onsuccess = function () { res(); }; q.onerror = function () { rej(q.error); };
      });
    });
  }
  function photoRemove(pid) {
    delete photoCache[pid];
    return photoTx("readwrite").then(function (st) {
      return new Promise(function (res) { var q = st.delete(pid); q.onsuccess = q.onerror = function () { res(); }; });
    }).catch(function () {});
  }
  function photoLoadAll() {
    return photoTx("readonly").then(function (st) {
      return new Promise(function (res) {
        var out = {};
        var q = st.openCursor();
        q.onsuccess = function () {
          var c = q.result;
          if (!c) { photoCache = out; return res(out); }
          out[c.key] = c.value; c.continue();
        };
        q.onerror = function () { res({}); };
      });
    }).catch(function () { return {}; });
  }
  function photoClear() {
    photoCache = {};
    return photoTx("readwrite").then(function (st) {
      return new Promise(function (res) { var q = st.clear(); q.onsuccess = q.onerror = function () { res(); }; });
    }).catch(function () {});
  }
  function photoOf(p) { return p && photoCache[p.id] ? photoCache[p.id] : null; }
  function photoCount() { return Object.keys(photoCache).length; }

  // عکس گرفته‌شده کوچک می‌شود تا جا کم بگیرد و صفحهٔ فروش تیز بماند
  function shrinkImage(file, maxSize) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onerror = function () { rej(new Error("read")); };
      fr.onload = function () {
        var img = new Image();
        img.onerror = function () { rej(new Error("decode")); };
        img.onload = function () {
          var m = maxSize || 256;
          // برش مربعی از وسط تا تایل‌ها یک‌شکل باشند
          var side = Math.min(img.width, img.height);
          var sx = (img.width - side) / 2, sy = (img.height - side) / 2;
          var cv = document.createElement("canvas");
          cv.width = m; cv.height = m;
          var cx = cv.getContext("2d");
          cx.drawImage(img, sx, sy, side, side, 0, 0, m, m);
          res(cv.toDataURL("image/jpeg", 0.72));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  // ---------- شناسایی چشمی جنس (برای کسی که خط را خوب نمی‌خواند) ----------
  // رنگ ثابت از روی نام: همان جنس همیشه همان رنگ را دارد، پس چشم عادت می‌کند.
  // نام‌های دری حرف‌های مشترک زیاد دارند؛ با هش سادهٔ ۳۱ رنگ‌ها همه سبز
  // در می‌آمدند. پس FNV با «بهم‌ریختن» نهایی تا رنگ‌ها پخش شوند.
  function nameHue(name) {
    var h = 2166136261, s = String(name || "");
    for (var i = 0; i < s.length; i++) {
      h = (h ^ s.charCodeAt(i)) >>> 0;
      h = Math.imul(h, 16777619) >>> 0;
    }
    h = (h ^ (h >>> 16)) >>> 0; h = Math.imul(h, 2246822507) >>> 0;
    h = (h ^ (h >>> 13)) >>> 0; h = Math.imul(h, 3266489909) >>> 0;
    h = (h ^ (h >>> 16)) >>> 0;
    return h % 360;
  }
  function prodColor(name) { return "hsl(" + nameHue(name) + ",58%,42%)"; }
  function prodSoft(name) { return "hsl(" + nameHue(name) + ",58%,88%)"; }
  // حرف اول نام (نشانه‌های اضافی رد می‌شوند)
  function prodLetter(name) {
    var s = String(name || "").trim();
    for (var i = 0; i < s.length; i++) {
      var c = s.charAt(i);
      if (c !== " " && c !== "‌" && c !== "«" && c !== '"') return c;
    }
    return "؟";
  }
  // دایرهٔ رنگی با حرف اول — جای آیکن یکسانِ نوع جنس
  function prodBadge(p, size) {
    var sz = size || 42;
    return '<div class="ico" style="width:' + sz + 'px;height:' + sz + 'px;' +
      'background:' + prodSoft(p.name) + ';color:' + prodColor(p.name) + ';' +
      'font-size:' + Math.round(sz * 0.5) + 'px;font-weight:900;line-height:1">' +
      esc(prodLetter(p.name)) + '</div>';
  }
  function typeLabel(t) { return t === "weighted" ? "وزنی" : (t === "wifi" ? "وای‌فای" : "دانه‌ای"); }
  function typeIcon(t) { return t === "weighted" ? "⚖️" : (t === "wifi" ? "📶" : "🧃"); }
  function typeCls(t) { return t === "unit" ? "u" : "w"; }

  var toastTimer;
  function toast(msg, warn) {
    var t = $("#toast"); $("#toastMsg").textContent = msg;
    t.classList.toggle("warn", !!warn); t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }

  // ---------- Sales grid ----------
  // نوار نرخ‌ها: از روی نرخ‌های خود اجناس ساخته می‌شود (بدون تنظیم)
  var priceFilter = null;
  function renderPriceBar() {
    var bar = $("#priceBar"); if (!bar) return;
    var counts = {};
    products.forEach(function (p) { if (p.sell > 0) counts[p.sell] = (counts[p.sell] || 0) + 1; });
    var list = Object.keys(counts).map(parseFloat).sort(function (a, b) { return a - b; });
    // اگر نرخ‌ها خیلی کم است، نوار فایده‌ای ندارد
    if (list.length < 2) { bar.innerHTML = ""; bar.style.display = "none"; return; }
    bar.style.display = "flex";
    bar.innerHTML = '<button data-pf="all" class="' + (priceFilter === null ? "on" : "") + '">همه</button>' +
      list.map(function (v) {
        return '<button data-pf="' + v + '" class="' + (priceFilter === v ? "on" : "") + '">' + nf.format(v) + '</button>';
      }).join("");
  }

  function renderSaleGrid() {
    renderPriceBar();
    var q = $("#search").value.trim().toLowerCase();
    var list = products.filter(function (p) {
      if (q && p.name.toLowerCase().indexOf(q) === -1) return false;
      if (priceFilter !== null && p.sell !== priceFilter) return false;
      return true;
    });
    var g = $("#saleGrid");
    if (products.length === 0) {
      g.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="big">📦</div><p>هنوز جنسی ثبت نشده.<br>از بخش «اجناس» جنس اضافه کنید.</p></div>';
      return;
    }
    if (list.length === 0) {
      g.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="big">🔍</div><p>جنسی پیدا نشد</p></div>';
      return;
    }
    // ترتیب: ستاره‌دارها اول، بعد موجودها، بعد تمام‌شده‌ها (هیچ‌کدام پنهان نمی‌شود)
    list = list.slice().sort(function (a, b) {
      var sa = a.star ? 0 : 1, sb = b.star ? 0 : 1;
      if (sa !== sb) return sa - sb;
      var oa = a.qty > 0 ? 0 : 1, ob = b.qty > 0 ? 0 : 1;
      if (oa !== ob) return oa - ob;
      return a.name.localeCompare(b.name, "fa");
    });
    g.innerHTML = list.map(function (p) {
      var cls = typeCls(p.type) + (p.qty <= 0 ? " oosdim" : "");
      var oos = p.qty <= 0 ? '<div class="oos">موجود نیست</div>' : '';
      var ph = photoOf(p);
      // عکس (اگر باشد) تمام تایل را می‌گیرد تا از دور شناخته شود؛
      // ورنه دایرهٔ رنگی با حرف اول نام.
      if (ph) {
        // در تایل عکسی جای برچسب نوع نیست؛ برای وزنی/وای‌فای یک نشان خورد
        // می‌آید تا معلوم باشد که زدنش دیالوگ مقدار باز می‌کند.
        var tp = p.type === "unit" ? "" : '<span class="typetag">' + typeIcon(p.type) + '</span>';
        return '<div class="tile photo ' + cls + '" data-id="' + p.id + '" role="button" tabindex="0">' +
          '<img class="ph" src="' + ph + '" alt="" />' +
          (p.star ? '<span class="startag">⭐</span>' : '') + tp +
          '<div class="phcap"><div class="nm">' + esc(p.name) + '</div>' +
          '<div class="pr num">' + money(p.sell) + '</div></div>' +
          oos + '</div>';
      }
      return '<div class="tile ' + cls + '" data-id="' + p.id + '" role="button" tabindex="0">' +
        (p.star ? '<span class="startag">⭐</span>' : '') +
        prodBadge(p, 52) +
        '<div class="nm">' + esc(p.name) + '</div>' +
        '<div class="pr num">' + money(p.sell) + '</div>' +
        '<div class="badge">' + typeLabel(p.type) + '</div>' +
        oos + '</div>';
    }).join("");
  }

  function onTileTap(pid) {
    if (READONLY) return;
    var p = findP(pid); if (!p) return;
    if (p.qty <= 0) toast("اخطار: موجودی «" + p.name + "» صفر است", true);
    if (p.type === "weighted" || p.type === "wifi") openQtyDialog(p);
    else { addToCart(p.id, 1); }
  }

  // ---------- Cart ----------
  function cartLine(pid) { for (var i = 0; i < cart.length; i++) if (cart[i].productId === pid) return cart[i]; return null; }
  function addToCart(pid, qty) {
    if (qty <= 0) return;
    var line = cartLine(pid);
    if (line) line.qty = +(line.qty + qty).toFixed(3); else cart.push({ productId: pid, qty: qty });
    renderCart();
    buzz();
  }
  function removeLine(pid) { cart = cart.filter(function (l) { return l.productId !== pid; }); renderCart(); }
  // گام کم/زیادکردن برحسب واحد جنس
  function qtyStep(p) { return p.unit === "kg" ? 0.5 : 1; }
  // کم/زیادکردن تعداد یک سطر سبد؛ اگر به صفر رسید، سطر برداشته می‌شود
  function bumpLine(pid, dir) {
    var p = findP(pid), line = cartLine(pid);
    if (!p || !line) return;
    var q = +(line.qty + dir * qtyStep(p)).toFixed(3);
    if (q <= 0) removeLine(pid); else { line.qty = q; renderCart(); }
    buzz();
  }
  // لرزش خورد برای تأیید بی‌صدا (اگر دستگاه پشتیبانی کند)
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 15); } catch (e) {} }
  function cartTotal() {
    var s = 0; cart.forEach(function (l) { var p = findP(l.productId); if (p) s += p.sell * l.qty; }); return s;
  }
  function renderCart() {
    var area = $("#cartArea");
    if (cart.length === 0) {
      area.innerHTML = '<div class="cart-empty">سبد خالی است — یک جنس را بزنید</div>';
    } else {
      area.innerHTML = '<div class="cartlist">' + cart.map(function (l) {
        var p = findP(l.productId); if (!p) return "";
        return '<div class="citem">' +
          '<button class="x" data-rem="' + p.id + '" aria-label="برگرداندن">×</button>' +
          '<button class="qbtn" data-dec="' + p.id + '" aria-label="کم">−</button>' +
          '<button class="qbtn" data-inc="' + p.id + '" aria-label="زیاد">＋</button>' +
          '<div class="cn"><b>' + esc(p.name) + '</b><small class="num">' + qtyUnit(l.qty, p.unit) + ' × ' + money(p.sell) + '</small></div>' +
          '<div class="lt num">' + money(p.sell * l.qty) + '</div>' +
          '</div>';
      }).join("") + '</div>';
    }
    $("#cartTotal").textContent = money(cartTotal());
    var empty = cart.length === 0;
    $("#btnCash").disabled = empty; $("#btnCredit").disabled = empty;
    $("#cartHead").style.display = empty ? "none" : "flex";
    $("#cartCount").textContent = nf.format(cart.length) + " قلم";
    $("#changeToggle").style.display = empty ? "none" : "block";
    $("#changeRow").style.display = (!empty && changeOpen) ? "block" : "none";
    renderChange();
  }

  // ---------- حساب باقی (پیسهٔ پس‌دادن) — فقط ماشین‌حساب، در حساب‌ها اثری ندارد ----------
  var changeOpen = false;
  function renderChange() {
    var el = $("#changeRes"); if (!el) return;
    var paid = parseFloat($("#paidAmt").value);
    var total = cartTotal();
    if (isNaN(paid) || $("#paidAmt").value === "") {
      el.textContent = "باقی: —"; el.classList.remove("short"); return;
    }
    var diff = +(paid - total).toFixed(2);
    if (diff >= 0) { el.textContent = "باقی: " + money(diff); el.classList.remove("short"); }
    else { el.textContent = "کم است: " + money(-diff); el.classList.add("short"); }
  }
  // پاک‌کردن و بستن قطی باقی (بعد از هر فروش)
  function clearChange() {
    var i = $("#paidAmt"); if (i) i.value = "";
    changeOpen = false;
    var t = $("#changeToggle"); if (t) t.classList.remove("on");
    renderChange();
  }

  // کانال فروش: دوکان (پیش‌فرض) یا بازار. فروش‌های کهنه channel ندارند،
  // پس نبودنش یعنی «دوکان» — هیچ رقم گذشته تغییر نمی‌کند.
  // برگشتی همان کانال فروش اصلی را می‌گیرد، ورنه رقم‌های کانال نادرست می‌شد.
  function saleChannel(s) { return (s && s.channel === "bazaar") ? "bazaar" : "shop"; }

  function finishSale(type, customerName) {
    if (cart.length === 0) return;
    // فروش قرضی بدون نام اجازه ندارد — ورنه پول در دفتر قرض گم می‌شود
    if (type === "credit" && !(customerName || "").trim()) { toast("برای فروش قرض نام مشتری لازم است", true); return; }
    // موجودی نباید خاموش منفی شود (تایپ ۵۰۰ به‌جای ۵۰)
    if (!guardStockOut(cart.map(function (l) { return { productId: l.productId, qty: l.qty }; }),
      "این فروش بیشتر از موجودی دوکان است:",
      function () { commitSale(type, customerName); })) return;
    commitSale(type, customerName);
  }

  function commitSale(type, customerName) {
    var items = cart.map(function (l) {
      var p = findP(l.productId);
      // اگر قیمت خرید تخمینی بود، در خود فروش نشانی می‌شود تا گزارش راست بگوید
      return { productId: p.id, productName: p.name, quantity: l.qty, sellPrice: p.sell,
               buyPrice: p.buy || 0, buyEst: !!p.buyEstimated };
    });
    var total = cartTotal();
    var nm = (customerName || "").trim();
    var customerId = null;
    // فروش قرضی با نام: مشتری یافته/ساخته شود و قرض او زیاد گردد
    if (type === "credit" && nm) {
      var cust = null;
      for (var i = 0; i < customers.length; i++) { if (customers[i].name.trim().toLowerCase() === nm.toLowerCase()) { cust = customers[i]; break; } }
      if (!cust) { cust = { id: id(), name: nm, phone: "", opening: 0 }; customers.push(cust); }
      // قرض جدا زیاد نمی‌شود؛ خودِ همین فروش قرضی رویداد آن است
      customerId = cust.id;
      save(LS_CUST, customers);
    }
    sales.push({ id: id(), date: new Date().toISOString(), total: total, paymentType: type, customerName: nm || null, customerId: customerId, items: items });
    // کم‌کردن موجودی
    cart.forEach(function (l) { var p = findP(l.productId); if (p) p.qty = +(p.qty - l.qty).toFixed(3); });
    save(LS_S, sales); save(LS_P, products);
    cart = [];
    clearChange();
    renderCart(); renderSaleGrid();
    buzz(30);
    toast(type === "cash" ? "فروش نقد ثبت شد ✓" : "فروش قرض ثبت شد ✓");
  }

  // ---------- فروش‌های امروز + برگشتی (اصلاح فروش اشتباه) ----------
  // برگشتی فروش را پاک نمی‌کند؛ یک رکورد منفی ثبت می‌کند تا دفتر دست‌نخورده بماند:
  // موجودی پس می‌آید، قرض مشتری کم می‌شود، و فایده خودکار درست می‌گردد.
  function todaySales() {
    var start = new Date(); start.setHours(0, 0, 0, 0);
    return sales.filter(function (s) { return new Date(s.date) >= start; })
      .sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
  }

  function returnSale(sale) {
    if (sale.returned || sale.returnOf) return;
    var items = (sale.items || []).map(function (it) {
      return { productId: it.productId, productName: it.productName, quantity: -it.quantity,
               sellPrice: it.sellPrice, buyPrice: it.buyPrice };
    });
    // موجودی پس بیاید
    (sale.items || []).forEach(function (it) {
      var p = findP(it.productId);
      if (p) p.qty = +(p.qty + it.quantity).toFixed(3);
    });
    // قرض مشتری جدا کم نمی‌شود؛ خودِ رکورد منفی پایین، رویداد آن است
    sale.returned = true;
    sales.push({ id: id(), date: new Date().toISOString(), total: -sale.total,
      paymentType: sale.paymentType, customerName: sale.customerName, customerId: sale.customerId,
      channel: saleChannel(sale), items: items, returnOf: sale.id });
    save(LS_S, sales); save(LS_P, products); save(LS_CUST, customers);
    renderSaleGrid(); renderCustomers();
    buzz(30);
    toast("برگشتی ثبت شد ✓ موجودی پس آمد");
    openTodaySales();
  }

  function openTodaySales() {
    var list = todaySales();
    var rows = list.length === 0
      ? '<p style="color:var(--ink-soft);text-align:center;padding:12px">امروز فروشی ثبت نشده</p>'
      : list.map(function (s) {
          var t = new Date(s.date);
          function pad(n) { return n < 10 ? "0" + n : n; }
          var time = pad(t.getHours()) + ":" + pad(t.getMinutes());
          var kind = s.paymentType === "cash" ? "نقد" : "قرض" + (s.customerName ? " — " + esc(s.customerName) : "");
          if (saleChannel(s) === "bazaar") kind = "🏪 بازار — " + kind;
          var isRet = !!s.returnOf;
          var btn = (isRet || s.returned) ? '' :
            '<button class="wbtn" data-ret="' + s.id + '" style="background:var(--danger)">برگشتی</button>';
          var tag = isRet ? ' <span class="retbadge">برگشتی</span>'
                  : (s.returned ? ' <span class="retbadge">برگشت شد</span>' : '');
          return '<div class="iline">' + btn +
            '<div class="in"><b class="num">' + time + tag + '</b>' +
            '<small class="num">' + kind + ' • ' + (s.items || []).length + ' قلم</small></div>' +
            '<div class="lt num" style="color:' + (s.total < 0 ? "var(--danger)" : "var(--primary)") + '">' + money(s.total) + '</div></div>';
        }).join("");
    var net = 0; list.forEach(function (s) { net += s.total; });
    openSheet(
      '<h2>فروش‌های امروز</h2>' +
      '<div class="sumbox"><div class="sumrow total"><span>مجموع امروز</span><span class="num">' + money(net) + '</span></div></div>' +
      '<p style="color:var(--ink-soft);font-size:13px;margin:-2px 0 10px">اگر فروشی غلط ثبت شد، «برگشتی» را بزنید. فروش پاک نمی‌شود؛ اصلاحیه ثبت می‌گردد.</p>' +
      '<div style="max-height:46vh;overflow-y:auto">' + rows + '</div>' +
      '<div class="actions"><button class="primary" data-close>بستن</button></div>'
    );
  }

  function confirmReturn(s) {
    openSheet(
      '<h2>برگشتی فروش</h2>' +
      '<p style="margin:-6px 0 14px;font-size:15px">این فروش به مبلغ <b class="num">' + money(s.total) + '</b> برگشت داده شود؟<br>' +
      '<small style="color:var(--ink-soft)">موجودی پس می‌آید' + (s.paymentType === "credit" ? " و قرض مشتری کم می‌شود" : "") + '. فروش پاک نمی‌شود.</small></p>' +
      '<div class="actions"><button class="ghost" data-close>نی</button>' +
        '<button class="primary" id="retOk" style="background:var(--danger)">بلی، برگشتی</button></div>'
    );
    $("#retOk").addEventListener("click", function () { returnSale(s); });
  }

  // ---------- Products list ----------
  function renderProducts() {
    var el = $("#prodList");
    if (products.length === 0) {
      el.innerHTML = '<div class="empty"><div class="big">📦</div><p>هنوز جنسی ثبت نشده.<br>دکمه «جنس جدید» را بزنید.</p></div>';
      return;
    }
    // ستاره‌دارها اول تا در فهرست هم زود پیدا شوند
    var sorted = products.slice().sort(function (a, b) {
      var sa = a.star ? 0 : 1, sb = b.star ? 0 : 1;
      if (sa !== sb) return sa - sb;
      return a.name.localeCompare(b.name, "fa");
    });
    el.innerHTML = sorted.map(function (p) {
      var cls = typeCls(p.type);
      // عکس اگر باشد، ورنه دایرهٔ رنگی با حرف اول نام (نه آیکن یکسان نوع)
      var ph = photoOf(p);
      var ico = ph ? '<img class="ico ph" src="' + ph + '" alt="" />' : prodBadge(p, 46);
      var low = p.qty <= 0;
      var dte = daysToExpiry(p.expiry);
      var expWarn = (dte !== null && dte <= EXPIRY_WARN_DAYS)
        ? '<span class="expbadge">⏰ ' + expiryLabel(dte) + '</span>' : '';
      return '<div class="prow ' + cls + '">' +
        '<button class="star ' + (p.star ? "on" : "") + '" data-star="' + p.id + '" aria-label="پرفروش">⭐</button>' +
        '<div class="tapzone" data-edit="' + p.id + '" role="button" tabindex="0">' +
          ico +
          '<div class="info"><b>' + esc(p.name) + '</b><small>' + typeLabel(p.type) + ' • فروش: ' + money(p.sell) + '</small>' +
            (p.buyEstimated ? '<br><span class="estbadge">قیمت خرید تخمینی</span>' : '') +
            (expWarn ? '<br>' + expWarn : '') + '</div>' +
        '</div>' +
        '<div class="qty"><div class="q num ' + (low ? "low" : "") + '">' + qtyUnit(p.qty, p.unit) + '</div><small>' + (low ? "موجود نیست" : "موجود") + '</small></div>' +
        '<button class="del" data-del="' + p.id + '" aria-label="حذف">🗑</button>' +
        '</div>';
    }).join("");
  }

  // ---------- Modals ----------
  var overlay = $("#overlay"), sheet = $("#sheet");
  function openSheet(html) { sheet.innerHTML = html; overlay.classList.add("open"); }
  function closeSheet() { overlay.classList.remove("open"); sheet.innerHTML = ""; }
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeSheet(); });

  // Quantity dialog (weighted)
  function openQtyDialog(p) {
    var u = unitLabel(p.unit);
    var presets = p.unit === "gb" ? [[1, "۱"], [2, "۲"], [5, "۵"], [10, "۱۰"]] : [[0.5, "نیم"], [1, "۱"], [2, "۲"], [5, "۵"]];
    var presetHtml = presets.map(function (pr) { return '<button data-q="' + pr[0] + '">' + pr[1] + ' ' + u + '</button>'; }).join("");
    openSheet(
      '<h2>مقدار ' + esc(p.name) + '</h2>' +
      '<p style="margin:-6px 0 12px;color:var(--ink-soft);font-size:15px">قیمت فی ' + u + ': <b class="num">' + money(p.sell) + '</b></p>' +
      '<div class="qbtns">' + presetHtml + '</div>' +
      '<div class="field"><label>یا مقدار دلخواه (' + u + ')</label>' +
        '<input id="qCustom" type="number" inputmode="decimal" step="any" min="0" placeholder="0" /></div>' +
      '<div class="field"><label>یا به اندازهٔ پیسه (افغانی)</label>' +
        '<input id="qMoney" type="number" inputmode="decimal" step="any" min="0" placeholder="مثلاً: ۵۰" />' +
        '<small id="qMoneyOut" style="display:block;margin-top:6px;color:var(--ink-soft);font-size:14px">مقدار: —</small></div>' +
      '<div class="actions"><button class="ghost" data-close>لغو</button>' +
        '<button class="primary" id="qAdd">＋ اضافه به سبد</button></div>'
    );
    sheet.querySelectorAll(".qbtns button").forEach(function (b) {
      b.addEventListener("click", function () { addToCart(p.id, parseFloat(b.dataset.q)); closeSheet(); });
    });
    // مقدار از روی پیسه: مقدار = پیسه ÷ قیمت فی واحد
    function moneyQty() {
      var m = parseFloat($("#qMoney").value);
      if (!(m > 0) || !(p.sell > 0)) return 0;
      return +(m / p.sell).toFixed(3);
    }
    $("#qMoney").addEventListener("input", function () {
      var q = moneyQty();
      $("#qMoneyOut").textContent = q > 0 ? "مقدار: " + qtyUnit(q, p.unit) : "مقدار: —";
      if (q > 0) $("#qCustom").value = "";
    });
    $("#qCustom").addEventListener("input", function () {
      if ($("#qCustom").value !== "") { $("#qMoney").value = ""; $("#qMoneyOut").textContent = "مقدار: —"; }
    });
    $("#qAdd").addEventListener("click", function () {
      var v = parseFloat($("#qCustom").value);
      if (!(v > 0)) v = moneyQty();
      if (v > 0) { addToCart(p.id, v); closeSheet(); }
    });
    setTimeout(function () { $("#qCustom").focus(); }, 60);
  }

  // آخرین مشتریان قرضی — برای زدن با یک انگشت بدون تایپ
  function recentCustomers(n) {
    var seen = {}, out = [];
    // تازه‌ترین اول؛ اگر تاریخ یکسان بود، آنکه بعدتر ثبت شده تازه‌تر است
    var byDate = sales.map(function (s, i) { return { s: s, i: i }; })
      .filter(function (x) { return x.s.paymentType === "credit" && x.s.customerId; })
      .sort(function (a, b) {
        var d = (b.s.date || "").localeCompare(a.s.date || "");
        return d !== 0 ? d : b.i - a.i;
      })
      .map(function (x) { return x.s; });
    byDate.forEach(function (s) {
      if (out.length >= n || seen[s.customerId]) return;
      var c = findC(s.customerId); if (!c) return;
      seen[s.customerId] = 1; out.push(c);
    });
    // اگر کم بود، از فهرست مشتریان پر شود
    customers.forEach(function (c) { if (out.length < n && !seen[c.id]) { seen[c.id] = 1; out.push(c); } });
    return out;
  }

  // Credit customer dialog
  function openCreditDialog() {
    var recents = recentCustomers(6);
    var recentHtml = recents.length === 0 ? "" :
      '<label style="font-size:14px;font-weight:800;color:var(--ink-soft)">مشتریان اخیر</label>' +
      '<div class="chips" id="recentCusts" style="flex-wrap:wrap;margin:6px 0 12px">' +
      recents.map(function (c) {
        return '<button type="button" data-cust="' + esc(c.name) + '" style="flex:0 1 auto;padding:8px 12px">' + esc(c.name) + '</button>';
      }).join("") + '</div>';
    openSheet(
      '<h2>فروش قرض</h2>' +
      '<div class="field"><label>نام مشتری (حتمی)</label>' +
        '<input id="custName" type="text" placeholder="مثلاً: احمد" />' +
        '<div class="err" id="eCustName">نام مشتری را بنویسید — ورنه قرض در دفتر ثبت نمی‌شود</div></div>' +
      recentHtml +
      '<button class="addline" id="miscCust" style="margin:0 0 12px">👤 مشتری «متفرقه»</button>' +
      '<div class="actions"><button class="ghost" data-close>لغو</button>' +
        '<button class="primary" id="creditOk">◔ ثبت قرض</button></div>'
    );
    if ($("#recentCusts")) {
      $("#recentCusts").addEventListener("click", function (e) {
        var b = e.target.closest("[data-cust]"); if (!b) return;
        $("#custName").value = b.dataset.cust;
        $("#eCustName").classList.remove("show");
        buzz();
      });
    }
    $("#miscCust").addEventListener("click", function () { $("#custName").value = "متفرقه"; });
    $("#creditOk").addEventListener("click", function () {
      var nm = $("#custName").value.trim();
      if (!nm) { $("#eCustName").classList.add("show"); return; }
      closeSheet(); finishSale("credit", nm);
    });
    setTimeout(function () { $("#custName").focus(); }, 60);
  }

  // Add / edit product form
  // نرخ‌های رایج: اول از روی نرخ‌های خود دوکان، و اگر کم بود از نرخ‌های معمول
  function commonSellPrices() {
    var counts = {};
    products.forEach(function (p) { if (p.sell > 0) counts[p.sell] = (counts[p.sell] || 0) + 1; });
    var mine = Object.keys(counts).map(parseFloat)
      .sort(function (a, b) { return counts[b] - counts[a] || a - b; })
      .slice(0, 8);
    var defaults = [1, 5, 10, 20, 30, 40, 50, 60];
    defaults.forEach(function (v) { if (mine.length < 8 && mine.indexOf(v) === -1) mine.push(v); });
    return mine.sort(function (a, b) { return a - b; });
  }

    var photoData = editing ? photoOf(p) : null;

      var box = $("#fPhotoBox");
      if (photoData) box.innerHTML = '<img src="' + photoData + '" alt="" />';

    refreshPhotoBox();

    $("#fName").addEventListener("input", function () { if (!photoData) refreshPhotoBox(); });
    $("#fPhotoBtn").addEventListener("click", function () { $("#fPhotoInp").click(); });
    $("#fPhotoInp").addEventListener("change", function () {
      var f = this.files && this.files[0];
      this.value = ""; // تا گرفتن دوبارهٔ همان فایل هم کار کند
      if (!f) return;

      }).catch(function () { toast("عکس خوانده نشد", true); });

    $("#fPhotoDel").addEventListener("click", function () { photoData = null; refreshPhotoBox(); });

    sheet.querySelectorAll("#segType button").forEach(function (b) {
      b.addEventListener("click", function () {
        type = b.dataset.t;
        sheet.querySelectorAll("#segType button").forEach(function (x) { x.classList.toggle("on", x === b); });
        // واحد پیش‌فرض از روی نوع
        unit = type === "weighted" ? "kg" : (type === "wifi" ? "gb" : "piece");
        sheet.querySelectorAll("#segUnit button").forEach(function (x) { x.classList.toggle("on", x.dataset.u === unit); });

      });
    });
    sheet.querySelectorAll("#segUnit button").forEach(function (b) {
      b.addEventListener("click", function () {
        unit = b.dataset.u;
        sheet.querySelectorAll("#segUnit button").forEach(function (x) { x.classList.toggle("on", x === b); });

    $("#cartonToggle").addEventListener("click", function () {
      var box = $("#cartonBox");
      var open = box.style.display === "none";
      box.style.display = open ? "block" : "none";
      this.classList.toggle("on", open);
      if (open) setTimeout(function () { $("#cPrice").focus(); }, 40);
    });
    function calcCarton() {
      var pr = parseFloat($("#cPrice").value), cn = parseFloat($("#cCount").value);
      if (pr > 0 && cn > 0) {
        var each = +(pr / cn).toFixed(3);
        $("#cOut").textContent = "فی دانه: " + money(each) + " — در خانهٔ قیمت خرید گذاشته شد ✓";
        $("#fBuy").value = each;
      } else {
        $("#cOut").textContent = "فی دانه: —";
      }
      refreshMargin(); // فایده با قیمت خرید نو تازه شود
    }
    $("#cPrice").addEventListener("input", calcCarton);
    $("#cCount").addEventListener("input", calcCarton);

    // نرخ‌های آماده + نشان‌دادن زندهٔ فایده
    function refreshMargin() {
      var b = parseFloat($("#fBuy").value) || 0;
      var s = parseFloat($("#fSell").value);
      var out = $("#fMargin");
      if (!(s > 0)) { out.textContent = ""; return; }
      var m = +(s - b).toFixed(3);
      var pct = Math.round((m / s) * 100);
      var col = m <= 0 ? "var(--danger)" : (pct < 10 ? "var(--credit)" : "var(--primary)");
      out.innerHTML = 'فایدهٔ فی دانه: <b style="color:' + col + '">' + money(m) + '</b> (' + pct + '٪)' +
        (m <= 0 ? ' — <b style="color:var(--danger)">در ضرر!</b>' : '');
    }
    refreshMargin();
    $("#fBuy").addEventListener("input", refreshMargin);
    $("#fSell").addEventListener("input", refreshMargin);
    $("#sellPresets").addEventListener("click", function (e) {
      var b = e.target.closest("[data-sp]"); if (!b) return;
      $("#fSell").value = b.dataset.sp;
      $("#eSell").classList.remove("show");
      refreshMargin(); buzz();
    });
    $("#fSave").addEventListener("click", function () {
      var name = $("#fName").value.trim();
      var sell = parseFloat($("#fSell").value);
      var ok = true;
      $("#eName").classList.toggle("show", !name); if (!name) ok = false;
      var badSell = !($("#fSell").value !== "" && !isNaN(sell) && sell >= 0);
      $("#eSell").classList.toggle("show", badSell); if (badSell) ok = false;
      if (!ok) return;
      var rec = {
        id: editing ? p.id : id(),
        name: name, type: type, unit: unit,
        buy: parseFloat($("#fBuy").value) || 0,
        sell: sell,
        qty: parseFloat($("#fQty").value) || 0,
        expiry: $("#fExp").value || "",
        buyEstimated: $("#fEst").checked,
        star: !!p.star
      };
      // تغییر دستی تعداد یک جنس موجود نباید بی‌رد باشد — ورنه ۴۵ دانه
      // بدون هیچ نشانی گم می‌شد و کسری/دزدی همین‌جا پنهان می‌ماند.
      var oldQty = editing ? (p.qty || 0) : 0;
      var qtyDiff = editing ? +(rec.qty - oldQty).toFixed(3) : 0;
      function commitProduct() {
        if (editing) {
          for (var i = 0; i < products.length; i++) if (products[i].id === p.id) { products[i] = rec; break; }
          if (qtyDiff !== 0) recordStockAdjust(rec, oldQty, qtyDiff);
        } else products.push(rec);
        if (photoData) photoSave(rec.id, photoData); else photoRemove(rec.id);
        if (typeof syncPhotosOnChange === "function") syncPhotosOnChange();
        save(LS_P, products);
        closeSheet(); renderProducts(); renderSaleGrid();
        toast(editing ? "تغییرات ذخیره شد ✓" : "جنس ثبت شد ✓");
      }
      if (qtyDiff !== 0) { confirmQtyChange(rec, oldQty, qtyDiff, commitProduct); return; }
      commitProduct();
    });

    if (editing) {
      $("#fDelete").addEventListener("click", function () { confirmDelete(p); });
    }
    setTimeout(function () { if (!editing) $("#fName").focus(); }, 60);
  }

  // ---------- تغییر دستی تعداد جنس ----------
  // مثل شمارش ماهانه رفتار می‌کند: کم‌شدن = ضرر واقعی (در ضایعات ثبت
  // می‌شود تا از فایده کم گردد)، زیادشدن فقط رقم را درست می‌کند و
  // فایدهٔ ساختگی نمی‌سازد. در هر دو حالت یک رکورد شمارش برای رد می‌ماند.
  function confirmQtyChange(rec, oldQty, diff, run) {
    var loss = diff < 0 ? +((-diff) * (rec.buy || 0)).toFixed(2) : 0;
    openSheet(
      '<h2>تعداد «' + esc(rec.name) + '» عوض می‌شود</h2>' +
      '<div class="sumbox" style="margin-bottom:12px">' +
        '<div class="sumrow"><span>تعداد فعلی</span><span class="num">' + qtyUnit(oldQty, rec.unit) + '</span></div>' +
        '<div class="sumrow"><span>تعداد نو</span><span class="num">' + qtyUnit(rec.qty, rec.unit) + '</span></div>' +
        '<div class="sumrow total"><span>' + (diff < 0 ? "کسری" : "زیادت") + '</span>' +
          '<span class="num" style="color:' + (diff < 0 ? "var(--danger)" : "var(--primary)") + '">' +
          qtyUnit(Math.abs(diff), rec.unit) + '</span></div>' +
      '</div>' +
      '<p style="font-size:13.5px;line-height:1.95;color:var(--ink-soft);margin:0 0 12px">' +
        (diff < 0
          ? 'کسری ضرر واقعی است، پس <b style="color:var(--danger)">' + money(loss) + '</b> در ضایعات ثبت می‌شود و از فایده کم می‌گردد.'
          : 'زیادت فقط رقم موجودی را درست می‌کند و فایدهٔ ساختگی نمی‌سازد.') +
        '<br>در هر حال یک رکورد در «شمارش» می‌ماند تا رد این تغییر معلوم باشد.</p>' +
      '<div class="actions"><button class="ghost" data-close>نی، لغو</button>' +
        '<button class="primary" id="qcOk">بلی، ثبت کن</button></div>'
    );
    $("#qcOk").addEventListener("click", run);
  }
  function recordStockAdjust(rec, oldQty, diff) {
    var now = new Date().toISOString();
    stockCounts.push({ id: id(), month: monthKey(), productId: rec.id, productName: rec.name,
      unit: rec.unit, calculated: oldQty, counted: rec.qty, difference: diff,
      date: now, manual: true });
    if (diff < 0) {
      waste.push({ id: id(), productId: rec.id, productName: rec.name, unit: rec.unit,
        quantity: -diff, buyPrice: rec.buy || 0, date: now, reason: "shortage" });
    }
    save(LS_COUNTS, stockCounts); save(LS_WASTE, waste);
  }

  function confirmDelete(p) {
    openSheet(
      '<h2>حذف جنس</h2>' +
      '<p style="font-size:17px;margin:0 0 18px">آیا «' + esc(p.name) + '» حذف شود؟</p>' +
      '<div class="actions"><button class="ghost" data-close>نی</button>' +
        '<button class="primary danger" id="delYes">حذف</button></div>'
    );
    $("#delYes").addEventListener("click", function () {
      products = products.filter(function (x) { return x.id !== p.id; });
      cart = cart.filter(function (l) { return l.productId !== p.id; });
      photoRemove(p.id);
      if (typeof syncPhotosOnChange === "function") syncPhotosOnChange();
      save(LS_P, products);
      closeSheet(); renderProducts(); renderSaleGrid(); renderCart();
      toast("«" + p.name + "» حذف شد");
    });
  }

  // ---------- Purchases (فاکتور خرید) ----------
  function findPurchase(pid) { for (var i = 0; i < purchases.length; i++) if (purchases[i].id === pid) return purchases[i]; return null; }

  function renderPurchases() {
    var el = $("#purchaseList");
    if (purchases.length === 0) {
      el.innerHTML = '<div class="empty"><div class="big">🛒</div><p>هنوز فاکتور خریدی ثبت نشده.<br>دکمه «فاکتور خرید جدید» را بزنید.</p></div>';
      return;
    }
    var sorted = purchases.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    el.innerHTML = sorted.map(function (pu) {
      var rem = pu.remaining > 0 ? '<span class="rem num">باقی: ' + money(pu.remaining) + '</span>' : '<span class="paidz">تصفیه شد</span>';
      var tag = pu.reverseOf ? ' <span class="retbadge">باطل‌کردن</span>'
              : (pu.reversed ? ' <span class="retbadge">باطل شد</span>' : '');
      return '<div class="pcard" data-purchase="' + pu.id + '">' +
        '<div class="r1"><b>' + esc(pu.supplierName || "بدون نام") + tag + '</b><span class="dt num">' + fmtDate(pu.date) + '</span></div>' +
        '<div class="r2"><span class="num">مجموع: ' + money(pu.total) + '</span>' + rem + '</div></div>';
    }).join("");
  }

  function openPurchaseDetail(pu) {
    var rows = pu.items.map(function (it) {
      return '<div class="iline"><div class="in"><b>' + esc(it.productName) + '</b><small class="num">' + nf.format(it.qty) + ' × ' + money(it.buyPrice) + '</small></div>' +
        '<div class="lt num">' + money(it.qty * it.buyPrice) + '</div></div>';
    }).join("");
    openSheet(
      '<h2>فاکتور ' + esc(pu.supplierName || "") + '</h2>' +
      '<p style="margin:-6px 0 12px;color:var(--ink-soft);font-size:14px" class="num">تاریخ: ' + fmtDate(pu.date) + '</p>' +
      rows +
      '<div class="sumbox">' +
        '<div class="sumrow"><span>مجموع فاکتور</span><span class="num">' + money(pu.total) + '</span></div>' +
        '<div class="sumrow"><span>پرداخت‌شده</span><span class="paid num">' + money(pu.paid) + '</span></div>' +
        '<div class="sumrow total"><span>باقی‌مانده (قرض)</span><span class="rem num">' + money(pu.remaining) + '</span></div>' +
      '</div>' +
      (isVoided(pu)
        ? '<p style="text-align:center;color:var(--ink-soft);font-size:14px;margin:10px 0 0">' +
            (pu.reverseOf ? 'این خودش رکورد باطل‌کردن است' : '<b class="retbadge">باطل شد</b>') + '</p>'
        : '<button class="addline" id="puVoid" style="border-style:solid;color:var(--danger);border-color:var(--danger)">✖ باطل‌کردن این فاکتور (غلط ثبت شده)</button>') +
      '<div class="actions"><button class="primary" data-close>بستن</button></div>'
    );
    var vb = document.getElementById("puVoid");
    if (vb) vb.addEventListener("click", function () { voidPurchase(pu); });

  // Invoice builder (draft in memory)
  var draft = null;
  function syncDraftInputs() {
    if (!draft) return;
    var sn = $("#pSupplier"), ph = $("#pPhone"), dt = $("#pDate"), pd = $("#pPaid");
    if (sn) draft.supplierName = sn.value;
    if (ph) draft.phone = ph.value;
    if (dt) draft.date = dt.value;
    if (pd) draft.paid = parseFloat(pd.value) || 0;
  }
  function draftTotal() { var s = 0; draft.lines.forEach(function (l) { s += (l.qty || 0) * (l.buyPrice || 0); }); return s; }

  function openPurchaseForm() {
    if (products.length === 0) { toast("اول از بخش «اجناس» جنس اضافه کنید", true); return; }
    draft = { supplierName: "", phone: "", date: todayISO(), lines: [], paid: 0 };
    renderPurchaseForm();
  }

  function renderPurchaseForm() {
    var total = draftTotal();
    var rem = Math.max(0, total - (draft.paid || 0));
    var lines = draft.lines.length === 0
      ? '<p style="color:var(--ink-soft);font-size:14px;text-align:center;padding:6px 0">هنوز جنسی اضافه نشده</p>'
      : draft.lines.map(function (l, i) {
          return '<div class="iline">' +
            '<button class="x" data-rline="' + i + '" aria-label="حذف">×</button>' +
            '<div class="in"><b>' + esc(l.name) + '</b>' +
              '<div class="miniflds">' +
                '<label>تعداد (' + unitLabel(l.unit) + ')<input type="number" inputmode="decimal" step="any" min="0" data-lqty="' + i + '" value="' + l.qty + '" /></label>' +
                '<label>قیمت خرید<input type="number" inputmode="decimal" step="any" min="0" data-lbuy="' + i + '" value="' + l.buyPrice + '" /></label>' +
              '</div>' +
            '</div>' +
            '<div class="lt num" data-llt="' + i + '">' + money((l.qty || 0) * (l.buyPrice || 0)) + '</div>' +
          '</div>';
        }).join("");

    openSheet(
      '<h2>فاکتور خرید جدید</h2>' +
      '<div class="field"><label>نام تامین‌کننده</label>' +

      '<div class="field"><label>تاریخ</label>' +
        '<input id="pDate" type="date" value="' + (draft.date || "") + '" />' +
        '<small id="pDateJ" style="display:block;margin-top:6px;color:var(--ink-soft);font-size:13.5px">' +
          (draft.date ? "شمسی: " + fmtDateLong(draft.date) : "") + '</small></div>' +

    function recompute() {
      var t = draftTotal(); var r = Math.max(0, t - (parseFloat($("#pPaid").value) || 0));
      $("#pTotal").textContent = money(t); $("#pRem").textContent = money(r);
    }
    sheet.querySelectorAll("[data-lqty]").forEach(function (inp) {
      inp.addEventListener("input", function () {
        var i = +inp.dataset.lqty; draft.lines[i].qty = parseFloat(inp.value) || 0;
        var lt = sheet.querySelector('[data-llt="' + i + '"]'); if (lt) lt.textContent = money(draft.lines[i].qty * draft.lines[i].buyPrice);
        recompute();
      });
    });
    sheet.querySelectorAll("[data-lbuy]").forEach(function (inp) {
      inp.addEventListener("input", function () {
        var i = +inp.dataset.lbuy; draft.lines[i].buyPrice = parseFloat(inp.value) || 0;
        var lt = sheet.querySelector('[data-llt="' + i + '"]'); if (lt) lt.textContent = money(draft.lines[i].qty * draft.lines[i].buyPrice);
        recompute();
      });
    });
    sheet.querySelectorAll("[data-rline]").forEach(function (b) {
      b.addEventListener("click", function () { syncDraftInputs(); draft.lines.splice(+b.dataset.rline, 1); renderPurchaseForm(); });
    });
    $("#pPaid").addEventListener("input", recompute);
    // نشان‌دادن معادل شمسی تاریخِ انتخاب‌شده (خود تقویم میلادی است)
    $("#pDate").addEventListener("input", function () {
      var out = $("#pDateJ");
      if (out) out.textContent = this.value ? "شمسی: " + fmtDateLong(this.value) : "";
    });

    $("#pSave").addEventListener("click", savePurchase);
  }

  function openLinePicker() {
    var existingIds = draft.lines.map(function (l) { return l.productId; });
    var avail = products.filter(function (p) { return existingIds.indexOf(p.id) === -1; });
    var list = avail.length === 0
      ? '<p style="color:var(--ink-soft);text-align:center;padding:10px">همه اجناس در فاکتور اضافه شده‌اند</p>'

  // فورم «جنس نو» داخل فاکتور خرید — با ثبت فاکتور خودکار در اجناس ثبت می‌شود.

      });

  // ---------- سنجش فایدهٔ فی دانه ----------
  function margin(p) { return +(((p.sell || 0) - (p.buy || 0))).toFixed(3); }
  function marginPct(p) {
    if (!(p.sell > 0)) return null;
    return Math.round((((p.sell - (p.buy || 0)) / p.sell) * 100));
  }

  // آیا بعد از این خرید، نرخ فروش این جنس مشکل دارد؟
  // «ضرر» = قیمت خرید از فروش بیشتر یا برابر شد.
  // «فایده کم شد» = فایده نسبت به پیش از خرید بیش از ۱۰٪ پایین آمد.
  function marginAlert(p, oldBuy, isBrandNew, wasEstimated) {
    if (!(p.sell > 0)) return null; // هنوز نرخ فروش ندارد
    var newM = p.sell - (p.buy || 0);
    var oldM = p.sell - (oldBuy || 0);
    var isLoss = newM <= 0;
    var drop = oldM - newM;
    var isThin = !isLoss && !isBrandNew && oldM > 0 && drop > 0 && (drop / oldM) >= 0.1;
    if (!isLoss && !isThin) return null;
    return {
      productId: p.id, name: p.name,
      oldBuy: +(oldBuy || 0).toFixed(3), newBuy: +(p.buy || 0).toFixed(3),
      sell: p.sell,
      oldMargin: +oldM.toFixed(3), newMargin: +newM.toFixed(3),
      loss: isLoss, wasEstimated: !!wasEstimated
    };
  }

  // شیت اخطار نرخ — همان‌جا می‌شود نرخ فروش را درست کرد
  function openPriceAlerts(alerts) {
    var rows = alerts.map(function (a) {
      var col = a.loss ? "var(--danger)" : "var(--credit)";
      var head = a.loss ? "🔴 در ضرر می‌فروشید!" : "⚠️ فایده کم شد";
      return '<div style="border:2px solid ' + col + ';border-radius:12px;padding:12px;margin-bottom:10px">' +
        '<b style="color:' + col + '">' + head + '</b>' +
        '<div style="font-size:16px;font-weight:800;margin:6px 0 2px">' + esc(a.name) + '</div>' +
        '<small style="color:var(--ink-soft);line-height:1.9;display:block">' +
          'قیمت خرید: ' + money(a.oldBuy) + ' ← <b>' + money(a.newBuy) + '</b>' +
          (a.wasEstimated ? ' <span class="estbadge">تخمین درست شد</span>' : '') + '<br>' +
          'قیمت فروش فعلی: <b>' + money(a.sell) + '</b><br>' +
          'فایدهٔ فی دانه: ' + money(a.oldMargin) + ' ← <b style="color:' + col + '">' + money(a.newMargin) + '</b>' +
        '</small>' +
        '<div style="display:flex;gap:8px;align-items:center;margin-top:10px">' +
          '<input type="number" inputmode="decimal" step="any" min="0" data-newsell="' + a.productId + '" value="' + a.sell + '" ' +
            'style="flex:1 1 0;min-width:0;font:inherit;font-size:17px;font-weight:800;padding:9px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)" />' +
          '<small style="flex:0 0 auto;color:var(--ink-soft);font-size:12.5px">نرخ فروش نو</small>' +
        '</div>' +
        '<small data-newmargin="' + a.productId + '" style="display:block;margin-top:6px;color:var(--ink-soft);font-size:13px"></small>' +
        '</div>';
    }).join("");

    openSheet(
      '<h2>بازبینی نرخ فروش</h2>' +
      '<p style="margin:-6px 0 12px;color:var(--ink-soft);font-size:13.5px">فاکتور ثبت شد ✓ ولی قیمت خرید این اجناس بالا رفته. اگر می‌خواهید، نرخ فروش را همین‌جا درست کنید.</p>' +
      '<div style="max-height:52vh;overflow-y:auto">' + rows + '</div>' +
      '<div class="actions"><button class="ghost" data-close>فعلاً نی</button>' +
        '<button class="primary" id="savePrices">💾 ذخیرهٔ نرخ‌ها</button></div>'
    );

    function refreshMargins() {
      alerts.forEach(function (a) {
        var inp = sheet.querySelector('[data-newsell="' + a.productId + '"]');
        var out = sheet.querySelector('[data-newmargin="' + a.productId + '"]');
        if (!inp || !out) return;
        var s = parseFloat(inp.value);
        if (!(s > 0)) { out.textContent = ""; return; }
        var m = +(s - a.newBuy).toFixed(3);
        var pct = Math.round((m / s) * 100);
        out.innerHTML = 'فایدهٔ نو: <b style="color:' + (m > 0 ? "var(--primary)" : "var(--danger)") + '">' +
          money(m) + '</b> (' + pct + '٪)';
      });
    }
    refreshMargins();
    sheet.querySelectorAll("[data-newsell]").forEach(function (i) {
      i.addEventListener("input", refreshMargins);
    });
    $("#savePrices").addEventListener("click", function () {
      var n = 0;
      alerts.forEach(function (a) {
        var inp = sheet.querySelector('[data-newsell="' + a.productId + '"]');
        if (!inp) return;
        var s = parseFloat(inp.value);
        var p = findP(a.productId);
        if (p && s > 0 && s !== p.sell) { p.sell = s; n++; }
      });
      if (n) { save(LS_P, products); renderProducts(); renderSaleGrid(); }
      closeSheet();
      toast(n ? ("نرخ " + n + " جنس تازه شد ✓") : "نرخی تغییر نکرد");
    });
  }

  function savePurchase() {
    syncDraftInputs();
    var name = (draft.supplierName || "").trim();
    var okName = !!name;
    if ($("#ePSup")) $("#ePSup").classList.toggle("show", !okName);
    var validLines = draft.lines.filter(function (l) { return l.qty > 0; });
    if (!okName) return;
    if (validLines.length === 0) { toast("حداقل یک جنس با تعداد بیشتر از صفر اضافه کنید", true); return; }

    var total = 0; validLines.forEach(function (l) { total += l.qty * l.buyPrice; });
    var paid = draft.paid || 0;

    // صندوق نباید منفی شود. اگر پول کافی نیست، خودِ دوکان‌دار تصمیم
    // می‌گیرد: باقی قرض تامین‌کننده شود، یا پول از جای دیگر آمده باشد.
    if (paid > 0) {
      var d = draft; // draft داخل commitPurchase پاک می‌شود
      var ok = guardCashOut({
        amount: paid,
        what: "پرداخت این فاکتور",
        fundNote: "برای خرید — " + name,
        creditLabel: function (bal, short) {
          return "فقط " + money(bal) + " پرداخت شد — " + money(short) + " قرض تامین‌کننده";
        },
        onCredit: function (bal) { draft = d; commitPurchase(validLines, total, bal, name); },
        proceed: function (amt) { draft = d; commitPurchase(validLines, total, amt, name); },
        onBack: function () { draft = d; renderPurchaseForm(); }
      });
      if (!ok) return;
    }
    commitPurchase(validLines, total, paid, name);
  }

  function commitPurchase(validLines, total, paid, name) {
    var remaining = Math.max(0, total - paid);

    var sup = null;
    for (var i = 0; i < suppliers.length; i++) { if (suppliers[i].name.trim().toLowerCase() === name.toLowerCase()) { sup = suppliers[i]; break; } }
    if (!sup) { sup = { id: id(), name: name, phone: draft.phone || "", debt: 0 }; suppliers.push(sup); }
    else if (draft.phone && !sup.phone) sup.phone = draft.phone;

    var priceAlerts = []; // اجناسی که بعد از این خرید فایده‌شان کم/منفی شد
    validLines.forEach(function (l) {
      // جنس نو: اول در اجناس ثبت شود (تعداد ۰، بعد از حلقه پایین زیاد می‌شود)
      var isBrandNew = false;
      if (l.isNew && !findP(l.productId)) {
        products.push({ id: l.productId, name: l.name, type: l.type || "unit", unit: l.unit, buy: l.buyPrice, sell: l.sellPrice || 0, qty: 0, expiry: "" });
        isBrandNew = true;
      }
      var p = findP(l.productId);
      if (!p) return;
      // قیمت خرید = اوسط وزنی موجودی کهنه و خرید نو (اگر موجودی نبود، قیمت نو)
      var oldQty = p.qty > 0 ? p.qty : 0;
      var oldBuy = p.buy || 0;
      var wasEstimated = !!p.buyEstimated;
      // عکس قیمت خرید پیش از این فاکتور — تا اگر باطل شد بشود پسش گرداند
      l.prevBuy = isBrandNew ? undefined : oldBuy;
      l.prevEst = wasEstimated;
      // اگر قیمت کهنه تخمینی بود، دیگر با آن اوسط گرفته نمی‌شود —
      // قیمت واقعی این خرید جای آن را می‌گیرد و نشان «تخمینی» برداشته می‌شود.
      if (p.buyEstimated) {
        p.buy = l.buyPrice;
        p.buyEstimated = false;
      } else {
        p.buy = oldQty > 0 ? +(((oldQty * oldBuy) + (l.qty * l.buyPrice)) / (oldQty + l.qty)).toFixed(2) : l.buyPrice;
      }
      p.qty = +(p.qty + l.qty).toFixed(3);

      // سنجش فایده بعد از خرید — تا ضرر خاموش پنهان نماند
      var a = marginAlert(p, oldBuy, isBrandNew, wasEstimated);
      if (a) priceAlerts.push(a);
    });
    // قرض تامین‌کننده جدا زیاد نمی‌شود؛ «باقی‌ماندهٔ» خودِ فاکتور رویداد آن است

    purchases.push({
      id: id(), supplierId: sup.id, supplierName: sup.name, date: draft.date || todayISO(),
      // ts = لحظهٔ ثبت. date را کاربر انتخاب می‌کند و فقط «روز» دارد.
      ts: new Date().toISOString(),
      total: total, paid: paid, remaining: remaining,
      items: validLines.map(function (l) {
        return { productId: l.productId, productName: l.name, qty: l.qty, buyPrice: l.buyPrice,
                 prevBuy: l.prevBuy, prevEst: l.prevEst };
      })
    });

    save(LS_PUR, purchases); save(LS_SUP, suppliers); save(LS_P, products);
    draft = null; closeSheet();
    renderPurchases(); renderSuppliers(); renderProducts(); renderSaleGrid();
    toast("فاکتور خرید ثبت شد ✓ موجودی زیاد شد");
    // فاکتور ثبت شد؛ حالا اگر نرخ فروشی مشکل دارد، همان‌جا نشان داده شود
    if (priceAlerts.length) setTimeout(function () { openPriceAlerts(priceAlerts); }, 350);
  }

  // ---------- Suppliers (قرض تامین‌کننده) ----------
  function renderSuppliers() {
    var el = $("#supplierList");
    var addBtn = '<div style="padding:8px 14px 4px"><button class="addline" id="addSupplierBtn" style="margin:0">＋ افزودن تامین‌کننده (قرض قبلی)</button></div>';
    if (suppliers.length === 0) {
      el.innerHTML = addBtn + '<div class="empty"><div class="big">🤝</div><p>هنوز تامین‌کننده‌ای نیست.<br>با فاکتور خرید یا دکمهٔ بالا اضافه کنید.</p></div>';
      return;
    }
    var sorted = suppliers.filter(debtMatch).sort(function (a, b) { return supDebt(b) - supDebt(a); });
    if (sorted.length === 0) {
      el.innerHTML = addBtn + '<div class="empty"><div class="big">🔍</div><p>تامین‌کننده‌ای با این نام پیدا نشد</p></div>';
      return;
    }
    el.innerHTML = addBtn + sorted.map(function (s) {
      var d = supDebt(s);
      var low = d > 0;
      var lbl = d > 0 ? "قرض ما" : (d < 0 ? "پیش‌پرداخت ما" : "تصفیه");
      return '<div class="prow u">' +
        '<div class="tapzone" data-supplier="' + s.id + '" role="button" tabindex="0">' +
          '<div class="ico">🤝</div>' +
          '<div class="info"><b>' + esc(s.name) + '</b><small>' + (s.phone ? esc(s.phone) : "بدون نمبر") + '</small></div>' +
        '</div>' +
        '<div class="qty"><div class="q num ' + (low ? "low" : "") + '">' + money(Math.abs(d)) + '</div><small>' + lbl + '</small></div>' +
        '</div>';
    }).join("");
  }

  function openSupplierDetail(s) {
    var sd = supDebt(s), sb = supBreakdown(s);
    var theirs = purchases.filter(function (p) { return p.supplierId === s.id; })
      .sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    var rows = theirs.length === 0 ? '<p style="color:var(--ink-soft);text-align:center;padding:8px">فاکتوری نیست</p>'
      : theirs.map(function (pu) {
          return '<div class="iline"><div class="in"><b class="num">' + fmtDate(pu.date) + '</b><small class="num">مجموع: ' + money(pu.total) + ' • پرداخت: ' + money(pu.paid) + '</small></div><div class="lt num">' + (pu.remaining > 0 ? '<span style="color:var(--danger)">' + money(pu.remaining) + '</span>' : '✓') + '</div></div>';
        }).join("");
    openSheet(
      '<h2>' + esc(s.name) + '</h2>' +
      (s.phone ? '<p style="margin:-6px 0 10px;color:var(--ink-soft)" class="num">' + esc(s.phone) + '</p>' : '') +
      // این رقم از کجا آمد — هر جزء قابل دیدن است
      '<div class="sumbox">' +
        '<div class="sumrow"><span>قرض قبلی</span><span class="num">' + money(sb.opening) + '</span></div>' +
        '<div class="sumrow"><span>باقی‌ماندهٔ فاکتورها</span><span class="num">＋ ' + money(sb.buys) + '</span></div>' +
        '<div class="sumrow"><span>پرداخت‌های ما</span><span class="num">− ' + money(sb.paid) + '</span></div>' +
        '<div class="sumrow total"><span>' + (sd < 0 ? "پیش‌پرداخت ما نزد او" : "مجموع قرض ما") + '</span><span class="rem num">' + money(Math.abs(sd)) + '</span></div>' +
      '</div>' +
      '<button class="addline" id="payBtn" style="border-style:solid;background:var(--primary);color:var(--primary-ink);border-color:var(--primary)">💵 پرداخت به تامین‌کننده</button>' +
      '<label style="font-size:15px;font-weight:800;color:var(--ink-soft)">رسیدهای پرداخت</label>' +
      '<div style="margin-top:6px">' + payReceiptRows(supPayments, "supplierId", s.id) + '</div>' +
      '<label style="font-size:15px;font-weight:800;color:var(--ink-soft)">فاکتورها</label>' +
      '<div style="margin-top:6px">' + rows + '</div>' +
      '<div class="actions"><button class="primary" data-close>بستن</button></div>'
    );
    $("#payBtn").addEventListener("click", function () { openPayDialog(s); });
  }

  // سطرهای رسید پرداخت/دریافت (تاریخ + مبلغ)
  function payReceiptRows(list, key, refId) {
    var mine = list.filter(function (x) { return x[key] === refId; })
      .sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    if (mine.length === 0) return '<p style="color:var(--ink-soft);text-align:center;padding:8px">رسیدی ثبت نشده</p>';
    return mine.map(function (r) {
      // رسید «به جنس» باید در نگاه اول از رسید نقدی فرق کند
      var sub = isGoodsPay(r)
        ? '<span class="estbadge">به جنس</span> <span class="num">' +
            nf.format(r.qty) + ' ' + unitLabel(r.unit) + ' ' + esc(r.productName) +
            ' × ' + money(r.unitPrice) + '</span>'
        : 'رسید نقدی';
      var tag = r.reverseOf ? ' <span class="retbadge">باطل‌کردن</span>'
              : (r.reversed ? ' <span class="retbadge">باطل شد</span>' : '');
      // دکمهٔ باطل فقط روی رسید سالم — تا باطلِ باطل نشود
      var btn = isVoided(r) ? '' :
        '<button class="wbtn" data-void' + (key === "customerId" ? "cp" : "sp") + '="' + r.id + '" style="background:var(--danger)">باطل</button>';
      return '<div class="iline">' + btn +
        '<div class="in"><b class="num">' + fmtDate(r.date) + tag + '</b><small>' + sub + '</small></div>' +
        '<div class="lt num" style="color:var(--primary)">' + money(r.amount) + '</div></div>';
    }).join("");
  }

  function openPayDialog(s) {
    openSheet(
      '<h2>پرداخت به ' + esc(s.name) + '</h2>' +
      '<p style="margin:-6px 0 12px;color:var(--ink-soft)">قرض فعلی: <b class="num">' + money(supDebt(s)) + '</b></p>' +
      '<div class="field"><label>مقدار پرداخت (افغانی)</label>' +
        '<input id="payAmt" type="number" inputmode="decimal" step="any" min="0" placeholder="0" /></div>' +
      '<div class="actions"><button class="ghost" data-close>لغو</button>' +
        '<button class="primary" id="payOk">ثبت پرداخت</button></div>'
    );
    function commitPay(amt) {
      // خودِ رسید پرداخت رویداد کم‌شدن قرض است؛ اگر بیشتر از قرض بود،
      // رقم منفی می‌شود و «پیش‌پرداخت» نشان داده می‌شود.
      supPayments.push({ id: id(), supplierId: s.id, date: new Date().toISOString(), amount: amt });
      save(LS_SUP, suppliers); save(LS_SPAY, supPayments);
      renderSuppliers();
      openSupplierDetail(s); // بازکردن دوباره تا رسید جدید دیده شود
      toast("رسید پرداخت ثبت شد ✓");
    }
    $("#payOk").addEventListener("click", function () {
      var amt = parseFloat($("#payAmt").value) || 0;
      if (amt <= 0) return;
      // پول این پرداخت از صندوق می‌رود، پس صندوق نباید منفی شود
      if (!guardCashOut({
        amount: amt,
        what: "پرداخت به " + s.name,
        fundNote: "برای پرداخت به " + s.name,
        creditLabel: function (bal) { return "فقط " + money(bal) + " پرداخت شد — باقی قرض بماند"; },
        onCredit: function (bal) { if (bal > 0) commitPay(bal); else toast("صندوق خالی است", true); },
        proceed: function (a) { commitPay(a); },
        onBack: function () { openPayDialog(s); }
      })) return;
      commitPay(amt);
    });
    setTimeout(function () { $("#payAmt").focus(); }, 60);
  }

  // ---------- Customers (قرض مشتری) ----------
  function renderCustomers() {
    var el = $("#customerList");
    var addBtn = '<div style="padding:8px 14px 4px"><button class="addline" id="addCustomerBtn" style="margin:0">＋ افزودن مشتری قرض‌دار (قرض قبلی)</button></div>';
    if (customers.length === 0) {
      el.innerHTML = addBtn + '<div class="empty"><div class="big">👤</div><p>هنوز مشتری قرضداری نیست.<br>با فروش «قرض» یا دکمهٔ بالا اضافه کنید.</p></div>';
      return;
    }
    var sorted = customers.filter(debtMatch).sort(function (a, b) { return custDebt(b) - custDebt(a); });
    if (sorted.length === 0) {
      el.innerHTML = addBtn + '<div class="empty"><div class="big">🔍</div><p>مشتری‌ای با این نام پیدا نشد</p></div>';
      return;
    }
    el.innerHTML = addBtn + sorted.map(function (c) {
      var d = custDebt(c);

      var lbl = d > 0 ? "قرض او" : (d < 0 ? "پیش‌پرداخت او" : "تصفیه");

        '<div class="tapzone" data-customer="' + c.id + '" role="button" tabindex="0">' +
          '<div class="ico">👤</div>' +

        '</div>' +
        '<div class="qty"><div class="q num ' + (low ? "low" : "") + '">' + money(Math.abs(d)) + '</div><small>' + lbl + '</small></div>' +
        '</div>';

  }

  // افزودن قرض قبلی (مشتری یا تامین‌کننده) که پیش از اپ وجود داشت.
  function openDebtorForm(kind) {

    openSheet(

      '<p style="margin:-6px 0 12px;color:var(--ink-soft);font-size:13px">برای قرض‌هایی که از قبل (پیش از اپ) وجود داشت. اگر نام از قبل باشد، به قرضش اضافه می‌شود.</p>' +
      '<div class="field"><label>نام</label><input id="dbName" type="text" placeholder="نام" /><div class="err" id="eDbName">نام را بنویسید</div></div>' +
      '<div class="field"><label>نمبر تیلفون (اختیاری)</label><input id="dbPhone" type="text" inputmode="tel" placeholder="07..." style="direction:ltr;text-align:right" /></div>' +
      '<div class="field"><label>' + (isCust ? 'مبلغ قرض او به ما (افغانی)' : 'مبلغ قرض ما به او (افغانی)') + '</label><input id="dbAmt" type="number" inputmode="decimal" step="any" min="0" placeholder="0" /><div class="err" id="eDbAmt">مبلغ را درست بنویسید</div></div>' +
      '<div class="actions"><button class="ghost" data-close>لغو</button><button class="primary" id="dbOk">ثبت</button></div>'
    );
    $("#dbOk").addEventListener("click", function () {
      var nm = $("#dbName").value.trim();
      var amt = parseFloat($("#dbAmt").value);
      var badN = !nm;
      var badA = !($("#dbAmt").value !== "" && !isNaN(amt) && amt >= 0);
      $("#eDbName").classList.toggle("show", badN);
      $("#eDbAmt").classList.toggle("show", badA);
      if (badN || badA) return;
      var phone = $("#dbPhone").value.trim();
      var arr = isCust ? customers : suppliers;
      var found = null;
      for (var i = 0; i < arr.length; i++) { if (arr[i].name.trim().toLowerCase() === nm.toLowerCase()) { found = arr[i]; break; } }
      // «قرض قبلی» در opening ثبت می‌شود — نقطهٔ شروع دفتر
      if (found) { found.opening = +((found.opening || 0) + amt).toFixed(2); if (phone && !found.phone) found.phone = phone; }
      else { arr.push({ id: id(), name: nm, phone: phone, opening: amt }); }
      save(isCust ? LS_CUST : LS_SUP, arr);
      closeSheet();
      if (isCust) renderCustomers(); else renderSuppliers();
      toast("ثبت شد ✓");
    });
    setTimeout(function () { $("#dbName").focus(); }, 60);
  }

      '<div class="sumbox">' +

          : '<div class="sumrow"><span>دریافت‌های ما</span><span class="num">− ' + money(cb.paid) + '</span></div>') +

      '</div>' +
      '<button class="addline" id="cPayBtn" style="border-style:solid;background:var(--primary);color:var(--primary-ink);border-color:var(--primary)">💵 دریافت پرداخت از مشتری</button>' +
      '<button class="addline" id="cGoodsBtn" style="border-style:solid;background:var(--credit);color:#fff;border-color:var(--credit)">🌾 دریافت به جنس (پول ندارد)</button>' +
      '<label style="font-size:15px;font-weight:800;color:var(--ink-soft)">رسیدهای دریافت</label>' +
      '<div style="margin-top:6px">' + payReceiptRows(custPayments, "customerId", c.id) + '</div>' +
      '<label style="font-size:15px;font-weight:800;color:var(--ink-soft)">فروش‌های قرضی</label>' +
      '<div style="margin-top:6px">' + rows + '</div>' +
      '<div class="actions"><button class="primary" data-close>بستن</button></div>'
    );
    $("#cPayBtn").addEventListener("click", function () { openCustomerPay(c); });
    $("#cGoodsBtn").addEventListener("click", function () { openCustomerGoods(c); });

  // ---------- فروش بازار ----------
  // جنسی که به‌جای پول از مشتری گرفته شده (تخم مرغ، آرد) در بازار به نقد
  // فروخته می‌شود. رکوردش همان رکورد فروش عادی است، فقط channel="bazaar"،
  // پس موجودی، قیمت تمام‌شد و فایده خودکار درست حساب می‌شوند — ولی در
  // گزارش‌ها جدا دیده می‌شود.
  // عمداً جدا از صفحهٔ فروش است (نه یک دکمهٔ حالت): اگر حالت روشن می‌ماند،
  // فروش‌های دوکان اشتباهی بازار ثبت می‌شدند و هر دو رقم خراب می‌شد.
  function renderBazaar(el) {
    var head = '<div class="subhead"><button class="back moreBack" aria-label="بازگشت">→</button><h3>فروش بازار</h3></div>';
    if (products.length === 0) {
      el.innerHTML = head + '<div class="empty"><div class="big">🏪</div><p>هنوز جنسی نیست.</p></div>';
      return;
    }
    var r = computeReport("all");
    var mine = sales.filter(function (s) { return saleChannel(s) === "bazaar"; })
      .sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    var rows = mine.length === 0
      ? '<p style="color:var(--ink-soft);text-align:center;padding:10px;font-size:14px">هنوز فروش بازاری ثبت نشده</p>'
      : mine.slice(0, 40).map(function (s) {
          var it = (s.items || [])[0] || {};
          var prof = (s.items || []).reduce(function (a, x) {
            return a + x.quantity * (x.sellPrice - (x.buyPrice || 0)); }, 0);
          return '<div class="iline"><div class="in"><b>' + esc(it.productName || "—") +
            (s.returnOf ? ' <span class="retbadge">برگشتی</span>' : '') + '</b>' +
            '<small class="num">' + fmtDate(s.date) + ' • ' + nf.format(it.quantity || 0) +
              ' × ' + money(it.sellPrice || 0) + '</small></div>' +
            '<div class="lt num" style="color:' + (prof >= 0 ? "var(--primary)" : "var(--danger)") + '">' +
              money(s.total) + '<br><small>فایده ' + nf.format(+prof.toFixed(2)) + '</small></div></div>';
        }).join("");

    el.innerHTML = head +
      '<p style="padding:8px 14px 0;color:var(--ink-soft);font-size:13.5px;line-height:1.9">' +
        'جنسی که در بازار به <b>پول نقد</b> می‌فروشید. پول داخل صندوق می‌آید و ' +
        'در گزارش‌ها جدا از فروش دوکان نشان داده می‌شود.</p>' +
      '<div style="padding:8px 14px 0"><button class="addline" id="bzNew" style="margin:0;border-style:solid;background:var(--primary);color:var(--primary-ink);border-color:var(--primary)">＋ ثبت فروش بازار</button></div>' +
      '<div style="padding:10px 14px 0"><div class="sumbox">' +
        '<div class="sumrow"><span>مجموع فروش بازار</span><span class="num">' + money(r.bazaarSales) + '</span></div>' +
        '<div class="sumrow total"><span>فایدهٔ فروش بازار</span><span class="num" style="color:' +
          (r.bazaarProfit >= 0 ? "var(--primary)" : "var(--danger)") + '">' + money(r.bazaarProfit) + '</span></div>' +
      '</div></div>' +
      '<div class="listhead">فروش‌های بازار</div>' + rows;
  }

  function openBazaarSale() {
    var picked = null, payType = "cash", custName = "";
    function draw() {
      var recents = recentCustomers(6);
      openSheet(
        '<h2>🏪 فروش بازار</h2>' +
        '<div class="field"><label>جنس</label>' +
          '<button type="button" class="addline" id="bPick" style="margin:0;text-align:center">' +
            (picked ? esc(picked.name) + ' — تبدیل' : '＋ انتخاب جنس') + '</button>' +
          '<div class="err" id="eBProd">جنس را انتخاب کنید</div></div>' +
        (picked ?
        '<div class="field"><label>مقدار (' + unitLabel(picked.unit) + ') — موجود: ' + qtyUnit(picked.qty, picked.unit) + '</label>' +
          '<input id="bQty" type="number" inputmode="decimal" step="any" min="0" value="' + esc(kept.qty) + '" placeholder="0" /></div>' +
        '<div class="field"><label>نرخ فروش بازار فی ' + unitLabel(picked.unit) + ' (افغانی)</label>' +
          '<input id="bPrice" type="number" inputmode="decimal" step="any" min="0" value="' + esc(kept.price !== "" ? kept.price : (picked.sell || "")) + '" />' +
          '<small style="display:block;margin-top:6px;color:var(--ink-soft);font-size:12.5px">نرخ بازار هر روز فرق می‌کند — نرخ همین معامله را بنویسید.</small></div>' +
        // در بازار هم گاهی قرضی فروخته می‌شود
        '<div class="field"><label>پرداخت</label>' +
          '<div class="seg" id="bPay">' +
            '<button type="button" data-b="cash" class="' + (payType === "cash" ? "on" : "") + '">💵 نقد</button>' +
            '<button type="button" data-b="credit" class="' + (payType === "credit" ? "on" : "") + '">◔ قرض</button>' +
          '</div></div>' +
        (payType === "credit" ?
          '<div class="field"><label>نام خریدار (حتمی)</label>' +
            '<input id="bCust" type="text" value="' + esc(custName) + '" placeholder="مثلاً: کریم" />' +
            '<div class="err" id="eBCust">نام خریدار را بنویسید — ورنه قرض در دفتر ثبت نمی‌شود</div>' +
            (recents.length ? '<div class="chips" id="bRecents" style="flex-wrap:wrap;margin-top:8px">' +
              recents.map(function (c) {
                return '<button type="button" data-bc="' + esc(c.name) + '" style="flex:0 1 auto;padding:8px 12px">' + esc(c.name) + '</button>';
              }).join("") + '</div>' : '') +
          '</div>' : '') +
        '<div class="sumbox" id="bOut" style="margin-bottom:12px"></div>' : '') +
        '<div class="actions"><button class="ghost" data-close>لغو</button>' +
          '<button class="primary" id="bOk">' + (payType === "credit" ? "◔ ثبت فروش قرض" : "💵 ثبت فروش نقد") + '</button></div>'
      );
      $("#bPick").addEventListener("click", openBazaarPicker);
      if (picked) {
        $("#bQty").addEventListener("input", refresh);
        $("#bPrice").addEventListener("input", refresh);
        sheet.querySelectorAll("#bPay button").forEach(function (b) {
          b.addEventListener("click", function () {
            syncBazaarInputs();
            payType = b.dataset.b;
            draw();
          });
        });
        if ($("#bRecents")) {
          $("#bRecents").addEventListener("click", function (e) {
            var b = e.target.closest("[data-bc]"); if (!b) return;
            $("#bCust").value = b.dataset.bc;
            $("#eBCust").classList.remove("show");
            buzz();
          });
        }
        refresh();
        setTimeout(function () { $("#bQty").focus(); }, 60);
      }
      $("#bOk").addEventListener("click", commit);
    }
    // پیش از رسم دوباره، آنچه تایپ شده نگه داشته شود
    var kept = { qty: "", price: "" };
    function syncBazaarInputs() {
      if ($("#bQty")) kept.qty = $("#bQty").value;
      if ($("#bPrice")) kept.price = $("#bPrice").value;
      if ($("#bCust")) custName = $("#bCust").value;
    }
    function vals() {
      if (!picked) return null;
      var q = parseFloat($("#bQty").value), pr = parseFloat($("#bPrice").value);
      if (!(q > 0) || !(pr >= 0)) return null;
      return { qty: q, price: pr, total: +(q * pr).toFixed(2),
               profit: +(q * (pr - (picked.buy || 0))).toFixed(2) };
    }
    function refresh() {
      var v = vals(), out = $("#bOut");
      if (!v) { out.innerHTML = '<div class="sumrow"><span>مجموع</span><span class="num">—</span></div>'; return; }
      var over = v.qty > picked.qty;
      out.innerHTML =
        '<div class="sumrow"><span>قیمت خرید فی ' + unitLabel(picked.unit) + '</span><span class="num">' + money(picked.buy || 0) + '</span></div>' +
        '<div class="sumrow"><span>مجموع فروش</span><span class="num">' + money(v.total) + '</span></div>' +
        '<div class="sumrow total"><span>' + (v.profit < 0 ? "ضرر این معامله" : "فایدهٔ این معامله") + '</span>' +
          '<span class="num" style="color:' + (v.profit < 0 ? "var(--danger)" : "var(--primary)") + '">' + money(Math.abs(v.profit)) + '</span></div>' +
        (over ? '<p style="font-size:12.5px;color:var(--danger);line-height:1.8;margin:8px 0 0">' +
          'اخطار: موجودی فقط ' + qtyUnit(picked.qty, picked.unit) + ' است. اگر ثبت کنید، موجودی منفی می‌شود.</p>' : '');
    }
    function openBazaarPicker() {
      // جنس‌هایی که موجود دارند اول، تا در بازار زود پیدا شوند
      var list = products.slice().sort(function (a, b) {
        var oa = a.qty > 0 ? 0 : 1, ob = b.qty > 0 ? 0 : 1;
        if (oa !== ob) return oa - ob;
        return a.name.localeCompare(b.name, "fa");
      });
      openSheet(
        '<h2>کدام جنس؟</h2>' +
        list.map(function (p) {
          return '<div class="iline" data-bp="' + p.id + '" role="button" tabindex="0" style="cursor:pointer">' +
            '<div class="in"><b>' + esc(p.name) + '</b><small class="num">موجود: ' + qtyUnit(p.qty, p.unit) +
              ' • خرید: ' + money(p.buy || 0) + '</small></div>' +
            '<div class="lt num">' + money(p.sell) + '</div></div>';
        }).join("") +
        '<div class="actions"><button class="ghost" id="bBack">بازگشت</button></div>'
      );
      $("#bBack").addEventListener("click", draw);
      sheet.querySelectorAll("[data-bp]").forEach(function (el) {
        el.addEventListener("click", function () {
          var p = findP(el.dataset.bp);
          picked = { id: p.id, name: p.name, unit: p.unit, qty: p.qty, buy: p.buy || 0, sell: p.sell };
          kept.qty = ""; kept.price = ""; // نرخ پیش‌فرض جنس نو بیاید
          draw();
        });
      });
    }
    function commit() {
      if (!picked) { $("#eBProd").classList.add("show"); return; }
      var v = vals();
      if (!v) { toast("مقدار و نرخ را درست بنویسید", true); return; }
      var p = findP(picked.id);
      if (!p) { toast("جنس پیدا نشد", true); return; }
      // فروش قرضی بازار هم بدون نام اجازه ندارد — ورنه قرض در دفتر گم می‌شود
      if (payType === "credit") {
        custName = ($("#bCust") ? $("#bCust").value : "").trim();
        if (!custName) { $("#eBCust").classList.add("show"); return; }
      }
      syncBazaarInputs();
      if (!guardStockOut([{ productId: p.id, qty: v.qty }],
        "این فروش بازار بیشتر از موجودی دوکان است:",
        function () { doBazaarSale(p, v); }, draw)) return;
      doBazaarSale(p, v);
    }
    function doBazaarSale(p, v) {
      // همان ساختار فروش عادی — نرخ فروش و قیمت خرید لحظهٔ فروش عکس گرفته
      // می‌شوند، تا تغییر بعدی نرخ‌ها فایدهٔ این فروش را خراب نکند.
      var custId = null, nm = null;
      if (payType === "credit") {
        nm = custName.trim();
        var cust = null;
        for (var i = 0; i < customers.length; i++) {
          if (customers[i].name.trim().toLowerCase() === nm.toLowerCase()) { cust = customers[i]; break; }
        }
        if (!cust) { cust = { id: id(), name: nm, phone: "", opening: 0 }; customers.push(cust); }
        custId = cust.id;
        save(LS_CUST, customers);
      }
      sales.push({ id: id(), date: new Date().toISOString(), total: v.total,
        paymentType: payType, customerName: nm, customerId: custId, channel: "bazaar",
        items: [{ productId: p.id, productName: p.name, quantity: v.qty,
                  sellPrice: v.price, buyPrice: p.buy || 0, buyEst: !!p.buyEstimated }] });
      p.qty = +(p.qty - v.qty).toFixed(3);
      save(LS_S, sales); save(LS_P, products);
      closeSheet();
      renderSaleGrid(); renderProducts(); renderCustomers(); renderMore();
      buzz(30);
      toast(payType === "credit" ? "فروش بازار قرضی ثبت شد ✓" : "فروش بازار ثبت شد ✓ پول در صندوق آمد");
    }
    draw();
  }

  // ---------- دریافت به جنس ----------
  // مشتری پول ندارد و به‌جایش جنس می‌دهد (تخم مرغ به ۵، آرد کیلو ۱۰).
  // یک رویداد با سه اثر که باید یکجا ثبت شوند، ورنه یکی از سه رقم غلط می‌ماند:
  //   ۱) قرض مشتری به اندازهٔ ارزش جنس کم می‌شود،
  //   ۲) موجودی همان جنس در دوکان زیاد می‌شود،
  //   ۳) صندوق دست‌نخورده می‌ماند (پولی نگرفته‌ایم).
  // بعد همین جنس در بازار فروخته می‌شود و فایده‌اش (فروش − همین نرخ)
  // خودکار در گزارش‌ها می‌آید.
  function openCustomerGoods(c) {
    var picked = null;      // {id, name, unit, isNew, type, sell}

    function draw() {

        '<p style="margin:-6px 0 12px;color:var(--ink-soft);font-size:13.5px;line-height:1.9">' +

          'جنسی که به‌جای پول می‌دهد و نرخی که با هم قبول کردید. ' +

    function openGoodsNew() {

      openSheet(
