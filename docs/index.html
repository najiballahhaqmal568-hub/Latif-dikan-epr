  // ---------- بک‌آپ و شروع نو ----------
  // گرفتن فایل از تمام دیتا (برای نگه‌داشتن پیش از پاک‌کردن یا هر وقت دیگر)
  function downloadBackup() {
    try {
      var data = collectData();
      // عکس‌ها فقط در بک‌آپ می‌آیند، نه در سنک — تا سنک سنگین و کند نشود.
      // پس این فایل تنها محافظ عکس‌هاست.
      data.photos = photoCache;
      data.__backupDate = new Date().toISOString();
      var blob = new Blob([JSON.stringify(data)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      var j = toJalali(new Date());
      a.href = url;
      a.download = "dukan-latif-" + (j ? j.jy + "-" + j.jm + "-" + j.jd : todayISO()) + ".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      toast("فایل بک‌آپ گرفته شد ✓");
    } catch (e) {
      toast("گرفتن بک‌آپ نشد: " + (e.message || e), true);
    }
  }

  // ---------- بازگرداندن از فایل بک‌آپ ----------
  // بدون این، فایل بک‌آپ فقط یک فایل بی‌کار بود. عکس‌ها چون سنک نمی‌شوند،
  // تنها از همین راه به دستگاه نو می‌روند.
  function pickRestoreFile() {
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json,.json";
    inp.addEventListener("change", function () {
      var f = inp.files && inp.files[0];
      if (f) readRestoreFile(f);
    });
    inp.click();
  }
  function readRestoreFile(file) {
    var fr = new FileReader();
    fr.onerror = function () { toast("فایل خوانده نشد", true); };
    fr.onload = function () {
      var d = null;
      try { d = JSON.parse(fr.result); } catch (e) { d = null; }
      if (!d || typeof d !== "object" || (!d.products && !d.sales)) {
        toast("این فایل بک‌آپ «دوکان لطیف» نیست", true); return;
      }
      confirmRestore(d);
    };
    fr.readAsText(file);
  }
  function confirmRestore(d) {
    function n(a) { return Array.isArray(a) ? a.length : 0; }
    var when = d.__backupDate ? fmtDateLong(String(d.__backupDate).slice(0, 10)) : "نامعلوم";
    openSheet(
      '<h2>بازگرداندن بک‌آپ</h2>' +
      '<p style="font-size:15px;line-height:2;margin:0 0 10px">تاریخ این فایل: <b>' + esc(when) + '</b></p>' +
      '<div class="iline"><div class="in"><b>اجناس</b></div><div class="lt num">' + nf.format(n(d.products)) + '</div></div>' +
      '<div class="iline"><div class="in"><b>فروش‌ها</b></div><div class="lt num">' + nf.format(n(d.sales)) + '</div></div>' +
      '<div class="iline"><div class="in"><b>مشتری‌ها</b></div><div class="lt num">' + nf.format(n(d.customers)) + '</div></div>' +
      '<div class="iline"><div class="in"><b>فاکتورهای خرید</b></div><div class="lt num">' + nf.format(n(d.purchases)) + '</div></div>' +
      '<div class="iline"><div class="in"><b>عکس‌ها</b></div><div class="lt num">' +
        nf.format(d.photos ? Object.keys(d.photos).length : 0) + '</div></div>' +
      '<p style="font-size:14.5px;line-height:2;margin:12px 0 0;color:var(--danger)">' +
        '<b>تمام دیتای فعلی این تیلفون با دیتای این فایل عوض می‌شود.</b></p>' +
      '<div class="actions"><button class="ghost" data-close>نی، لغو</button>' +
        '<button class="primary" id="restOk">بلی، بازگردان</button></div>'
    );
    $("#restOk").addEventListener("click", function () {
      var ph = (d.photos && typeof d.photos === "object") ? d.photos : {};
      applyData(d);
      photoClear().then(function () {
        var chain = Promise.resolve();
        Object.keys(ph).forEach(function (k) {
          chain = chain.then(function () { return photoSave(k, ph[k]); });
        });
        return chain;
      }).then(function () {
        renderSaleGrid(); renderProducts();
        if (typeof syncPhotosOnChange === "function") syncPhotosOnChange();
      }).catch(function () {});
      if (typeof syncOnLocalSave === "function") syncOnLocalSave();
      closeSheet();
      toast("بک‌آپ بازگردانده شد ✓");
    });
  }

  function confirmWipe() {
    openSheet(
      '<h2 style="color:var(--danger)">پاک‌کردن همه؟</h2>' +
      '<p style="font-size:15px;line-height:2">تمام اجناس، فروش‌ها، قرض‌ها، مصارف، ضایعات و شمارش‌ها پاک می‌شوند.<br>' +
      '<b style="color:var(--danger)">این کار پس نمی‌آید.</b><br>' +
      '<small style="color:var(--ink-soft)">تنظیمات سنک دست‌نخورده می‌ماند.</small></p>' +
      '<div class="actions"><button class="ghost" data-close>نی، لغو</button>' +
        '<button class="primary" id="wipeOk" style="background:var(--danger)">بلی، پاک کن</button></div>'
    );
    $("#wipeOk").addEventListener("click", wipeAll);
  }

  // پاک‌کردن کامل — آرایه‌های خالی ذخیره می‌شوند (نه حذف کلید)، تا
  // نمونه‌های آزمایشی دوباره ساخته نشوند.
  function wipeAll() {
    products = []; sales = []; suppliers = []; purchases = []; customers = [];
    supPayments = []; custPayments = []; waste = []; expenses = []; stockCounts = [];
    cashEntries = []; cart = [];
    save0(LS_P, products); save0(LS_S, sales); save0(LS_SUP, suppliers);
    save0(LS_PUR, purchases); save0(LS_CUST, customers); save0(LS_SPAY, supPayments);
    save0(LS_CPAY, custPayments); save0(LS_WASTE, waste); save0(LS_EXP, expenses);
    save0(LS_COUNTS, stockCounts); save0(LS_CASH, cashEntries);
    localStorage.setItem(LS_SEED, "1"); // دیگر نمونهٔ آزمایشی ساخته نشود
    photoClear().then(function () { if (typeof syncPhotosOnChange === "function") syncPhotosOnChange(); });
    invalidateDebts();
    if (typeof syncOnLocalSave === "function") syncOnLocalSave(); // نسخهٔ آنلاین هم خالی شود
    closeSheet();
    moreView = null;
    renderSaleGrid(); renderCart(); renderProducts(); renderPurchases();
    renderDebts(); renderMore();
    switchTab("products");
    toast("همه پاک شد ✓ حالا اجناس واقعی را وارد کنید");
  }

  // ---------- Monthly stock count (شمارش ماهانه) ----------
  function renderCount(el) {
    var head = '<div class="subhead"><button class="back moreBack" aria-label="بازگشت">→</button><h3>شمارش ماهانه</h3></div>';
    if (products.length === 0) {
      el.innerHTML = head + '<div class="empty"><div class="big">🔢</div><p>هنوز جنسی نیست.</p></div>';
      return;
    }
    var rows = products.slice().sort(function (a, b) { return a.name.localeCompare(b.name, "fa"); }).map(function (p) {
      return '<div class="iline">' +
        '<div class="in"><b>' + esc(p.name) + '</b><small class="num">باید باشد: ' + qtyUnit(p.qty, p.unit) + '</small></div>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          '<input class="cntinp" data-cnt="' + p.id + '" type="number" inputmode="decimal" step="any" min="0" value="' + p.qty + '" style="width:74px;direction:ltr;text-align:right;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px;font:inherit;font-size:15px;outline:0" />' +
          '<span class="num" data-cntdiff="' + p.id + '" style="min-width:56px;text-align:left;font-weight:800;color:var(--ink-soft)">۰</span>' +
        '</div>' +
        '</div>';
    }).join("");

    var recorded = stockCounts.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    var recHtml = recorded.length === 0
      ? '<p style="color:var(--ink-soft);text-align:center;padding:10px;font-size:14px">هنوز شمارشی ثبت نشده</p>'
      : recorded.map(function (c) {
          var col = c.difference < 0 ? "var(--danger)" : "var(--primary)";
          var lbl = c.difference < 0 ? "کسر" : "زیادت";
          return '<div class="iline"><div class="in"><b>' + esc(c.productName) + '</b><small>ماه ' + monthKeyLabel(c.month) + ' • <span class="num">شمرده: ' + nf.format(c.counted) + ' / باید: ' + nf.format(c.calculated) + '</span></small></div>' +
            '<div class="lt num" style="color:' + col + '">' + lbl + ' ' + nf.format(Math.abs(c.difference)) + '</div></div>';
        }).join("");

    el.innerHTML = head +
      '<div class="listhead">شمارش ماه ' + monthKeyLabel(monthKey()) + ' — تعداد واقعی را بنویسید</div>' +
      rows +
      '<div style="padding:12px 14px 4px"><button class="addline" id="saveCountBtn" style="margin:0">💾 ثبت شمارش ماه</button></div>' +
      '<div class="listhead">فرق‌های ثبت‌شده</div>' +
      recHtml;
  }

  // یک‌بار: کلید ماهِ شمارش‌های کهنه از میلادی به شمسی تبدیل شود.
  // اگر این کار نشود، شمارش دوبارهٔ همان ماه، ضایعات کسری کهنه را پیدا
  // نمی‌کند و ضرر دوبار حساب می‌شود.
  function migrateMonthKeysToJalali() {
    var changed = false;
    function isGregorianKey(k) {
      var m = /^(\d{4})\/(\d{2})$/.exec(k || "");
      return !!m && parseInt(m[1], 10) > 1700; // سال میلادی
    }
    stockCounts.forEach(function (c) {
      if (isGregorianKey(c.month) && c.date) {
        var d = new Date(c.date);
        if (!isNaN(d)) { c.month = monthKeyOf(d); changed = true; }
      }
    });
    waste.forEach(function (w) {
      if (isGregorianKey(w.countMonth) && w.date) {
        var d = new Date(w.date);
        if (!isNaN(d)) { w.countMonth = monthKeyOf(d); changed = true; }
      }
    });
    if (changed) { save0(LS_COUNTS, stockCounts); save0(LS_WASTE, waste); }
  }

  function saveCount() {
    var mk = monthKey();
    var changed = 0, diffs = 0, shortLoss = 0;
    // حذف رکوردهای همین ماه (جایگزینی) — ضایعات کسری همین ماه هم پاک شود تا دوباره حساب نشود
    stockCounts = stockCounts.filter(function (c) { return c.month !== mk; });
    waste = waste.filter(function (w) { return w.countMonth !== mk; });
    products.forEach(function (p) {
      var inp = document.querySelector('[data-cnt="' + p.id + '"]');
      if (!inp) return;
      var counted = parseFloat(inp.value);
      if (isNaN(counted)) return;
      var calc = p.qty;
      var diff = +(counted - calc).toFixed(3);
      if (diff !== 0) {
        stockCounts.push({ id: id(), month: mk, productId: p.id, productName: p.name, unit: p.unit, calculated: calc, counted: counted, difference: diff, date: new Date().toISOString() });
        diffs++;
        // کسری (کمتر از کتاب) = ضرر واقعی → در ضایعات ثبت شود تا از فایده کم گردد.
        // زیادی (بیشتر از کتاب) فقط موجودی را درست می‌کند و فایدهٔ ساختگی نمی‌سازد.
        if (diff < 0) {
          waste.push({ id: id(), productId: p.id, productName: p.name, unit: p.unit, quantity: -diff, buyPrice: p.buy || 0, date: new Date().toISOString(), reason: "shortage", countMonth: mk });
          shortLoss += (-diff) * (p.buy || 0);
        }
      }
      if (counted !== calc) { p.qty = counted; changed++; } // اصلاح موجودی به تعداد شمرده‌شده
    });
    save(LS_COUNTS, stockCounts); save(LS_P, products); save(LS_WASTE, waste);
    renderMore(); renderProducts(); renderSaleGrid();
    toast(diffs === 0 ? "شمارش ثبت شد — هیچ فرقی نبود ✓"
      : ("شمارش ثبت شد — " + diffs + " قلم فرق داشت" + (shortLoss > 0 ? " • ضرر کسری: " + money(shortLoss) : "")));
  }

  // ---------- صفحهٔ صندوق ----------
  // همهٔ حرکت‌های پول نقد، از هر منبعی، در یک فهرست (رد پول)
  // رد پول = همان رویدادهای صندوق، مرتب‌شده و با ماندهٔ پی‌درپی.
  // اینجا دیگر هیچ قانونی نیست؛ فقط نمایش. قانون در cashEvents() است.
  function cashMovements() {
    var out = cashEvents();
    // کهنه به نو مرتب می‌شود تا مانده پی‌درپی حساب شود.
    // «موجودی اول» همیشه اول می‌آید — چون نقطهٔ شروع دفتر است و تاریخ
    // فاکتورها فقط روز دارد (نیمه‌شب)، ورنه پیش از آن می‌افتاد.
    out.sort(function (a, b) {
      if (a.opening !== b.opening) return a.opening ? -1 : 1;
      return (a.date || "").localeCompare(b.date || "");
    });
    var run = 0;
    out.forEach(function (m) { run = +(run + m.amount).toFixed(2); m.balance = run; });
    return out.reverse(); // نو به کهنه برای نمایش
  }

  function renderCash(el) {
    var head = '<div class="subhead"><button class="back moreBack" aria-label="بازگشت">→</button><h3>صندوق</h3></div>';
    var bal = cashBalance();
    var b = cashBreakdown();
    var hasOpening = !!cashOpeningEntry();

    var openingBtn = hasOpening ? "" :
      '<div class="warn-card" style="background:var(--credit-soft);border-color:var(--credit)">' +
      '<div class="wi">💰</div><div class="wtx"><b>موجودی اول صندوق ثبت نشده</b>' +
      '<small style="color:var(--credit)">امشب پول صندوق را بشمارید و همان را اینجا بگذارید — تا رقم‌ها از اول درست باشد.</small></div></div>' +
      '<div style="padding:0 14px 6px"><button class="addline" id="setOpeningBtn" style="margin:0;border-color:var(--credit);background:var(--credit-soft);color:var(--credit)">＋ ثبت موجودی اول صندوق</button></div>';

    // صندوق منفی یعنی اپ پول خارج‌شده را بیشتر از پول داخل‌شده می‌داند.
    // فقط رقم سرخ نشان‌دادن کافی نیست؛ دلیلش هم نوشته شود.
    var negCard = bal >= 0 ? "" :
      '<div style="margin:6px 14px 0;border:2px solid var(--danger);border-radius:14px;padding:13px">' +
        '<b style="color:var(--danger);font-size:16px">صندوق منفی است</b>' +
        '<p style="font-size:13.5px;line-height:1.95;color:var(--ink-soft);margin:8px 0 0">' +
          'در واقعیت پول نقد از صفر پایین‌تر نمی‌رود، پس یکی از این‌هاست:<br>' +
          (hasOpening ? '' : '• <b>موجودی اول ثبت نشده</b> — محتمل‌ترین دلیل؛ دفتر از صفر شروع شده.<br>') +
          '• در یک <b>فاکتور خرید</b> مبلغ «پرداخت‌شده» بیشتر از واقعیت نوشته شده.<br>' +
          '• <b>فروش‌ها</b> کامل ثبت نمی‌شوند ولی خرید و مصرف ثبت می‌شود.<br>' +
          'در «رد پول» پایین، سطرهای درشت را با فاکتورشان مقایسه کنید.' +
        '</p>' +
      '</div>';

    var moves = cashMovements();
    var moveHtml = moves.length === 0
      ? '<p style="color:var(--ink-soft);text-align:center;padding:10px;font-size:14px">هنوز حرکتی نیست</p>'
      : moves.slice(0, 60).map(function (m) {
          var col = m.amount < 0 ? "var(--danger)" : "var(--primary)";
          var sign = m.amount < 0 ? "−" : "＋";
          // فقط پول دستی باطل می‌شود؛ بقیه از جای خودشان (فاکتور، رسید) باطل می‌گردند
          var e = m.entry;
          var tag = (e && e.reverseOf) ? ' <span class="retbadge">باطل‌کردن</span>'
                  : ((e && e.reversed) ? ' <span class="retbadge">باطل شد</span>' : '');
          var btn = (e && !isVoided(e)) ?
            '<button class="wbtn" data-voidce="' + e.id + '" style="background:var(--danger)">باطل</button>' : '';
          return '<div class="iline">' + btn + '<div class="in"><b>' + esc(m.label) + tag + '</b>' +
            '<small class="num">' + fmtDate(m.date) + ' • مانده: ' + money(m.balance) + '</small></div>' +
            '<div class="lt num" style="color:' + col + '">' + sign + ' ' + money(Math.abs(m.amount)) + '</div></div>';
        }).join("");

    el.innerHTML = head + openingBtn + negCard +
      '<div style="padding:6px 14px 0">' +
        '<div class="sumbox" style="text-align:center;padding:16px">' +
          '<div style="font-size:15px;color:var(--ink-soft);font-weight:700">پول در صندوق</div>' +
          '<div class="num" style="font-size:34px;font-weight:900;color:' + (bal < 0 ? "var(--danger)" : "var(--primary)") + ';margin-top:4px">' + money(bal) + '</div>' +
          '<div style="font-size:12.5px;color:var(--ink-soft);margin-top:4px">باید همین‌قدر در جعبه باشد</div>' +
        '</div>' +
        '<div style="display:flex;gap:8px;margin-bottom:12px">' +
          '<button class="wbtn" id="cashCountBtn" style="flex:1 1 0;padding:12px;background:var(--primary)">🌙 شمارش صندوق</button>' +
        '</div>' +
        '<div style="display:flex;gap:8px;margin-bottom:14px">' +
          '<button class="wbtn" id="cashInBtn" style="flex:1 1 0;padding:11px;background:var(--primary)">＋ پول داخل</button>' +
          '<button class="wbtn" id="cashOutBtn" style="flex:1 1 0;padding:11px;background:var(--danger)">− پول خارج</button>' +
        '</div>' +
        '<div class="sumbox">' +
          '<div class="sumrow"><span>موجودی اول</span><span class="num">' + money(b.opening) + '</span></div>' +
          '<div class="sumrow"><span>فروش نقد</span><span class="num">＋ ' + money(b.sales) + '</span></div>' +
          '<div class="sumrow"><span>دریافت از مشتری</span><span class="num">＋ ' + money(b.custPaid) + '</span></div>' +
          (b.manualIn ? '<div class="sumrow"><span>پول دستی داخل</span><span class="num">＋ ' + money(b.manualIn) + '</span></div>' : '') +
          '<div class="sumrow"><span>خرید نقد</span><span class="num">− ' + money(b.purchasePaid) + '</span></div>' +
          '<div class="sumrow"><span>پرداخت به تامین‌کننده</span><span class="num">− ' + money(b.supPaid) + '</span></div>' +
          '<div class="sumrow"><span>مصارف خانه</span><span class="num">− ' + money(b.expenses) + '</span></div>' +
          (b.manualOut ? '<div class="sumrow"><span>پول دستی خارج</span><span class="num">− ' + money(b.manualOut) + '</span></div>' : '') +
          (b.adjust ? '<div class="sumrow"><span>تعدیل شمارش</span><span class="num">' + (b.adjust < 0 ? "− " : "＋ ") + money(Math.abs(b.adjust)) + '</span></div>' : '') +
          '<div class="sumrow total"><span>پول در صندوق</span><span class="num">' + money(bal) + '</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="listhead">رد پول (تازه‌ترین اول)</div>' + moveHtml;
  }

  // شمارش شبانه — یک شمارش برای هر روز؛ شمارش دوباره جای قبلی را می‌گیرد
  function openCashCount() {
    var expected = cashBalance();
    openSheet(
      '<h2>🌙 شمارش صندوق</h2>' +
      '<div class="sumbox"><div class="sumrow total"><span>باید باشد</span><span class="num">' + money(expected) + '</span></div></div>' +
      '<div class="field"><label>پولی که شمردید (افغانی)</label>' +
        '<input id="ccAmt" type="number" inputmode="decimal" step="any" min="0" placeholder="0" /></div>' +
      '<div id="ccOut" style="margin:-4px 0 12px;font-size:15px;font-weight:800"></div>' +
      '<p style="color:var(--ink-soft);font-size:13px;margin:0 0 12px;line-height:1.9">' +
        'اگر کم باشد، «کسری صندوق» ثبت می‌شود و از فایده کم می‌گردد.<br>' +
        'اگر زیاد باشد، فقط رقم صندوق درست می‌شود و فایدهٔ ساختگی نمی‌سازد.</p>' +
      '<div class="actions"><button class="ghost" data-close>لغو</button>' +
        '<button class="primary" id="ccOk">ثبت شمارش</button></div>'
    );
    function refresh() {
      var v = parseFloat($("#ccAmt").value);
      var out = $("#ccOut");
      if ($("#ccAmt").value === "" || isNaN(v)) { out.textContent = ""; return; }
      var d = +(v - expected).toFixed(2);
      if (d === 0) out.innerHTML = '<span style="color:var(--primary)">✓ دقیق جور است</span>';
      else if (d < 0) out.innerHTML = '<span style="color:var(--danger)">⚠️ ' + money(-d) + ' کم است</span>';
      else out.innerHTML = '<span style="color:var(--credit)">' + money(d) + ' زیاد است</span>';
    }
    $("#ccAmt").addEventListener("input", refresh);
    $("#ccOk").addEventListener("click", function () {
      var v = parseFloat($("#ccAmt").value);
      if ($("#ccAmt").value === "" || isNaN(v) || v < 0) { toast("مبلغ شمرده‌شده را بنویسید", true); return; }
      var dk = dayKeyOf(new Date());
      // شمارش قبلی همین روز برداشته شود تا تعدیل دوبار حساب نگردد
      cashEntries = cashEntries.filter(function (e) { return !(e.kind === "count" && e.dayKey === dk); });
      var expectedNow = cashBalance(); // بعد از برداشتن شمارش قبلی همین روز
      var diff = +(v - expectedNow).toFixed(2);
      if (diff !== 0) {
        cashEntries.push({ id: id(), date: new Date().toISOString(), kind: "count",
          amount: diff, dayKey: dk, counted: v, expected: expectedNow });
      }
      save(LS_CASH, cashEntries);
      closeSheet(); renderMore();
      buzz(30);
      toast(diff === 0 ? "شمارش ثبت شد — دقیق جور بود ✓"
        : (diff < 0 ? "کسری " + money(-diff) + " ثبت شد" : "زیادت " + money(diff) + " ثبت شد"));
    });
    setTimeout(function () { $("#ccAmt").focus(); }, 60);
  }

  // پول دستی داخل/خارج + موجودی اول
  // موجودی اول صندوق — همیشه اولین رویداد دفتر است، پس روی همهٔ فروش و
  // خریدهای ثبت‌شده جمع می‌شود. اگر کسی پول امروز را اینجا بنویسد، رقم
  // صندوق دوبار حساب می‌شود و بلندتر از واقعیت نشان می‌دهد. برای همین
  // دو راه داده شده و راه پیش‌فرض «شمردن پول امشب» است، چون پول دیروز و
  // پریروز را کسی به یاد ندارد ولی پول امشب را می‌شود شمرد.
  function openCashOpening() {
    var net = cashNetWithoutOpening();
    var mode = "count"; // count | know
    openSheet(
      '<h2>موجودی اول صندوق</h2>' +
      '<p style="margin:-6px 0 12px;color:var(--ink-soft);font-size:13.5px;line-height:1.9">' +
        'این نقطهٔ شروع دفتر صندوق است — پولی که <b>پیش از شروع اپ</b> در جعبه بود.</p>' +
      '<div class="seg" id="obMode" style="margin-bottom:14px">' +
        '<button type="button" data-m="count" class="on">پول امشب را می‌شمارم</button>' +
        '<button type="button" data-m="know">پول اول را می‌دانم</button>' +
      '</div>' +
      '<div class="field"><label id="obLbl">پولی که همین حالا در جعبه است (افغانی)</label>' +
        '<input id="obAmt" type="number" inputmode="decimal" step="any" min="0" placeholder="0" /></div>' +
      '<div id="obOut" class="sumbox" style="display:none;margin-bottom:12px"></div>' +
      '<div class="actions"><button class="ghost" data-close>لغو</button>' +
        '<button class="primary" id="obOk">ثبت</button></div>'
    );
    function computed() {
      var v = parseFloat($("#obAmt").value);
      if ($("#obAmt").value === "" || isNaN(v)) return null;
      return mode === "count" ? +(v - net).toFixed(2) : +v.toFixed(2);
    }
    function refresh() {
      var out = $("#obOut");
      var c = computed();
      if (mode !== "count" || c === null) { out.style.display = "none"; return; }
      out.style.display = "block";
      out.innerHTML =
        '<div class="sumrow"><span>پول شمرده‌شدهٔ امشب</span><span class="num">' + money(parseFloat($("#obAmt").value)) + '</span></div>' +
        // این سطر از پول شمرده‌شده کم می‌شود، پس نشانش برعکسِ خود رقم است
        '<div class="sumrow"><span>جمع حرکت‌های ثبت‌شده</span><span class="num">' + (net < 0 ? "＋ " : "− ") + money(Math.abs(net)) + '</span></div>' +
        '<div class="sumrow total"><span>موجودی اول</span><span class="num">' + money(c) + '</span></div>' +
        (c < 0 ? '<p style="font-size:12.5px;color:var(--danger);line-height:1.8;margin:8px 0 0">' +
          'منفی شد — یعنی پولی از جعبه رفته که در اپ ثبت نشده. رقم صندوق درست ' +
          'می‌شود، ولی بهتر است ببینید کدام خرید یا مصرف ثبت نشده.</p>' : '');
    }
    sheet.querySelectorAll("#obMode button").forEach(function (b) {
      b.addEventListener("click", function () {
        mode = b.dataset.m;
        sheet.querySelectorAll("#obMode button").forEach(function (x) { x.classList.toggle("on", x === b); });
        $("#obLbl").textContent = mode === "count"
          ? "پولی که همین حالا در جعبه است (افغانی)"
          : "پولی که پیش از شروع اپ در جعبه بود (افغانی)";
        refresh();
      });
    });
    $("#obAmt").addEventListener("input", refresh);
    $("#obOk").addEventListener("click", function () {
      var c = computed();
      if (c === null) { toast("مبلغ را درست بنویسید", true); return; }
      if (mode === "know" && c < 0) { toast("مبلغ را درست بنویسید", true); return; }
      // موجودی اول یکی است؛ اگر بود، جای‌گزین می‌شود
      cashEntries = cashEntries.filter(function (e) { return e.kind !== "opening"; });
      cashEntries.push({ id: id(), date: new Date().toISOString(), kind: "opening", amount: c });
      save(LS_CASH, cashEntries);
      closeSheet(); renderMore();
      toast("موجودی اول ثبت شد ✓");
    });
    setTimeout(function () { $("#obAmt").focus(); }, 60);
  }

  function openCashEntry(kind) {
    if (kind === "opening") return openCashOpening();
    var isIn = kind === "in";
    var title = isIn ? "＋ پول داخل صندوق" : "− پول خارج از صندوق";
    var hint = isIn ? 'مثلاً: از خانه آوردم، سرمایهٔ نو.'
              : '<b style="color:var(--danger)">خرچ خانه را اینجا ننویسید</b> — آن را در «مصارف خانه» ثبت کنید، ورنه دوبار کم می‌شود.<br>اینجا برای: به بانک بردم، به کسی قرض دادم، و مانند آن.';
    openSheet(
      '<h2>' + title + '</h2>' +
      '<p style="margin:-6px 0 12px;color:var(--ink-soft);font-size:13.5px;line-height:1.9">' + hint + '</p>' +
      '<div class="field"><label>مبلغ (افغانی)</label>' +
        '<input id="ceAmt" type="number" inputmode="decimal" step="any" min="0" placeholder="0" /></div>' +
      '<div class="field"><label>توضیح (اختیاری)</label>' +
        '<input id="ceNote" type="text" placeholder="مثلاً: از خانه" /></div>' +
      '<div class="actions"><button class="ghost" data-close>لغو</button>' +
        '<button class="primary" id="ceOk">ثبت</button></div>'
    );
    $("#ceOk").addEventListener("click", function () {
      var v = parseFloat($("#ceAmt").value);
      if (!(v > 0)) { toast("مبلغ را درست بنویسید", true); return; }
      var note = $("#ceNote").value.trim();
      var commitEntry = function () {
        cashEntries.push({ id: id(), date: new Date().toISOString(), kind: kind,
          amount: v, note: note });
        save(LS_CASH, cashEntries);
        closeSheet(); renderMore();
        toast("ثبت شد ✓");
      };
      // «پول خارج» هم صندوق را منفی کرده می‌تواند
      if (!isIn && !guardCashOut({
        amount: v,
        what: "این پول خارج" + (note ? " — " + note : ""),
        fundNote: "پول از جای دیگر",
        proceed: function () { commitEntry(); },
        onBack: function () { openCashEntry(kind); }
      })) return;
      commitEntry();
    });
    setTimeout(function () { $("#ceAmt").focus(); }, 60);
  }

  // ---------- بازبینی نرخ‌ها ----------
  // فهرست اجناس با فایدهٔ فی دانه — کم‌فایده‌ترین اول، تا معلوم شود
  // کدام نرخ فروش باید بالا برود (نه بر اساس گروه نرخ، بلکه بر اساس فایده).
  function renderMargins(el) {
    var head = '<div class="subhead"><button class="back moreBack" aria-label="بازگشت">→</button><h3>بازبینی نرخ‌ها</h3></div>';
    var priced = products.filter(function (p) { return p.sell > 0; });
    if (priced.length === 0) {
      el.innerHTML = head + '<div class="empty"><div class="big">📋</div><p>هنوز جنسی با نرخ فروش نیست.</p></div>';
      return;
    }
    var sorted = priced.slice().sort(function (a, b) {
      var ma = marginPct(a), mb = marginPct(b);
      if (ma !== mb) return ma - mb;       // کم‌فایده‌ترین اول
      return a.name.localeCompare(b.name, "fa");
    });
    var lossCount = 0, thinCount = 0;
    var rows = sorted.map(function (p) {
      var m = margin(p), pct = marginPct(p);
      var col, tag = "";
      if (m <= 0) { col = "var(--danger)"; tag = ' <span class="retbadge">در ضرر</span>'; lossCount++; }
      else if (pct < 10) { col = "var(--credit)"; tag = ' <span class="estbadge">فایدهٔ خیلی کم</span>'; thinCount++; }
      else col = "var(--primary)";
      return '<div class="iline">' +
        '<button class="wbtn" data-medit="' + p.id + '" style="background:var(--credit)">تغییر نرخ</button>' +
        '<div class="in"><b>' + esc(p.name) + tag + '</b>' +
        '<small class="num">خرید: ' + money(p.buy || 0) + ' • فروش: ' + money(p.sell) + '</small></div>' +
        '<div class="lt num" style="color:' + col + '">' + money(m) + '<br><small style="font-size:11.5px">' + pct + '٪</small></div>' +
        '</div>';
    }).join("");

    var warn = "";
    if (lossCount > 0) {
      warn = '<div class="warn-card"><div class="wi">🔴</div><div class="wtx"><b>' + lossCount +
        ' جنس در ضرر فروخته می‌شود</b><small>قیمت خریدشان از قیمت فروش بیشتر است — نرخ‌شان را بالا ببرید.</small></div></div>';
    } else if (thinCount > 0) {
      warn = '<div class="warn-card" style="background:var(--credit-soft);border-color:var(--credit)"><div class="wi">⚠️</div>' +
        '<div class="wtx"><b>' + thinCount + ' جنس فایدهٔ خیلی کم دارد</b><small style="color:var(--credit)">کمتر از ۱۰٪ فایده.</small></div></div>';
    }

    el.innerHTML = head +
      '<p style="color:var(--ink-soft);font-size:13px;padding:4px 16px 6px">فایدهٔ فی دانه = قیمت فروش − قیمت خرید. کم‌فایده‌ترین اجناس در بالا هستند.</p>' +
      warn +
      '<div style="padding:0 14px 4px"><button class="addline" id="groupPriceBtn" style="margin:0">☑️ تغییر نرخ گروهی (با انتخاب خودتان)</button></div>' +
      '<div class="listhead">فایدهٔ هر جنس</div>' + rows;
  }

  // تغییر نرخ گروهی — ولی هر جنس جدا تیک می‌خورد، چون قیمت خرید
  // اجناس هم‌نرخ فرق می‌کند و کورکورانه تغییردادن غلط است.
  function openGroupPrice() {
    var prices = {};
    products.forEach(function (p) { if (p.sell > 0) prices[p.sell] = (prices[p.sell] || 0) + 1; });
    var list = Object.keys(prices).map(parseFloat).sort(function (a, b) { return a - b; });
    if (list.length === 0) { toast("هنوز جنسی با نرخ فروش نیست", true); return; }
    openSheet(
      '<h2>تغییر نرخ گروهی</h2>' +
      '<p style="margin:-6px 0 12px;color:var(--ink-soft);font-size:13.5px">اول نرخ فعلی را انتخاب کنید.</p>' +
      '<div class="chips" id="grpPrices" style="flex-wrap:wrap">' +
        list.map(function (v) {
          return '<button type="button" data-gp="' + v + '" style="flex:0 1 auto;padding:9px 14px">' +
            money(v) + ' <small style="color:var(--ink-soft)">(' + prices[v] + ')</small></button>';
        }).join("") +
      '</div>' +
      '<div class="actions"><button class="ghost" data-close>لغو</button></div>'
    );
    $("#grpPrices").addEventListener("click", function (e) {
      var b = e.target.closest("[data-gp]"); if (!b) return;
      openGroupPriceStep2(parseFloat(b.dataset.gp));
    });
  }

  function openGroupPriceStep2(oldPrice) {
    var group = products.filter(function (p) { return p.sell === oldPrice; })
      .sort(function (a, b) { return a.name.localeCompare(b.name, "fa"); });
    openSheet(
      '<h2>نرخ ' + money(oldPrice) + ' → ؟</h2>' +
      '<div class="field"><label>نرخ فروش نو (افغانی)</label>' +
        '<input id="gpNew" type="number" inputmode="decimal" step="any" min="0" placeholder="0" /></div>' +
      '<p style="color:var(--ink-soft);font-size:13px;margin:-4px 0 8px">قیمت خرید هر جنس فرق می‌کند، پس تیک هرکدام را که نمی‌خواهید بردارید.</p>' +
      '<div style="max-height:42vh;overflow-y:auto">' +
        group.map(function (p) {
          var m = margin(p);
          return '<label class="estrow" style="border-bottom:1px solid var(--line);padding-bottom:9px;margin-top:9px">' +
            '<input type="checkbox" data-gpp="' + p.id + '" checked />' +
            '<span style="flex:1 1 auto"><b>' + esc(p.name) + '</b><br>' +
            '<small style="color:var(--ink-soft)" class="num">خرید ' + money(p.buy || 0) + ' • فایدهٔ فعلی ' + money(m) + '</small></span>' +
            '</label>';
        }).join("") +
      '</div>' +
      '<div class="actions"><button class="ghost" data-close>لغو</button>' +
        '<button class="primary" id="gpApply">تغییر نرخ</button></div>'
    );
    $("#gpApply").addEventListener("click", function () {
      var v = parseFloat($("#gpNew").value);
      if (!(v > 0)) { toast("نرخ نو را بنویسید", true); return; }
      var n = 0;
      sheet.querySelectorAll("[data-gpp]").forEach(function (cb) {
        if (!cb.checked) return;
        var p = findP(cb.dataset.gpp);
        if (p) { p.sell = v; n++; }
      });
      if (n === 0) { toast("هیچ جنسی انتخاب نشده", true); return; }
      save(LS_P, products);
      closeSheet(); renderMore(); renderProducts(); renderSaleGrid();
      toast("نرخ " + n + " جنس به " + money(v) + " تغییر کرد ✓");
    });
    setTimeout(function () { $("#gpNew").focus(); }, 60);
  }

  // تغییر نرخ یک جنس از صفحهٔ بازبینی
  function openMarginEdit(p) {
    openSheet(
      '<h2>نرخ فروش ' + esc(p.name) + '</h2>' +
      '<div class="sumbox">' +
        '<div class="sumrow"><span>قیمت خرید</span><span class="num">' + money(p.buy || 0) + '</span></div>' +
        '<div class="sumrow"><span>قیمت فروش فعلی</span><span class="num">' + money(p.sell) + '</span></div>' +
        '<div class="sumrow total"><span>فایدهٔ فی ' + unitLabel(p.unit) + '</span><span class="num">' + money(margin(p)) + ' (' + marginPct(p) + '٪)</span></div>' +
      '</div>' +
      '<div class="field"><label>نرخ فروش نو (افغانی)</label>' +
        '<input id="meSell" type="number" inputmode="decimal" step="any" min="0" value="' + p.sell + '" /></div>' +
      '<small id="meOut" style="display:block;margin:-6px 0 12px;color:var(--ink-soft);font-size:13.5px"></small>' +
      '<div class="actions"><button class="ghost" data-close>لغو</button>' +
        '<button class="primary" id="meOk">💾 ذخیره</button></div>'
    );
    function refresh() {
      var s = parseFloat($("#meSell").value);
      if (!(s > 0)) { $("#meOut").textContent = ""; return; }
      var m = +(s - (p.buy || 0)).toFixed(3);
      $("#meOut").innerHTML = 'فایدهٔ نو: <b style="color:' + (m > 0 ? "var(--primary)" : "var(--danger)") + '">' +
        money(m) + '</b> (' + Math.round((m / s) * 100) + '٪)';
    }
    refresh();
    $("#meSell").addEventListener("input", refresh);
    $("#meOk").addEventListener("click", function () {
      var s = parseFloat($("#meSell").value);
      if (!(s > 0)) { toast("نرخ را درست بنویسید", true); return; }
      p.sell = s; save(LS_P, products);
      closeSheet(); renderMore(); renderProducts(); renderSaleGrid();
      toast("نرخ تازه شد ✓");
    });
    setTimeout(function () { var i = $("#meSell"); i.focus(); i.select(); }, 60);
  }

  // ---------- WiFi (وای‌فای) ----------
  function renderWifi(el) {
    var head = '<div class="subhead"><button class="back moreBack" aria-label="بازگشت">→</button><h3>وای‌فای</h3></div>';
    var list = products.filter(function (p) { return p.type === "wifi"; });
    if (list.length === 0) {
      el.innerHTML = head + '<div class="empty"><div class="big">📶</div><p>هنوز وای‌فایی ثبت نشده.<br>از بخش «اجناس» یک جنس نوع «وای‌فای» بسازید،<br>بعد از «خرید» جی‌بی بخرید.</p></div>';
      return;
    }
    var rows = list.map(function (p) {
      var dte = daysToExpiry(p.expiry);
      var badges = [];
      if (p.qty <= 0) badges.push(["خلاص شده", "danger"]);
      else if (p.qty <= WIFI_LOW_GB) badges.push(["جی‌بی کم", "credit"]);
      if (dte !== null) {
        if (dte < 0) badges.push(["تاریخ تیر شده", "danger"]);
        else if (dte <= EXPIRY_WARN_DAYS) badges.push([expiryLabel(dte), "credit"]);
      }
      var badgeHtml = badges.map(function (b) {
        var st = b[1] === "danger" ? "background:var(--danger-soft);color:var(--danger)" : "background:var(--credit-soft);color:var(--credit)";
        return '<span class="reason-badge" style="' + st + '">' + b[0] + '</span>';
      }).join(" ");
      var expiredRemaining = (dte !== null && dte < 0 && p.qty > 0);
      return '<div class="pcard">' +
        '<div class="r1"><b>📶 ' + esc(p.name) + '</b>' + (p.expiry ? '<span class="dt num">تا ' + fmtDate(p.expiry) + '</span>' : '') + '</div>' +
        '<div class="r2"><span class="num">مانده: ' + qtyUnit(p.qty, p.unit) + '</span><span class="num">فروش: ' + money(p.sell) + ' فی جی‌بی</span></div>' +
        (badgeHtml ? '<div style="margin-top:8px">' + badgeHtml + '</div>' : '') +
        (expiredRemaining ? '<button class="wbtn" data-wifiwaste="' + p.id + '" style="margin-top:10px;width:100%;background:var(--danger)">انتقال باقی‌ماندهٔ (' + qtyUnit(p.qty, p.unit) + ') به ضایعات</button>' : '') +
        '</div>';
    }).join("");
    el.innerHTML = head +
      '<p style="color:var(--ink-soft);font-size:13px;padding:4px 16px 6px">وای‌فای دو شرط ختم دارد: خلاص‌شدن جی‌بی یا تیرشدن تاریخ. فروش جی‌بی از تب «فروش» انجام می‌شود.</p>' +
      rows;
  }

  // ---------- Expenses (مصارف خانه) ----------
  // مبلغ مؤثر یک مصرف = مبلغ اصلی + مجموع اصلاحیه‌های آن.
  function expenseEffective(origId) {
    var s = 0;
    expenses.forEach(function (x) { if (x.id === origId || x.correctionOf === origId) s += x.amount; });
    return s;
  }

  function renderExpenses(el) {
    var total = 0, goodsTotal = 0;
    expenses.forEach(function (x) { total += x.amount; if (isGoodsExpense(x)) goodsTotal += x.amount; });
    var sorted = expenses.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    var listHtml = sorted.length === 0
      ? '<p style="color:var(--ink-soft);text-align:center;padding:10px;font-size:14px">هنوز مصرفی ثبت نشده</p>'
      : sorted.map(function (x) {
          if (x.correctionOf) {
            var sign = x.amount < 0 ? "" : "+";
            return '<div class="iline">' +
              '<div class="in"><b><span class="reason-badge">اصلاحیه</span> ' + esc(x.note || "") + '</b><small class="num">' + fmtDate(x.date) + '</small></div>' +
              '<div class="lt num" style="color:var(--danger)">' + sign + money(x.amount) + '</div></div>';
          }
          // مصرف «به جنس» اصلاحیهٔ مبلغی ندارد (مقدار جنس است)، پس باطل می‌شود
          if (isGoodsExpense(x)) {
            var tag = x.reverseOf ? ' <span class="retbadge">باطل‌کردن</span>'
                    : (x.reversed ? ' <span class="retbadge">باطل شد</span>' : '');
            var vb = isVoided(x) ? '' :
              '<button class="wbtn" data-voidx="' + x.id + '" style="background:var(--danger)">باطل</button>';
            return '<div class="iline">' + vb +
              '<div class="in"><b><span class="estbadge">به جنس</span> ' + esc(x.note || "برداشت") + tag + '</b>' +
              '<small class="num">' + fmtDate(x.date) + ' • ' + nf.format(x.qty) + ' ' + unitLabel(x.unit) +
                ' × ' + money(x.unitPrice) + '</small></div>' +
              '<div class="lt num" style="color:var(--credit)">' + money(x.amount) + '</div></div>';
          }
          return '<div class="iline">' +
            '<button class="wbtn" data-correct="' + x.id + '" style="background:var(--credit)">اصلاح</button>' +
            '<div class="in"><b>' + esc(x.note || "مصرف") + '</b><small class="num">' + fmtDate(x.date) + '</small></div>' +
            '<div class="lt num" style="color:var(--credit)">' + money(x.amount) + '</div></div>';
        }).join("");

    el.innerHTML =
      '<div class="subhead"><button class="back moreBack" aria-label="بازگشت">→</button><h3>مصارف خانه</h3></div>' +
      '<div style="padding:10px 14px 0"><button class="addline" id="newExpenseBtn" style="margin:0;border-color:var(--primary);background:var(--primary-soft);color:var(--primary)">＋ ثبت مصرف نقدی</button></div>' +
      '<div style="padding:8px 14px 4px"><button class="addline" id="newExpGoodsBtn" style="margin:0;border-color:var(--credit);background:var(--credit-soft);color:var(--credit)">🏠 برداشتن جنس از گدام برای خانه</button></div>' +
      '<div class="listhead">مصارف ثبت‌شده — مجموع: <span style="color:var(--credit)" class="num">' + money(total) + '</span>' +
        (goodsTotal ? ' <span style="font-weight:700;color:var(--ink-soft)">(از آن به جنس: <span class="num">' + money(goodsTotal) + '</span>)</span>' : '') + '</div>' +
      listHtml;
  }

  // ---------- مصرف خانه به جنس (برداشتن جنس از گدام) ----------
  function openExpenseGoods() {
    var picked = null, keptQty = "";
    function draw() {
      openSheet(
        '<h2>🏠 برداشتن جنس برای خانه</h2>' +
        '<p style="margin:-6px 0 12px;color:var(--ink-soft);font-size:13.5px;line-height:1.9">' +
          'جنسی که از گدام برای خانه می‌برید. <b>موجودی کم می‌شود</b> و ارزشش در مصارف خانه ' +
          'می‌آید، ولی <b>صندوق دست نمی‌خورد</b> — پولی از جعبه نرفته.</p>' +
        '<div class="field"><label>جنس</label>' +
          '<button type="button" class="addline" id="xPick" style="margin:0;text-align:center">' +
            (picked ? esc(picked.name) + ' — تبدیل' : '＋ انتخاب جنس') + '</button>' +
          '<div class="err" id="eXProd">جنس را انتخاب کنید</div></div>' +
        (picked ?
        '<div class="field"><label>مقدار (' + unitLabel(picked.unit) + ') — موجود: ' + qtyUnit(picked.qty, picked.unit) + '</label>' +
          '<input id="xQty" type="number" inputmode="decimal" step="any" min="0" value="' + esc(keptQty) + '" placeholder="0" /></div>' +
        '<div class="sumbox" id="xOut" style="margin-bottom:12px"></div>' : '') +
        '<div class="field"><label>توضیح (اختیاری)</label>' +
          '<input id="xNote" type="text" placeholder="مثلاً: برای خانه" /></div>' +
        '<div class="actions"><button class="ghost" data-close>لغو</button>' +
          '<button class="primary" id="xOk">ثبت</button></div>'
      );
      $("#xPick").addEventListener("click", openXPicker);
      if (picked) {
        $("#xQty").addEventListener("input", refresh);
        refresh();
        setTimeout(function () { $("#xQty").focus(); }, 60);
      }
      $("#xOk").addEventListener("click", commit);
    }
    function vals() {
      if (!picked) return null;
      var q = parseFloat($("#xQty").value);
      if (!(q > 0)) return null;
      return { qty: q, cost: +(q * (picked.buy || 0)).toFixed(2), retail: +(q * (picked.sell || 0)).toFixed(2) };
    }
    function refresh() {
      var v = vals(), out = $("#xOut");
      if (!v) { out.innerHTML = '<div class="sumrow"><span>ارزش</span><span class="num">—</span></div>'; return; }
      out.innerHTML =
        '<div class="sumrow total"><span>مصرف خانه (به قیمت خرید)</span><span class="num" style="color:var(--credit)">' + money(v.cost) + '</span></div>' +
        '<div class="sumrow"><span>به نرخ فروش می‌شد</span><span class="num">' + money(v.retail) + '</span></div>' +
        '<p style="font-size:12.5px;color:var(--ink-soft);line-height:1.8;margin:8px 0 0">' +
          'به <b>قیمت خرید</b> حساب می‌شود، چون چیزی فروخته نشده و فایده‌ای نبوده. ' +
          'همان‌قدر از دوکان رفته که برایش پول داده‌اید.</p>';
    }
    function openXPicker() {
      var list = products.slice().sort(function (a, b) {
        var oa = a.qty > 0 ? 0 : 1, ob = b.qty > 0 ? 0 : 1;
        if (oa !== ob) return oa - ob;
        return a.name.localeCompare(b.name, "fa");
      });
      openSheet(
        '<h2>کدام جنس؟</h2>' +
        (list.length === 0 ? '<p style="color:var(--ink-soft);text-align:center;padding:8px">هنوز جنسی نیست</p>' :
        list.map(function (p) {
          return '<div class="iline" data-xp="' + p.id + '" role="button" tabindex="0" style="cursor:pointer">' +
            '<div class="in"><b>' + esc(p.name) + '</b><small class="num">موجود: ' + qtyUnit(p.qty, p.unit) +
              ' • خرید: ' + money(p.buy || 0) + '</small></div></div>';
        }).join("")) +
        '<div class="actions"><button class="ghost" id="xBack">بازگشت</button></div>'
      );
      $("#xBack").addEventListener("click", draw);
      sheet.querySelectorAll("[data-xp]").forEach(function (el) {
        el.addEventListener("click", function () {
          var p = findP(el.dataset.xp);
          picked = { id: p.id, name: p.name, unit: p.unit, qty: p.qty, buy: p.buy || 0, sell: p.sell || 0 };
          keptQty = "";
          draw();
        });
      });
    }
    function commit() {
      if (!picked) { $("#eXProd").classList.add("show"); return; }
      var v = vals();
      if (!v) { toast("مقدار را درست بنویسید", true); return; }
      var p = findP(picked.id);
      if (!p) { toast("جنس پیدا نشد", true); return; }
      var note = $("#xNote").value.trim();
      keptQty = $("#xQty").value;
      if (!guardStockOut([{ productId: p.id, qty: v.qty }],
        "این مقدار بیشتر از موجودی گدام است:",
        function () { doExpenseGoods(p, v, note); }, draw)) return;
      doExpenseGoods(p, v, note);
    }
    function doExpenseGoods(p, v, note) {
      // قیمت خرید لحظهٔ برداشتن عکس گرفته می‌شود، تا تغییر بعدی نرخ‌ها
      // این رکورد را عوض نکند.
      expenses.push({ id: id(), date: new Date().toISOString(), amount: v.cost,
        note: note || ("برداشت " + p.name), kind: "goods",
        productId: p.id, productName: p.name, unit: p.unit,
        qty: v.qty, unitPrice: p.buy || 0 });
      p.qty = +(p.qty - v.qty).toFixed(3);
      save(LS_EXP, expenses); save(LS_P, products);
      closeSheet(); renderMore(); renderProducts(); renderSaleGrid();
      buzz(30);
      toast("برداشت ثبت شد ✓ موجودی کم شد");
    }
    draw();
  }

  // باطل‌کردن برداشت جنس — موجودی و مصرف خانه پس می‌آیند
  function voidGoodsExpense(rec) {
    if (isVoided(rec)) return;
    confirmVoid("باطل‌کردن برداشت جنس", [
      ["موجودی " + (rec.productName || "جنس"), "＋ " + nf.format(rec.qty)],
      ["مصارف خانه", "− " + money(rec.amount)],
      ["صندوق", "دست‌نخورده"]
    ], function () {
      var p = findP(rec.productId);
      if (p) p.qty = +(p.qty + rec.qty).toFixed(3);
      rec.reversed = true;
      expenses.push({ id: id(), date: new Date().toISOString(), amount: -rec.amount,
        note: "باطل‌کردن: " + (rec.note || ""), kind: "goods", reverseOf: rec.id,
        productId: rec.productId, productName: rec.productName, unit: rec.unit,
        qty: -rec.qty, unitPrice: rec.unitPrice });
      save(LS_EXP, expenses); save(LS_P, products);
      closeSheet(); renderMore(); renderProducts(); renderSaleGrid();
      toast("برداشت باطل شد ✓");
    });
  }

  function openExpenseForm() {
    openSheet(
      '<h2>ثبت مصرف خانه</h2>' +
      '<div class="field"><label>مبلغ (افغانی)</label>' +
        '<input id="expAmt" type="number" inputmode="decimal" step="any" min="0" placeholder="0" />' +
        '<div class="err" id="eExpAmt">مبلغ را درست بنویسید</div></div>' +
      '<div class="field"><label>توضیح (اختیاری)</label>' +
        '<input id="expNote" type="text" placeholder="مثلاً: نان و سبزی" /></div>' +
      '<div class="actions"><button class="ghost" data-close>لغو</button>' +
        '<button class="primary" id="expOk">ثبت مصرف</button></div>'
    );
    $("#expOk").addEventListener("click", function () {
      var amt = parseFloat($("#expAmt").value);
      var bad = !($("#expAmt").value !== "" && !isNaN(amt) && amt > 0);
      $("#eExpAmt").classList.toggle("show", bad);
      if (bad) return;
      var note = $("#expNote").value.trim();
      function commitExp() {
        expenses.push({ id: id(), date: new Date().toISOString(), amount: amt, note: note });
        save(LS_EXP, expenses);
        closeSheet(); renderMore();
        toast("مصرف ثبت شد ✓");
      }
      // مصرف خانه هم از صندوق می‌رود. اینجا «به قرض برود» معنی ندارد،
      // پس فقط دو راه: پول از جای دیگر آمده، یا رقم اصلاح شود.
      if (!guardCashOut({
        amount: amt,
        what: "این مصرف" + (note ? " — " + note : ""),
        fundNote: "برای مصرف خانه" + (note ? " — " + note : ""),
        proceed: function () { commitExp(); },
        onBack: function () { openExpenseForm(); }
      })) return;
      commitExp();
    });
    setTimeout(function () { $("#expAmt").focus(); }, 60);
  }

  function openCorrectionForm(orig) {
    var eff = expenseEffective(orig.id);
    openSheet(
      '<h2>اصلاح مصرف</h2>' +
      '<p style="margin:-6px 0 12px;color:var(--ink-soft);font-size:14px">' + esc(orig.note || "مصرف") + ' • مبلغ فعلی: <b class="num">' + money(eff) + '</b></p>' +
      '<div class="field"><label>مبلغ درست (افغانی)</label>' +
        '<input id="corAmt" type="number" inputmode="decimal" step="any" min="0" value="' + eff + '" />' +
        '<div class="err" id="eCorAmt">مبلغ را درست بنویسید</div></div>' +
      '<p style="color:var(--ink-soft);font-size:13px;margin:-4px 0 12px">مصرف اصلی پاک نمی‌شود؛ فقط یک «اصلاحیه» برای فرق ثبت می‌شود.</p>' +
      '<div class="actions"><button class="ghost" data-close>لغو</button>' +
        '<button class="primary" id="corOk">ثبت اصلاحیه</button></div>'
    );
    $("#corOk").addEventListener("click", function () {
      var val = parseFloat($("#corAmt").value);
      var bad = !($("#corAmt").value !== "" && !isNaN(val) && val >= 0);
      $("#eCorAmt").classList.toggle("show", bad);
      if (bad) return;
      var diff = +(val - eff).toFixed(2);
      if (diff === 0) { closeSheet(); toast("فرقی نبود"); return; }
      expenses.push({ id: id(), date: new Date().toISOString(), amount: diff, note: "اصلاحیه: " + (orig.note || "مصرف"), correctionOf: orig.id });
      save(LS_EXP, expenses);
      closeSheet(); renderMore();
      toast("اصلاحیه ثبت شد ✓");
    });
    setTimeout(function () { var i = $("#corAmt"); i.focus(); i.select(); }, 60);
  }


  function expiringProducts() {
    return products.filter(function (p) {
      var d = daysToExpiry(p.expiry);
      return d !== null && d <= EXPIRY_WARN_DAYS && p.qty > 0;
    }).sort(function (a, b) { return daysToExpiry(a.expiry) - daysToExpiry(b.expiry); });
  }

  function renderWaste(el) {
    var warnList = expiringProducts();
    var warnHtml = warnList.length === 0
      ? '<p style="color:var(--ink-soft);padding:8px 14px;font-size:14px">هیچ جنسی نزدیک خرابی نیست ✓</p>'
      : warnList.map(function (p) {
          var d = daysToExpiry(p.expiry);
          return '<div class="warn-card"><div class="wi">⏰</div>' +
            '<div class="wtx"><b>' + esc(p.name) + '</b><small>' + expiryLabel(d) + ' • موجود: ' + qtyUnit(p.qty, p.unit) + '</small></div>' +
            '<button class="wbtn" data-wexp="' + p.id + '">ثبت ضایعات</button></div>';
        }).join("");

    var totalLoss = 0;
    waste.forEach(function (w) { totalLoss += w.quantity * w.buyPrice; });
    var sorted = waste.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    var listHtml = sorted.length === 0
      ? '<p style="color:var(--ink-soft);text-align:center;padding:10px;font-size:14px">هنوز ضایعاتی ثبت نشده</p>'
      : sorted.map(function (w) {
          var tag = w.reverseOf ? ' <span class="retbadge">باطل‌کردن</span>'
                  : (w.reversed ? ' <span class="retbadge">باطل شد</span>' : '');
          var btn = isVoided(w) ? '' :
            '<button class="wbtn" data-voidw="' + w.id + '" style="background:var(--danger)">باطل</button>';
          return '<div class="iline">' + btn + '<div class="in"><b>' + esc(w.productName) + tag + '</b>' +
            '<small class="num">' + fmtDate(w.date) + ' • <span class="reason-badge">' + reasonLabel(w.reason) + '</span> • ' + qtyUnit(w.quantity, w.unit) + '</small></div>' +
            '<div class="lt num" style="color:var(--danger)">' + money(w.quantity * w.buyPrice) + '</div></div>';
        }).join("");

    el.innerHTML =
      '<div class="subhead"><button class="back moreBack" aria-label="بازگشت">→</button><h3>ضایعات و تاریخ خرابی</h3></div>' +
      '<div class="listhead">اخطار تاریخ خرابی (تا ' + EXPIRY_WARN_DAYS + ' روز)</div>' +
      warnHtml +
      '<div style="padding:10px 14px 4px"><button class="addline" id="newWasteBtn" style="margin:0">＋ ثبت ضایعات جدید</button></div>' +
      '<div class="listhead">ضایعات ثبت‌شده — مجموع ضرر: <span style="color:var(--danger)" class="num">' + money(totalLoss) + '</span></div>' +
      listHtml;
  }

  function openWastePicker() {
    if (products.length === 0) { toast("اول از بخش «اجناس» جنس اضافه کنید", true); return; }
    var list = products.map(function (p) {
      return '<div class="pick-item" data-wpick="' + p.id + '"><b>' + esc(p.name) + '</b><small class="num">موجود: ' + qtyUnit(p.qty, p.unit) + '</small></div>';
    }).join("");
    openSheet('<h2>انتخاب جنس ضایعاتی</h2><div class="pick">' + list + '</div>' +
      '<div class="actions"><button class="ghost" data-close>لغو</button></div>');
    sheet.querySelectorAll("[data-wpick]").forEach(function (it) {
      it.addEventListener("click", function () { var p = findP(it.dataset.wpick); if (p) openWasteForm(p, "spoiled"); });
    });
  }

  function openWasteForm(p, defaultReason) {
    var reason = defaultReason || "spoiled";
    openSheet(
      '<h2>ثبت ضایعات: ' + esc(p.name) + '</h2>' +
      '<p style="margin:-6px 0 12px;color:var(--ink-soft);font-size:14px">موجود: <b class="num">' + qtyUnit(p.qty, p.unit) + '</b> • قیمت خرید: <b class="num">' + money(p.buy) + '</b></p>' +
      '<div class="field"><label>سبب</label>' +
        '<div class="seg" id="wReason">' +
          '<button type="button" data-r="spoiled" class="' + (reason === "spoiled" ? "on" : "") + '">خراب</button>' +
          '<button type="button" data-r="expired" class="' + (reason === "expired" ? "on" : "") + '">تاریخ‌تیر</button>' +
        '</div></div>' +
      '<div class="field"><label>مقدار ضایع‌شده (' + unitLabel(p.unit) + ')</label>' +
        '<input id="wQty" type="number" inputmode="decimal" step="any" min="0" value="' + p.qty + '" /></div>' +
      '<div class="actions"><button class="ghost" data-close>لغو</button>' +
        '<button class="primary danger" id="wOk" style="background:var(--danger)">ثبت ضایعات</button></div>'
    );
    sheet.querySelectorAll("#wReason button").forEach(function (b) {
      b.addEventListener("click", function () {
        reason = b.dataset.r;
        sheet.querySelectorAll("#wReason button").forEach(function (x) { x.classList.toggle("on", x === b); });
      });
    });
    $("#wOk").addEventListener("click", function () {
      var qty = parseFloat($("#wQty").value) || 0;
      if (qty <= 0) return;
      // ضایعات هم خروج جنس است. بدون محافظ، تایپ ۹۹۹ به‌جای ۹ موجودی را
      // منفی می‌کرد **و** ضرر ساختگی به اندازهٔ همان مقدار در فایده می‌نشست.
      if (!guardStockOut([{ productId: p.id, qty: qty }],
        "این مقدار بیشتر از موجودی گدام است:",
        function () { recordWaste(p, qty, reason); },
        function () { openWasteForm(p, reason); })) return;
      recordWaste(p, qty, reason);
    });
  }

  function recordWaste(p, qty, reason) {
    p.qty = +(p.qty - qty).toFixed(3);
    waste.push({ id: id(), productId: p.id, productName: p.name, unit: p.unit, quantity: qty, buyPrice: p.buy || 0, date: new Date().toISOString(), reason: reason });
    save(LS_P, products); save(LS_WASTE, waste);
    closeSheet(); renderMore(); renderProducts(); renderSaleGrid();
    toast("ضایعات ثبت شد ✓ موجودی کم شد");
  }

  // ---------- Events ----------
  $("#priceBar").addEventListener("click", function (e) {
    var b = e.target.closest("[data-pf]"); if (!b) return;
    priceFilter = b.dataset.pf === "all" ? null : parseFloat(b.dataset.pf);
    renderSaleGrid();
    buzz();
  });
  $("#saleGrid").addEventListener("click", function (e) {
    var t = e.target.closest(".tile"); if (t) onTileTap(t.dataset.id);
  });
  $("#saleGrid").addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { var t = e.target.closest(".tile"); if (t) { e.preventDefault(); onTileTap(t.dataset.id); } }
  });
  $("#cartArea").addEventListener("click", function (e) {
    var b = e.target.closest("[data-rem]"); if (b) { removeLine(b.dataset.rem); return; }
    var d = e.target.closest("[data-dec]"); if (d) { bumpLine(d.dataset.dec, -1); return; }
    var i = e.target.closest("[data-inc]"); if (i) { bumpLine(i.dataset.inc, +1); return; }
  });
  $("#cartClear").addEventListener("click", function () {
    if (cart.length === 0) return;
    cart = []; clearChange(); renderCart(); buzz(20); toast("سبد پاک شد");
  });
  $("#changeToggle").addEventListener("click", function () {
    changeOpen = !changeOpen;
    this.classList.toggle("on", changeOpen);
    renderCart();
    if (changeOpen) setTimeout(function () { $("#paidAmt").focus(); }, 40);
  });
  $("#paidAmt").addEventListener("input", renderChange);
  $("#paidClr").addEventListener("click", function () { clearChange(); $("#paidAmt").focus(); });
  $("#paidChips").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var inp = $("#paidAmt");
    if (b.dataset.exact) inp.value = cartTotal();
    else inp.value = (parseFloat(inp.value) || 0) + parseFloat(b.dataset.add);
    renderChange(); buzz();
  });
  $("#btnTodaySales").addEventListener("click", openTodaySales);
  // برگشتی از داخل شیت «فروش‌های امروز» (یک‌بار ثبت می‌شود)
  sheet.addEventListener("click", function (e) {
    var b = e.target.closest("[data-ret]"); if (!b) return;
    var s = null;
    for (var i = 0; i < sales.length; i++) if (sales[i].id === b.dataset.ret) { s = sales[i]; break; }
    if (s) confirmReturn(s);
  });
  $("#btnCash").addEventListener("click", function () { finishSale("cash", null); });
  $("#btnCredit").addEventListener("click", openCreditDialog);

  $("#prodList").addEventListener("click", function (e) {
    var st = e.target.closest("[data-star]");
    if (st) {
      var ps = findP(st.dataset.star);
      if (ps) {
        ps.star = !ps.star; save(LS_P, products);
        renderProducts(); renderSaleGrid(); buzz();
        toast(ps.star ? "«" + ps.name + "» پرفروش شد ⭐" : "از پرفروش‌ها برداشته شد");
      }
      return;
    }
    var d = e.target.closest("[data-del]"); if (d) { var p = findP(d.dataset.del); if (p) confirmDelete(p); return; }
    var ed = e.target.closest("[data-edit]"); if (ed) { var pe = findP(ed.dataset.edit); if (pe) openProductForm(pe); }
  });
  $("#prodList").addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { var ed = e.target.closest("[data-edit]"); if (ed) { e.preventDefault(); var pe = findP(ed.dataset.edit); if (pe) openProductForm(pe); } }
  });
  $("#btnAdd").addEventListener("click", function () { openProductForm(null); });

  $("#btnNewPurchase").addEventListener("click", openPurchaseForm);
  $("#purchaseList").addEventListener("click", function (e) {
    var c = e.target.closest("[data-purchase]"); if (c) { var pu = findPurchase(c.dataset.purchase); if (pu) openPurchaseDetail(pu); }
  });
  $("#supplierList").addEventListener("click", function (e) {
    if (e.target.closest("#addSupplierBtn")) { openDebtorForm("supplier"); return; }
    var c = e.target.closest("[data-supplier]"); if (c) { var s = findS(c.dataset.supplier); if (s) openSupplierDetail(s); }
  });
  $("#supplierList").addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { var c = e.target.closest("[data-supplier]"); if (c) { e.preventDefault(); var s = findS(c.dataset.supplier); if (s) openSupplierDetail(s); } }
  });
  $("#customerList").addEventListener("click", function (e) {
    if (e.target.closest("#addCustomerBtn")) { openDebtorForm("customer"); return; }
    var c = e.target.closest("[data-customer]"); if (c) { var cu = findC(c.dataset.customer); if (cu) openCustomerDetail(cu); }
  });
  $("#customerList").addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { var c = e.target.closest("[data-customer]"); if (c) { e.preventDefault(); var cu = findC(c.dataset.customer); if (cu) openCustomerDetail(cu); } }
  });
  document.querySelectorAll("#debtToggle button").forEach(function (b) {
    b.addEventListener("click", function () {
      debtView = b.dataset.d;
      document.querySelectorAll("#debtToggle button").forEach(function (x) { x.classList.toggle("on", x === b); });
      renderDebts();
    });
  });
  $("#moreArea").addEventListener("click", function (e) {
    var m = e.target.closest("[data-more]"); if (m) { moreView = m.dataset.more; renderMore(); return; }
    if (e.target.closest(".moreBack")) { moreView = null; renderMore(); return; }
    if (e.target.closest("#newWasteBtn")) { openWastePicker(); return; }
    if (e.target.closest("#groupPriceBtn")) { openGroupPrice(); return; }
    if (e.target.closest("#bzNew")) { openBazaarSale(); return; }
    if (e.target.closest("#newExpGoodsBtn")) { openExpenseGoods(); return; }
    if (e.target.closest("#cashCountBtn")) { openCashCount(); return; }
    if (e.target.closest("#cashInBtn")) { openCashEntry("in"); return; }
    if (e.target.closest("#cashOutBtn")) { openCashEntry("out"); return; }
    if (e.target.closest("#setOpeningBtn")) { openCashEntry("opening"); return; }
    var me = e.target.closest("[data-medit]");
    if (me) { var mp = findP(me.dataset.medit); if (mp) openMarginEdit(mp); return; }
    var w = e.target.closest("[data-wexp]"); if (w) { var p = findP(w.dataset.wexp); if (p) openWasteForm(p, "expired"); return; }
    if (e.target.closest("#newExpenseBtn")) { openExpenseForm(); return; }
    var cor = e.target.closest("[data-correct]"); if (cor) { var ex = null; for (var i = 0; i < expenses.length; i++) if (expenses[i].id === cor.dataset.correct) ex = expenses[i]; if (ex) openCorrectionForm(ex); return; }
    var rp = e.target.closest("[data-rp]"); if (rp) { reportPeriod = rp.dataset.rp; renderMore(); return; }
    var ww = e.target.closest("[data-wifiwaste]"); if (ww) { var wp = findP(ww.dataset.wifiwaste); if (wp && wp.qty > 0) recordWaste(wp, wp.qty, "expired"); return; }
    if (e.target.closest("#saveCountBtn")) { saveCount(); }
  });
  $("#moreArea").addEventListener("input", function (e) {
    var ci = e.target.closest("[data-cnt]");
    if (ci) {
      var p = findP(ci.dataset.cnt); if (!p) return;
      var counted = parseFloat(ci.value);
      var span = document.querySelector('[data-cntdiff="' + p.id + '"]');
      if (!span) return;
      if (isNaN(counted)) { span.textContent = "۰"; span.style.color = "var(--ink-soft)"; return; }
      var diff = +(counted - p.qty).toFixed(3);
      span.textContent = (diff > 0 ? "+" : "") + nf.format(diff);
      span.style.color = diff < 0 ? "var(--danger)" : (diff > 0 ? "var(--primary)" : "var(--ink-soft)");
    }
  });

  $("#search").addEventListener("input", function () {
    $("#searchClr").style.display = this.value ? "block" : "none";
    renderSaleGrid();
  });
  $("#searchClr").addEventListener("click", function () { $("#search").value = ""; this.style.display = "none"; renderSaleGrid(); $("#search").focus(); });

  // جستجوی دفتر قرض — فقط فهرست دوباره رسم می‌شود، نه خود خانهٔ جستجو،
  // پس انگشت کاربر وسط تایپ از آن نمی‌پرد.
  $("#debtSearch").addEventListener("input", function () {
    debtQuery = this.value.trim().toLowerCase();
    $("#debtSearchClr").style.display = this.value ? "block" : "none";
    if (debtView === "customers") renderCustomers(); else renderSuppliers();
  });
  $("#debtSearchClr").addEventListener("click", function () {
    debtQuery = ""; $("#debtSearch").value = ""; this.style.display = "none";
    if (debtView === "customers") renderCustomers(); else renderSuppliers();
    $("#debtSearch").focus();
  });

  document.addEventListener("click", function (e) { if (e.target.closest("[data-close]")) closeSheet(); });

  // دکمه‌های «باطل» — چون بعضی‌شان داخل شیت‌اند و بعضی در صفحهٔ «بیشتر»،
  // یک شنوندهٔ عمومی برای همه.
  document.addEventListener("click", function (e) {
    if (READONLY) return;
    function pick(list, attr) {
      var b = e.target.closest("[" + attr + "]"); if (!b) return null;
      var wanted = b.getAttribute(attr);
      for (var i = 0; i < list.length; i++) if (list[i].id === wanted) return list[i];
      return null;
    }
    var r;
    if ((r = pick(custPayments, "data-voidcp"))) { voidCustPayment(r); return; }
    if ((r = pick(supPayments, "data-voidsp"))) { voidSupPayment(r); return; }
    if ((r = pick(cashEntries, "data-voidce"))) { voidCashEntry(r); return; }
    if ((r = pick(waste, "data-voidw"))) { voidWaste(r); return; }
    if ((r = pick(expenses, "data-voidx"))) { voidGoodsExpense(r); return; }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && overlay.classList.contains("open")) closeSheet(); });

  // Tabs
  function switchTab(scr) {
    currentTab = scr;
    ["sales", "products", "purchases", "debts", "more"].forEach(function (s) {
      $("#scr-" + s).classList.toggle("active", s === scr);
      $("#tab-" + s).classList.toggle("active", s === scr);
    });
    $("#cartbar").style.display = scr === "sales" ? "block" : "none";
    $("#fab").style.display = scr === "products" ? "flex" : "none";
    $("#fabBuy").style.display = scr === "purchases" ? "flex" : "none";
    var subs = { sales: "فروش تیز", products: "اجناس و موجودی", purchases: "فاکتور خرید", debts: "دفتر قرض‌ها", more: "بیشتر" };
    $("#hsub").textContent = subs[scr] || "";
    if (scr === "products") renderProducts();
    else if (scr === "purchases") renderPurchases();
    else if (scr === "debts") renderDebts();
    else if (scr === "more") { moreView = null; renderMore(); }
    else renderSaleGrid();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll("nav.tabs button").forEach(function (b) {
    b.addEventListener("click", function () { switchTab(b.dataset.scr); });
  });

  // ---------- Init ----------
  migrateMonthKeysToJalali();
  migrateDebtsToLedger();
  renderSaleGrid();
  renderCart();
  switchTab("sales");
  // عکس‌ها از IndexedDB می‌آیند (ناهم‌زمان) — بعد از رسیدن، صفحه دوباره رسم شود
  photoLoadAll().then(function () {
    renderSaleGrid();
    if (currentTab === "products") renderProducts();
  }).catch(function () {});
  // اگر سنک قبلاً روشن بوده، خودکار وصل شود
  try { var _sc = syncCfg(); if (_sc.enabled && _sc.url && _sc.key && _sc.shop) syncStart(); } catch (e) {}

  // ثبت سرویس‌ورکر برای نصب‌شدن مثل اپ و کارکرد آفلاین
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</html>
