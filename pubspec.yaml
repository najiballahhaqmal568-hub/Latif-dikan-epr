name: dukan_latif
description: "اپ مدیریت دوکان خورد مواد خوراکه — فروش و موجودی (دری، RTL، آفلاین)"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # دیتابیس محلی SQLite (آفلاین)
  sqflite: ^2.3.3
  path: ^1.9.0

  # مدیریت state
  provider: ^6.1.2

  # قالب‌بندی عدد و تاریخ (سازگار با نسخهٔ فلاتر که flutter_localizations آن را پین می‌کند)
  intl: ^0.20.2

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
