<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#1F7A4D" />
<title>دوکان لطیف</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<style>
  :root {
    --ground: #F4F3ED;
    --surface: #FFFFFF;
    --surface-2: #FBFAF6;
    --ink: #1B241F;
    --ink-soft: #5C665E;
    --line: #E5E3DA;
    --primary: #1F7A4D;
    --primary-ink: #FFFFFF;
    --primary-soft: #E4F1E9;
    --credit: #C8781A;
    --credit-soft: #F8EAD3;
    --danger: #C0392B;
    --danger-soft: #F7E1DD;
    --radius: 16px;
    --radius-sm: 11px;
    --shadow: 0 2px 10px rgba(20, 45, 30, .08);
    --shadow-lg: 0 -6px 22px rgba(20, 45, 30, .10);
    --nav-h: 62px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0F1310;
      --surface: #191E18;
      --surface-2: #1F251E;
      --ink: #ECF0E9;
      --ink-soft: #9AA69D;
      --line: #2B322A;
      --primary: #3FA96E;
      --primary-ink: #08130C;
      --primary-soft: #17301F;
      --credit: #E1A24A;
      --credit-soft: #3A2C13;
      --danger: #E5675A;
      --danger-soft: #3A1E1A;
      --shadow: 0 2px 10px rgba(0, 0, 0, .35);
      --shadow-lg: 0 -6px 22px rgba(0, 0, 0, .45);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0F1310; --surface: #191E18; --surface-2: #1F251E;
    --ink: #ECF0E9; --ink-soft: #9AA69D; --line: #2B322A;
    --primary: #3FA96E; --primary-ink: #08130C; --primary-soft: #17301F;
    --credit: #E1A24A; --credit-soft: #3A2C13;
    --danger: #E5675A; --danger-soft: #3A1E1A;
    --shadow: 0 2px 10px rgba(0,0,0,.35); --shadow-lg: 0 -6px 22px rgba(0,0,0,.45);
  }
  :root[data-theme="light"] {
    --ground: #F4F3ED; --surface: #FFFFFF; --surface-2: #FBFAF6;
    --ink: #1B241F; --ink-soft: #5C665E; --line: #E5E3DA;
    --primary: #1F7A4D; --primary-ink: #FFFFFF; --primary-soft: #E4F1E9;
    --credit: #C8781A; --credit-soft: #F8EAD3;
    --danger: #C0392B; --danger-soft: #F7E1DD;
    --shadow: 0 2px 10px rgba(20,45,30,.08); --shadow-lg: 0 -6px 22px rgba(20,45,30,.10);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    direction: rtl;
    font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", "Noto Naskh Arabic", -apple-system, system-ui, sans-serif;
    background: var(--ground);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-variant-numeric: tabular-nums; }

  /* App shell */
  .app {
    max-width: 520px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--ground);
    position: relative;
  }

  header.bar {
    background: var(--primary);
    color: var(--primary-ink);
    padding: 14px 18px calc(14px);
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  header.bar .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: rgba(255,255,255,.18);
    display: grid; place-items: center; font-size: 20px;
    flex: 0 0 auto;
  }
  header.bar h1 { font-size: 20px; margin: 0; font-weight: 800; letter-spacing: .2px; }
  header.bar .sub { font-size: 12.5px; opacity: .85; margin-top: 1px; }

  main { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .screen { display: none; }
  .screen.active { display: block; }

  /* Search */
  .searchwrap { padding: 12px 14px 6px; position: sticky; top: 0; background: var(--ground); z-index: 10; }
  .search {
    width: 100%; display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1.5px solid var(--line);
    border-radius: 14px; padding: 4px 14px; box-shadow: var(--shadow);
  }
  .search svg { flex: 0 0 auto; color: var(--ink-soft); }
  .search input {
    border: 0; outline: 0; background: transparent; color: var(--ink);
    font: inherit; font-size: 18px; padding: 13px 0; width: 100%;
  }
  .search button.clr {
    border: 0; background: transparent; color: var(--ink-soft);
    font-size: 22px; line-height: 1; padding: 6px; cursor: pointer;
  }

  /* Product grid (sales) */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 11px; padding: 10px 14px 6px;
  }
  .tile {
    background: var(--surface); border: 1.5px solid var(--line);
    border-radius: var(--radius); padding: 13px 10px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; box-shadow: var(--shadow); text-align: center;
    transition: transform .06s ease, border-color .12s ease;
    min-height: 118px; justify-content: center;
  }
  .tile:active { transform: scale(.96); }
  .tile .ico {
    width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
    font-size: 22px; margin-bottom: 2px;
  }
  .tile.w .ico { background: var(--primary-soft); color: var(--primary); }
  .tile.u .ico { background: var(--credit-soft); color: var(--credit); }
  .tile .nm { font-weight: 700; font-size: 16.5px; line-height: 1.25; }
  .tile .pr { font-size: 14px; font-weight: 700; }
  .tile.w .pr { color: var(--primary); }
  .tile.u .pr { color: var(--credit); }
  .tile .badge { font-size: 11px; color: var(--ink-soft); }
  .tile .oos { font-size: 11px; color: var(--danger); font-weight: 700; }

  /* Cart bar */
  .cartbar {
    position: sticky; bottom: 0; z-index: 15;
    background: var(--surface); border-top: 1px solid var(--line);
    box-shadow: var(--shadow-lg);
    border-radius: 18px 18px 0 0;
    padding: 8px 14px 12px;
  }
  .cartlist { max-height: 168px; overflow-y: auto; margin: 2px 0 4px; }
  .citem { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .citem:last-child { border-bottom: 0; }
  .citem .x {
    width: 30px; height: 30px; flex: 0 0 auto; border-radius: 8px; border: 0;
    background: var(--danger-soft); color: var(--danger); font-size: 19px; line-height: 1;
    cursor: pointer; display: grid; place-items: center;
  }
  .citem .cn { flex: 1 1 auto; min-width: 0; }
  .citem .cn b { font-weight: 700; font-size: 16px; display: block; }
  .citem .cn small { color: var(--ink-soft); font-size: 12.5px; }
  .citem .lt { font-weight: 800; font-size: 16px; white-space: nowrap; }
  .cart-empty { text-align: center; color: var(--ink-soft); padding: 14px 0; font-size: 15px; }
  .totrow { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 2px 10px; }
  .totrow .lbl { font-size: 19px; font-weight: 700; }
  .totrow .tot { font-size: 24px; font-weight: 900; color: var(--primary); }
  .payrow { display: flex; gap: 10px; }
  .btn {
    flex: 1 1 0; border: 0; border-radius: 14px; padding: 16px 8px;
    font: inherit; font-size: 18px; font-weight: 800; cursor: pointer; color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .06s ease, opacity .12s;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.cash { background: var(--primary); color: var(--primary-ink); }
  .btn.credit { background: var(--credit); }

  /* Products list */
  .listwrap { padding: 6px 0 16px; }
  .prow {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); margin: 8px 14px; padding: 12px 14px;
    border: 1.5px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  }
  .prow .ico { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex: 0 0 auto; }
  .prow.w .ico { background: var(--primary-soft); color: var(--primary); }
  .prow.u .ico { background: var(--credit-soft); color: var(--credit); }
  .prow .info { flex: 1 1 auto; min-width: 0; }
  .prow .info b { font-size: 18px; font-weight: 800; display: block; }
  .prow .info small { color: var(--ink-soft); font-size: 13px; }
  .prow .qty { text-align: left; flex: 0 0 auto; }
  .prow .qty .q { font-size: 17px; font-weight: 800; }
  .prow .qty .q.low { color: var(--danger); }
  .prow .qty small { display: block; font-size: 11.5px; color: var(--ink-soft); }
  .prow .del {
    width: 38px; height: 38px; border: 0; border-radius: 10px; flex: 0 0 auto;
    background: var(--danger-soft); color: var(--danger); font-size: 18px; cursor: pointer;
    display: grid; place-items: center;
  }
  .prow .tapzone { display: flex; align-items: center; gap: 12px; flex: 1 1 auto; min-width: 0; cursor: pointer; }

  .empty { text-align: center; color: var(--ink-soft); padding: 60px 30px; }
  .empty .big { font-size: 54px; }
  .empty p { font-size: 17px; margin: 10px 0 0; }

  .fab {
    position: fixed; bottom: calc(var(--nav-h) + 16px); inset-inline-start: 50%;
    transform: translateX(50%);
    max-width: 520px; width: calc(100% - 28px); pointer-events: none;
    display: flex; justify-content: flex-start;
  }
  .fab button {
    pointer-events: auto; border: 0; background: var(--primary); color: var(--primary-ink);
    font: inherit; font-weight: 800; font-size: 17px; padding: 15px 22px; border-radius: 30px;
    box-shadow: 0 6px 18px rgba(20,80,45,.3); cursor: pointer; display: flex; gap: 8px; align-items: center;
  }
  .fab button:active { transform: scale(.96); }

  /* Bottom nav */
  nav.tabs {
    position: sticky; bottom: 0; z-index: 25;
    height: var(--nav-h); display: flex; background: var(--surface);
    border-top: 1px solid var(--line);
  }
  nav.tabs button {
    flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink-soft);
    font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  }
  nav.tabs button.active { color: var(--primary); }
  nav.tabs button .dico { font-size: 22px; line-height: 1; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(10,20,14,.5); z-index: 40;
    display: none; align-items: flex-end; justify-content: center;
    padding: 0;
  }
  .overlay.open { display: flex; }
  @media (min-width: 560px) { .overlay { align-items: center; padding: 20px; } }
  .sheet {
    background: var(--surface); width: 100%; max-width: 520px;
    border-radius: 20px 20px 0 0; max-height: 92dvh; overflow-y: auto;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    animation: rise .18s ease;
  }
  @media (min-width: 560px) { .sheet { border-radius: 20px; } }
  @keyframes rise { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .sheet, .tile, .btn { animation: none; transition: none; } }
  .sheet h2 { margin: 2px 0 16px; font-size: 21px; font-weight: 800; }
  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 15px; font-weight: 700; margin-bottom: 7px; color: var(--ink-soft); }
  .field input[type=text], .field input[type=number], .field input[type=date] {
    width: 100%; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink);
    border-radius: 12px; padding: 14px; font: inherit; font-size: 18px; outline: 0;
  }
  .field input:focus { border-color: var(--primary); }
  .field input[type=number] { direction: ltr; text-align: right; }
  .err { color: var(--danger); font-size: 13.5px; margin-top: 6px; display: none; }
  .err.show { display: block; }

  .seg { display: flex; gap: 8px; }
  .seg button {
    flex: 1; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink);
    font: inherit; font-size: 16px; font-weight: 700; padding: 13px 6px; border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .seg button.on { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  .seg.credit button.on { background: var(--credit); border-color: var(--credit); color: #fff; }

  .qbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin: 4px 0 14px; }
  .qbtns button {
    border: 1.5px solid var(--primary); background: var(--primary-soft); color: var(--primary);
    font: inherit; font-size: 19px; font-weight: 800; padding: 16px; border-radius: 13px; cursor: pointer;
  }
  .qbtns button:active { transform: scale(.96); }

  .sheet .actions { display: flex; gap: 10px; margin-top: 8px; }
  .sheet .actions .ghost {
    flex: 0 0 auto; border: 1.5px solid var(--line); background: transparent; color: var(--ink-soft);
    font: inherit; font-size: 17px; font-weight: 700; padding: 15px 20px; border-radius: 13px; cursor: pointer;
  }
  .sheet .actions .primary {
    flex: 1 1 auto; border: 0; background: var(--primary); color: var(--primary-ink);
    font: inherit; font-size: 18px; font-weight: 800; padding: 15px; border-radius: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .sheet .actions .primary.danger { background: var(--danger); color: #fff; }

  /* Toast */
  .toast {
    position: fixed; inset-inline: 0; bottom: calc(var(--nav-h) + 18px);
    display: flex; justify-content: center; z-index: 60; pointer-events: none;
    opacity: 0; transition: opacity .2s, transform .2s; transform: translateY(10px);
  }
  .toast.show { opacity: 1; transform: none; }
  .toast .msg {
    background: var(--ink); color: var(--ground); padding: 13px 20px; border-radius: 30px;
    font-size: 16px; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.3); max-width: 90%;
  }
  .toast.warn .msg { background: var(--danger); color: #fff; }

  button:focus-visible, input:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

  /* Purchase / supplier */
  .listhead { padding: 14px 16px 2px; font-size: 15px; color: var(--ink-soft); font-weight: 800; }
  .sumbox { background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 14px; margin: 6px 0 14px; }
  .sumrow { display: flex; justify-content: space-between; padding: 4px 0; font-size: 16px; }
  .sumrow.total { font-size: 19px; font-weight: 800; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 8px; }
  .sumrow .rem { color: var(--danger); font-weight: 800; }
  .sumrow .paid { color: var(--primary); font-weight: 800; }
  .iline { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .iline:last-child { border-bottom: 0; }
  .iline .x { width: 30px; height: 30px; flex: 0 0 auto; border-radius: 8px; border: 0; background: var(--danger-soft); color: var(--danger); font-size: 19px; cursor: pointer; display: grid; place-items: center; }
  .iline .in { flex: 1 1 auto; min-width: 0; }
  .iline .in b { font-size: 16px; display: block; }
  .iline .miniflds { display: flex; gap: 7px; margin-top: 5px; }
  .iline .miniflds label { flex: 1; font-size: 11.5px; color: var(--ink-soft); font-weight: 700; }
  .iline .miniflds input { width: 100%; direction: ltr; text-align: right; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 9px; padding: 8px; font: inherit; font-size: 15px; outline: 0; margin-top: 2px; }
  .iline .miniflds input:focus { border-color: var(--primary); }
  .iline .lt { font-weight: 800; white-space: nowrap; font-size: 15px; align-self: flex-start; }
  .addline { width: 100%; border: 1.5px dashed var(--primary); background: var(--primary-soft); color: var(--primary); font: inherit; font-size: 16px; font-weight: 800; padding: 13px; border-radius: 12px; cursor: pointer; margin: 8px 0 14px; }
  .pcard { background: var(--surface); margin: 8px 14px; padding: 13px 15px; border: 1.5px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); cursor: pointer; }
  .pcard .r1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .pcard .r1 b { font-size: 17px; font-weight: 800; }
  .pcard .r1 .dt { font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
  .pcard .r2 { display: flex; justify-content: space-between; margin-top: 6px; font-size: 14px; color: var(--ink-soft); }
  .pcard .rem { color: var(--danger); font-weight: 800; }
  .pcard .paidz { color: var(--primary); font-weight: 800; }
  .pick { max-height: 52dvh; overflow-y: auto; margin: 4px 0 8px; }
  .pick-item { display: flex; justify-content: space-between; align-items: center; padding: 13px 12px; border: 1.5px solid var(--line); border-radius: 12px; margin-bottom: 8px; cursor: pointer; background: var(--surface-2); }
  .pick-item b { font-size: 16px; }
  .pick-item small { color: var(--ink-soft); font-size: 13px; }

  /* More menu */
  .menu-item {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); margin: 10px 14px; padding: 16px 16px;
    border: 1.5px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); cursor: pointer;
  }
  .menu-item .mico { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; font-size: 24px; background: var(--credit-soft); color: var(--credit); flex: 0 0 auto; }
  .menu-item .mtx { flex: 1 1 auto; }
  .menu-item .mtx b { font-size: 18px; font-weight: 800; display: block; }
  .menu-item .mtx small { color: var(--ink-soft); font-size: 13px; }
  .menu-item .chev { color: var(--ink-soft); font-size: 22px; }
  .subhead { display: flex; align-items: center; gap: 10px; padding: 12px 14px 4px; }
  .subhead .back { border: 0; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; width: 40px; height: 40px; font-size: 20px; cursor: pointer; color: var(--ink); }
  .subhead h3 { margin: 0; font-size: 19px; font-weight: 800; }

  /* Expiry warning */
  .warn-card {
    display: flex; align-items: center; gap: 10px;
    background: var(--danger-soft); margin: 8px 14px; padding: 12px 14px;
    border: 1.5px solid var(--danger); border-radius: 14px;
  }
  .warn-card .wi { font-size: 22px; }
  .warn-card .wtx { flex: 1 1 auto; min-width: 0; }
  .warn-card .wtx b { font-size: 16.5px; font-weight: 800; display: block; }
  .warn-card .wtx small { font-size: 13px; color: var(--danger); font-weight: 700; }
  .warn-card .wbtn { border: 0; background: var(--danger); color: #fff; font: inherit; font-weight: 800; font-size: 13.5px; padding: 10px 12px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
  .expbadge { display: inline-block; margin-top: 3px; font-size: 11.5px; font-weight: 800; color: var(--danger); }
  .reason-badge { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 20px; background: var(--credit-soft); color: var(--credit); }
</style>

<div class="app">
  <header class="bar">
    <div class="logo">🏪</div>
    <div>
      <h1>دوکان لطیف</h1>
      <div class="sub" id="hsub">فروش و موجودی</div>
    </div>
  </header>

  <main>
    <!-- Sales screen -->
    <section class="screen active" id="scr-sales">
      <div class="searchwrap">
        <div class="search">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="search" type="text" inputmode="search" placeholder="جستجوی جنس..." autocomplete="off" />
          <button class="clr" id="searchClr" style="display:none" aria-label="پاک">×</button>
        </div>
      </div>
      <div class="grid" id="saleGrid"></div>
    </section>

    <!-- Products screen -->
    <section class="screen" id="scr-products">
      <div class="listwrap" id="prodList"></div>
    </section>

    <!-- Purchases screen -->
    <section class="screen" id="scr-purchases">
      <div class="listhead">فاکتورهای خرید</div>
      <div class="listwrap" id="purchaseList"></div>
    </section>

    <!-- More hub screen -->
    <section class="screen" id="scr-more">
      <div class="listwrap" id="moreArea"></div>
    </section>

    <!-- Debts screen (customers + suppliers) -->
    <section class="screen" id="scr-debts">
      <div class="seg" id="debtToggle" style="margin:12px 14px 2px">
        <button type="button" data-d="customers" class="on">👤 مشتری‌ها</button>
        <button type="button" data-d="suppliers">🤝 تامین‌کننده‌ها</button>
      </div>
      <div class="listwrap" id="customerList"></div>
      <div class="listwrap" id="supplierList" style="display:none"></div>
    </section>
  </main>

  <!-- Cart (sales only) -->
  <div class="cartbar" id="cartbar">
    <div id="cartArea"></div>
    <div class="totrow">
      <span class="lbl">مجموع:</span>
      <span class="tot num" id="cartTotal">۰ افغانی</span>
    </div>
    <div class="payrow">
      <button class="btn cash" id="btnCash" disabled>✓ تمام — نقد</button>
      <button class="btn credit" id="btnCredit" disabled>◔ تمام — قرض</button>
    </div>
  </div>

  <!-- Add product FAB (products screen) -->
  <div class="fab" id="fab" style="display:none">
    <button id="btnAdd">＋ جنس جدید</button>
  </div>
  <!-- New purchase FAB (purchases screen) -->
  <div class="fab" id="fabBuy" style="display:none">
    <button id="btnNewPurchase">＋ فاکتور خرید جدید</button>
  </div>

  <nav class="tabs">
    <button class="active" id="tab-sales" data-scr="sales"><span class="dico">🧾</span>فروش</button>
    <button id="tab-products" data-scr="products"><span class="dico">📦</span>اجناس</button>
    <button id="tab-purchases" data-scr="purchases"><span class="dico">🛒</span>خرید</button>
    <button id="tab-debts" data-scr="debts"><span class="dico">📒</span>قرض‌ها</button>
    <button id="tab-more" data-scr="more"><span class="dico">☰</span>بیشتر</button>
  </nav>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"><div class="msg" id="toastMsg"></div></div>

<script>
"use strict";
(function () {
  // ---------- Storage ----------
  var LS_P = "dukan.products.v1", LS_S = "dukan.sales.v1", LS_SEED = "dukan.seeded.v1";
  var LS_SUP = "dukan.suppliers.v1", LS_PUR = "dukan.purchases.v1", LS_CUST = "dukan.customers.v1";
  var LS_SPAY = "dukan.supPayments.v1", LS_CPAY = "dukan.custPayments.v1", LS_WASTE = "dukan.waste.v1", LS_EXP = "dukan.expenses.v1";
  var EXPIRY_WARN_DAYS = 14;
  function load(key, def) { try { return JSON.parse(localStorage.getItem(key)) || def; } catch (e) { return def; } }
  function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

  var products = load(LS_P, null);
  var sales = load(LS_S, []);
  var suppliers = load(LS_SUP, []);
  var purchases = load(LS_PUR, []);
  var customers = load(LS_CUST, []);
  var supPayments = load(LS_SPAY, []); // رسیدهای پرداخت به تامین‌کننده
  var custPayments = load(LS_CPAY, []); // رسیدهای دریافت از مشتری
  var waste = load(LS_WASTE, []); // ضایعات
  var expenses = load(LS_EXP, []); // مصارف خانه
  if (products === null) {
    // نمونه‌های اولیه تا فوری امتحان شود (قابل حذف)
    products = [
      { id: id(), name: "بوره", type: "weighted", unit: "kg", buy: 55, sell: 70, qty: 20, expiry: "" },
      { id: id(), name: "برنج", type: "weighted", unit: "kg", buy: 80, sell: 100, qty: 15, expiry: "" },
      { id: id(), name: "روغن", type: "weighted", unit: "kg", buy: 110, sell: 140, qty: 12, expiry: "" },
      { id: id(), name: "کیک", type: "unit", unit: "piece", buy: 8, sell: 10, qty: 40, expiry: "" },
      { id: id(), name: "بوتل آب", type: "unit", unit: "piece", buy: 15, sell: 20, qty: 24, expiry: "" },
      { id: id(), name: "بسته چای", type: "unit", unit: "piece", buy: 45, sell: 60, qty: 10, expiry: "" },
      { id: id(), name: "صابون", type: "unit", unit: "piece", buy: 25, sell: 35, qty: 18, expiry: "" }
    ];
    save(LS_P, products);
    localStorage.setItem(LS_SEED, "1");
  }

  var cart = []; // {productId, qty}
  var currentTab = "sales";

  // ---------- Helpers ----------
  function id() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  var nf = new Intl.NumberFormat("en-US", { maximumFractionDigits: 3 });
  function money(n) { return nf.format(n) + " افغانی"; }
  function unitLabel(u) { return u === "kg" ? "کیلو" : (u === "gb" ? "جی‌بی" : "دانه"); }
  function qtyUnit(n, u) { return nf.format(n) + " " + unitLabel(u); }
  function findP(pid) { for (var i = 0; i < products.length; i++) if (products[i].id === pid) return products[i]; return null; }
  function findS(sid) { for (var i = 0; i < suppliers.length; i++) if (suppliers[i].id === sid) return suppliers[i]; return null; }
  function findC(cid) { for (var i = 0; i < customers.length; i++) if (customers[i].id === cid) return customers[i]; return null; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function $(s) { return document.querySelector(s); }
  function fmtDate(iso) { if (!iso) return ""; var d = new Date(iso); if (isNaN(d)) return iso; var p = function (n) { return (n < 10 ? "0" : "") + n; }; return d.getFullYear() + "/" + p(d.getMonth() + 1) + "/" + p(d.getDate()); }
  function todayISO() { return new Date().toISOString().slice(0, 10); }
  // روزهای مانده تا تاریخ خرابی (منفی = تیر شده). اگر تاریخ نبود null.
  function daysToExpiry(expiry) {
    if (!expiry) return null;
    var d = new Date(expiry); if (isNaN(d)) return null;
    var today = new Date(); today.setHours(0, 0, 0, 0);
    d.setHours(0, 0, 0, 0);
    return Math.round((d - today) / 86400000);
  }
  function expiryLabel(days) {
    if (days === null) return "";
    if (days < 0) return "تاریخ تیر شده";
    if (days === 0) return "امروز تیر می‌شود";
    return days + " روز تا خرابی";
  }
  function reasonLabel(r) { return r === "expired" ? "تاریخ‌تیر" : "خراب"; }

  var toastTimer;
  function toast(msg, warn) {
    var t = $("#toast"); $("#toastMsg").textContent = msg;
    t.classList.toggle("warn", !!warn); t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }

  // ---------- Sales grid ----------
  function renderSaleGrid() {
    var q = $("#search").value.trim().toLowerCase();
    var list = products.filter(function (p) { return !q || p.name.toLowerCase().indexOf(q) !== -1; });
    var g = $("#saleGrid");
    if (products.length === 0) {
      g.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="big">📦</div><p>هنوز جنسی ثبت نشده.<br>از بخش «اجناس» جنس اضافه کنید.</p></div>';
      return;
    }
    if (list.length === 0) {
      g.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="big">🔍</div><p>جنسی پیدا نشد</p></div>';
      return;
    }
    g.innerHTML = list.map(function (p) {
      var cls = p.type === "weighted" ? "w" : "u";
      var ico = p.type === "weighted" ? "⚖️" : "🧃";
      var oos = p.qty <= 0 ? '<div class="oos">موجود نیست</div>' : '';
      return '<div class="tile ' + cls + '" data-id="' + p.id + '" role="button" tabindex="0">' +
        '<div class="ico">' + ico + '</div>' +
        '<div class="nm">' + esc(p.name) + '</div>' +
        '<div class="pr num">' + money(p.sell) + '</div>' +
        '<div class="badge">' + (p.type === "weighted" ? "وزنی" : "دانه‌ای") + '</div>' +
        oos + '</div>';
    }).join("");
  }

  function onTileTap(pid) {
    var p = findP(pid); if (!p) return;
    if (p.qty <= 0) toast("اخطار: موجودی «" + p.name + "» صفر است", true);
    if (p.type === "weighted") openQtyDialog(p);
    else { addToCart(p.id, 1); }
  }

  // ---------- Cart ----------
  function cartLine(pid) { for (var i = 0; i < cart.length; i++) if (cart[i].productId === pid) return cart[i]; return null; }
  function addToCart(pid, qty) {
    if (qty <= 0) return;
    var line = cartLine(pid);
    if (line) line.qty += qty; else cart.push({ productId: pid, qty: qty });
    renderCart();
  }
  function removeLine(pid) { cart = cart.filter(function (l) { return l.productId !== pid; }); renderCart(); }
  function cartTotal() {
    var s = 0; cart.forEach(function (l) { var p = findP(l.productId); if (p) s += p.sell * l.qty; }); return s;
  }
  function renderCart() {
    var area = $("#cartArea");
    if (cart.length === 0) {
      area.innerHTML = '<div class="cart-empty">سبد خالی است — یک جنس را بزنید</div>';
    } else {
      area.innerHTML = '<div class="cartlist">' + cart.map(function (l) {
        var p = findP(l.productId); if (!p) return "";
        return '<div class="citem">' +
          '<button class="x" data-rem="' + p.id + '" aria-label="برگرداندن">×</button>' +
          '<div class="cn"><b>' + esc(p.name) + '</b><small class="num">' + qtyUnit(l.qty, p.unit) + ' × ' + money(p.sell) + '</small></div>' +
          '<div class="lt num">' + money(p.sell * l.qty) + '</div>' +
          '</div>';
      }).join("") + '</div>';
    }
    $("#cartTotal").textContent = money(cartTotal());
    var empty = cart.length === 0;
    $("#btnCash").disabled = empty; $("#btnCredit").disabled = empty;
  }

  function finishSale(type, customerName) {
    if (cart.length === 0) return;
    var items = cart.map(function (l) {
      var p = findP(l.productId);
      return { productId: p.id, productName: p.name, quantity: l.qty, sellPrice: p.sell, buyPrice: p.buy || 0 };
    });
    var total = cartTotal();
    var nm = (customerName || "").trim();
    var customerId = null;
    // فروش قرضی با نام: مشتری یافته/ساخته شود و قرض او زیاد گردد
    if (type === "credit" && nm) {
      var cust = null;
      for (var i = 0; i < customers.length; i++) { if (customers[i].name.trim().toLowerCase() === nm.toLowerCase()) { cust = customers[i]; break; } }
      if (!cust) { cust = { id: id(), name: nm, phone: "", debt: 0 }; customers.push(cust); }
      cust.debt = +(cust.debt + total).toFixed(2);
      customerId = cust.id;
      save(LS_CUST, customers);
    }
    sales.push({ id: id(), date: new Date().toISOString(), total: total, paymentType: type, customerName: nm || null, customerId: customerId, items: items });
    // کم‌کردن موجودی
    cart.forEach(function (l) { var p = findP(l.productId); if (p) p.qty = +(p.qty - l.qty).toFixed(3); });
    save(LS_S, sales); save(LS_P, products);
    cart = [];
    renderCart(); renderSaleGrid();
    toast(type === "cash" ? "فروش نقد ثبت شد ✓" : "فروش قرض ثبت شد ✓");
  }

  // ---------- Products list ----------
  function renderProducts() {
    var el = $("#prodList");
    if (products.length === 0) {
      el.innerHTML = '<div class="empty"><div class="big">📦</div><p>هنوز جنسی ثبت نشده.<br>دکمه «جنس جدید» را بزنید.</p></div>';
      return;
    }
    var sorted = products.slice().sort(function (a, b) { return a.name.localeCompare(b.name, "fa"); });
    el.innerHTML = sorted.map(function (p) {
      var cls = p.type === "weighted" ? "w" : "u";
      var ico = p.type === "weighted" ? "⚖️" : "🧃";
      var low = p.qty <= 0;
      var dte = daysToExpiry(p.expiry);
      var expWarn = (dte !== null && dte <= EXPIRY_WARN_DAYS)
        ? '<span class="expbadge">⏰ ' + expiryLabel(dte) + '</span>' : '';
      return '<div class="prow ' + cls + '">' +
        '<div class="tapzone" data-edit="' + p.id + '" role="button" tabindex="0">' +
          '<div class="ico">' + ico + '</div>' +
          '<div class="info"><b>' + esc(p.name) + '</b><small>' + (p.type === "weighted" ? "وزنی" : "دانه‌ای") + ' • فروش: ' + money(p.sell) + '</small>' + (expWarn ? '<br>' + expWarn : '') + '</div>' +
        '</div>' +
        '<div class="qty"><div class="q num ' + (low ? "low" : "") + '">' + qtyUnit(p.qty, p.unit) + '</div><small>' + (low ? "موجود نیست" : "موجود") + '</small></div>' +
        '<button class="del" data-del="' + p.id + '" aria-label="حذف">🗑</button>' +
        '</div>';
    }).join("");
  }

  // ---------- Modals ----------
  var overlay = $("#overlay"), sheet = $("#sheet");
  function openSheet(html) { sheet.innerHTML = html; overlay.classList.add("open"); }
  function closeSheet() { overlay.classList.remove("open"); sheet.innerHTML = ""; }
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeSheet(); });

  // Quantity dialog (weighted)
  function openQtyDialog(p) {
    var u = unitLabel(p.unit);
    openSheet(
      '<h2>مقدار ' + esc(p.name) + '</h2>' +
      '<p style="margin:-6px 0 12px;color:var(--ink-soft);font-size:15px">قیمت فی ' + u + ': <b class="num">' + money(p.sell) + '</b></p>' +
      '<div class="qbtns">' +
        '<button data-q="0.5">نیم ' + u + '</button>' +
        '<button data-q="1">۱ ' + u + '</button>' +
        '<button data-q="2">۲ ' + u + '</button>' +
        '<button data-q="5">۵ ' + u + '</button>' +
      '</div>' +
      '<div class="field"><label>یا مقدار دلخواه (' + u + ')</label>' +
        '<input id="qCustom" type="number" inputmode="decimal" step="any" min="0" placeholder="0" /></div>' +
      '<div class="actions"><button class="ghost" data-close>لغو</button>' +
        '<button class="primary" id="qAdd">＋ اضافه به سبد</button></div>'
    );
    sheet.querySelectorAll(".qbtns button").forEach(function (b) {
      b.addEventListener("click", function () { addToCart(p.id, parseFloat(b.dataset.q)); closeSheet(); });
    });
    $("#qAdd").addEventListener("click", function () {
      var v = parseFloat($("#qCustom").value); if (v > 0) { addToCart(p.id, v); closeSheet(); }
    });
    setTimeout(function () { $("#qCustom").focus(); }, 60);
  }

  // Credit customer dialog
  function openCreditDialog() {
    openSheet(
      '<h2>فروش قرض</h2>' +
      '<div class="field"><label>نام مشتری (اختیاری)</label>' +
        '<input id="custName" type="text" placeholder="مثلاً: احمد" /></div>' +
      '<div class="actions"><button class="ghost" data-close>لغو</button>' +
        '<button class="primary" id="creditOk">◔ ثبت قرض</button></div>'
    );
    $("#creditOk").addEventListener("click", function () {
      var nm = $("#custName").value.trim();
      closeSheet(); finishSale("credit", nm || null);
    });
    setTimeout(function () { $("#custName").focus(); }, 60);
  }

  // Add / edit product form
  function openProductForm(existing) {
    var p = existing || { name: "", type: "unit", unit: "piece", buy: "", sell: "", qty: "", expiry: "" };
    var editing = !!existing;
    openSheet(
      '<h2>' + (editing ? "ویرایش جنس" : "جنس جدید") + '</h2>' +
      '<div class="field"><label>نام جنس</label>' +
        '<input id="fName" type="text" value="' + esc(p.name) + '" placeholder="نام جنس" />' +
        '<div class="err" id="eName">نام جنس را بنویسید</div></div>' +
      '<div class="field"><label>نوع جنس</label>' +
        '<div class="seg" id="segType">' +
          '<button type="button" data-t="weighted" class="' + (p.type === "weighted" ? "on" : "") + '">⚖️ وزنی</button>' +
          '<button type="button" data-t="unit" class="' + (p.type === "unit" ? "on" : "") + '">🧃 دانه‌ای</button>' +
        '</div></div>' +
      '<div class="field"><label>واحد</label>' +
        '<div class="seg" id="segUnit">' +
          '<button type="button" data-u="kg" class="' + (p.unit === "kg" ? "on" : "") + '">کیلو</button>' +
          '<button type="button" data-u="piece" class="' + (p.unit === "piece" ? "on" : "") + '">دانه</button>' +
        '</div></div>' +
      '<div class="field"><label>قیمت خرید (افغانی)</label>' +
        '<input id="fBuy" type="number" inputmode="decimal" step="any" min="0" value="' + p.buy + '" placeholder="0" /></div>' +
      '<div class="field"><label>قیمت فروش (افغانی)</label>' +
        '<input id="fSell" type="number" inputmode="decimal" step="any" min="0" value="' + p.sell + '" placeholder="0" />' +
        '<div class="err" id="eSell">قیمت فروش را درست بنویسید</div></div>' +
      '<div class="field"><label id="lQty">تعداد موجود</label>' +
        '<input id="fQty" type="number" inputmode="decimal" step="any" min="0" value="' + p.qty + '" placeholder="0" /></div>' +
      '<div class="field"><label>تاریخ خرابی (اختیاری)</label>' +
        '<input id="fExp" type="date" value="' + (p.expiry || "") + '" /></div>' +
      '<div class="actions">' +
        (editing ? '<button class="ghost" id="fDelete" style="color:var(--danger);border-color:var(--danger)">حذف</button>' : '<button class="ghost" data-close>لغو</button>') +
        '<button class="primary" id="fSave">💾 ' + (editing ? "ذخیره تغییرات" : "ثبت جنس") + '</button>' +
      '</div>'
    );

    var type = p.type, unit = p.unit;
    function refreshQtyLabel() { $("#lQty").textContent = type === "weighted" ? "مقدار موجود (کیلو)" : "تعداد موجود (دانه)"; }
    refreshQtyLabel();
    sheet.querySelectorAll("#segType button").forEach(function (b) {
      b.addEventListener("click", function () {
        type = b.dataset.t;
        sheet.querySelectorAll("#segType button").forEach(function (x) { x.classList.toggle("on", x === b); });
        // واحد پیش‌فرض از روی نوع
        unit = type === "weighted" ? "kg" : "piece";
        sheet.querySelectorAll("#segUnit button").forEach(function (x) { x.classList.toggle("on", x.dataset.u === unit); });
        refreshQtyLabel();
      });
    });
    sheet.querySelectorAll("#segUnit button").forEach(function (b) {
      b.addEventListener("click", function () {
        unit = b.dataset.u;
        sheet.querySelectorAll("#segUnit button").forEach(function (x) { x.classList.toggle("on", x === b); });
      });
    });

    $("#fSave").addEventListener("click", function () {
      var name = $("#fName").value.trim();
      var sell = parseFloat($("#fSell").value);
      var ok = true;
      $("#eName").classList.toggle("show", !name); if (!name) ok = false;
      var badSell = !($("#fSell").value !== "" && !isNaN(sell) && sell >= 0);
      $("#eSell").classList.toggle("show", badSell); if (badSell) ok = false;
      if (!ok) return;
      var rec = {
        id: editing ? p.id : id(),
        name: name, type: type, unit: unit,
        buy: parseFloat($("#fBuy").value) || 0,
        sell: sell,
        qty: parseFloat($("#fQty").value) || 0,
        expiry: $("#fExp").value || ""
      };
      if (editing) {
        for (var i = 0; i < products.length; i++) if (products[i].id === p.id) { products[i] = rec; break; }
      } else products.push(rec);
      save(LS_P, products);
      closeSheet(); renderProducts(); renderSaleGrid();
      toast(editing ? "تغییرات ذخیره شد ✓" : "جنس ثبت شد ✓");
    });

    if (editing) {
      $("#fDelete").addEventListener("click", function () { confirmDelete(p); });
    }
    setTimeout(function () { if (!editing) $("#fName").focus(); }, 60);
  }

  function confirmDelete(p) {
    openSheet(
      '<h2>حذف جنس</h2>' +
      '<p style="font-size:17px;margin:0 0 18px">آیا «' + esc(p.name) + '» حذف شود؟</p>' +
      '<div class="actions"><button class="ghost" data-close>نی</button>' +
        '<button class="primary danger" id="delYes">حذف</button></div>'
    );
    $("#delYes").addEventListener("click", function () {
      products = products.filter(function (x) { return x.id !== p.id; });
      cart = cart.filter(function (l) { return l.productId !== p.id; });
      save(LS_P, products);
      closeSheet(); renderProducts(); renderSaleGrid(); renderCart();
      toast("«" + p.name + "» حذف شد");
    });
  }

  // ---------- Purchases (فاکتور خرید) ----------
  function findPurchase(pid) { for (var i = 0; i < purchases.length; i++) if (purchases[i].id === pid) return purchases[i]; return null; }

  function renderPurchases() {
    var el = $("#purchaseList");
    if (purchases.length === 0) {
      el.innerHTML = '<div class="empty"><div class="big">🛒</div><p>هنوز فاکتور خریدی ثبت نشده.<br>دکمه «فاکتور خرید جدید» را بزنید.</p></div>';
      return;
    }
    var sorted = purchases.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    el.innerHTML = sorted.map(function (pu) {
      var rem = pu.remaining > 0 ? '<span class="rem num">باقی: ' + money(pu.remaining) + '</span>' : '<span class="paidz">تصفیه شد</span>';
      return '<div class="pcard" data-purchase="' + pu.id + '">' +
        '<div class="r1"><b>' + esc(pu.supplierName || "بدون نام") + '</b><span class="dt num">' + fmtDate(pu.date) + '</span></div>' +
        '<div class="r2"><span class="num">مجموع: ' + money(pu.total) + '</span>' + rem + '</div></div>';
    }).join("");
  }

  function openPurchaseDetail(pu) {
    var rows = pu.items.map(function (it) {
      return '<div class="iline"><div class="in"><b>' + esc(it.productName) + '</b><small class="num">' + nf.format(it.qty) + ' × ' + money(it.buyPrice) + '</small></div>' +
        '<div class="lt num">' + money(it.qty * it.buyPrice) + '</div></div>';
    }).join("");
    openSheet(
      '<h2>فاکتور ' + esc(pu.supplierName || "") + '</h2>' +
      '<p style="margin:-6px 0 12px;color:var(--ink-soft);font-size:14px" class="num">تاریخ: ' + fmtDate(pu.date) + '</p>' +
      rows +
      '<div class="sumbox">' +
        '<div class="sumrow"><span>مجموع فاکتور</span><span class="num">' + money(pu.total) + '</span></div>' +
        '<div class="sumrow"><span>پرداخت‌شده</span><span class="paid num">' + money(pu.paid) + '</span></div>' +
        '<div class="sumrow total"><span>باقی‌مانده (قرض)</span><span class="rem num">' + money(pu.remaining) + '</span></div>' +

  // Invoice builder (draft in memory)
  var draft = null;
  function syncDraftInputs() {
    if (!draft) return;
    var sn = $("#pSupplier"), ph = $("#pPhone"), dt = $("#pDate"), pd = $("#pPaid");
    if (sn) draft.supplierName = sn.value;
    if (ph) draft.phone = ph.value;
    if (dt) draft.date = dt.value;
    if (pd) draft.paid = parseFloat(pd.value) || 0;
  }
  function draftTotal() { var s = 0; draft.lines.forEach(function (l) { s += (l.qty || 0) * (l.buyPrice || 0); }); return s; }

  function openPurchaseForm() {
    if (products.length === 0) { toast("اول از بخش «اجناس» جنس اضافه کنید", true); return; }
    draft = { supplierName: "", phone: "", date: todayISO(), lines: [], paid: 0 };
    renderPurchaseForm();
  }

  function renderPurchaseForm() {
    var total = draftTotal();
    var rem = Math.max(0, total - (draft.paid || 0));
    var lines = draft.lines.length === 0
      ? '<p style="color:var(--ink-soft);font-size:14px;text-align:center;padding:6px 0">هنوز جنسی اضافه نشده</p>'
      : draft.lines.map(function (l, i) {
          return '<div class="iline">' +
            '<button class="x" data-rline="' + i + '" aria-label="حذف">×</button>' +
            '<div class="in"><b>' + esc(l.name) + '</b>' +
              '<div class="miniflds">' +
                '<label>تعداد (' + unitLabel(l.unit) + ')<input type="number" inputmode="decimal" step="any" min="0" data-lqty="' + i + '" value="' + l.qty + '" /></label>' +
                '<label>قیمت خرید<input type="number" inputmode="decimal" step="any" min="0" data-lbuy="' + i + '" value="' + l.buyPrice + '" /></label>' +
              '</div>' +
            '</div>' +
            '<div class="lt num" data-llt="' + i + '">' + money((l.qty || 0) * (l.buyPrice || 0)) + '</div>' +
          '</div>';
        }).join("");

    openSheet(
      '<h2>فاکتور خرید جدید</h2>' +
      '<div class="field"><label>نام تامین‌کننده</label>' +
        '<input id="pSupplier" type="text" value="' + esc(draft.supplierName) + '" placeholder="نام تامین‌کننده" />' +
        '<div class="err" id="ePSup">نام تامین‌کننده را بنویسید</div></div>' +
      '<div class="field"><label>نمبر تیلفون (اختیاری)</label>' +
        '<input id="pPhone" type="text" inputmode="tel" value="' + esc(draft.phone) + '" placeholder="07..." /></div>' +
      '<div class="field"><label>تاریخ</label>' +
        '<input id="pDate" type="date" value="' + (draft.date || "") + '" /></div>' +
      '<label style="font-size:15px;font-weight:800;color:var(--ink-soft)">اجناس فاکتور</label>' +
      '<div style="margin-top:6px">' + lines + '</div>' +
      '<button class="addline" id="pAddLine">＋ افزودن جنس</button>' +
      '<div class="field"><label>پرداخت شد (افغانی)</label>' +
        '<input id="pPaid" type="number" inputmode="decimal" step="any" min="0" value="' + (draft.paid || "") + '" placeholder="0" /></div>' +
      '<div class="sumbox">' +
        '<div class="sumrow"><span>مجموع فاکتور</span><span class="num" id="pTotal">' + money(total) + '</span></div>' +
        '<div class="sumrow total"><span>باقی‌مانده (قرض)</span><span class="rem num" id="pRem">' + money(rem) + '</span></div>' +
      '</div>' +
      '<div class="actions"><button class="ghost" data-close>لغو</button>' +
        '<button class="primary" id="pSave">💾 ثبت فاکتور</button></div>'
    );

    function recompute() {
      var t = draftTotal(); var r = Math.max(0, t - (parseFloat($("#pPaid").value) || 0));
      $("#pTotal").textContent = money(t); $("#pRem").textContent = money(r);
    }
    sheet.querySelectorAll("[data-lqty]").forEach(function (inp) {
      inp.addEventListener("input", function () {
        var i = +inp.dataset.lqty; draft.lines[i].qty = parseFloat(inp.value) || 0;
        var lt = sheet.querySelector('[data-llt="' + i + '"]'); if (lt) lt.textContent = money(draft.lines[i].qty * draft.lines[i].buyPrice);
        recompute();
      });
    });
    sheet.querySelectorAll("[data-lbuy]").forEach(function (inp) {
      inp.addEventListener("input", function () {
        var i = +inp.dataset.lbuy; draft.lines[i].buyPrice = parseFloat(inp.value) || 0;
        var lt = sheet.querySelector('[data-llt="' + i + '"]'); if (lt) lt.textContent = money(draft.lines[i].qty * draft.lines[i].buyPrice);
        recompute();
      });
    });
    sheet.querySelectorAll("[data-rline]").forEach(function (b) {
      b.addEventListener("click", function () { syncDraftInputs(); draft.lines.splice(+b.dataset.rline, 1); renderPurchaseForm(); });
    });
    $("#pPaid").addEventListener("input", recompute);
    $("#pAddLine").addEventListener("click", function () { syncDraftInputs(); openLinePicker(); });
    $("#pSave").addEventListener("click", savePurchase);
  }

  function openLinePicker() {
    var existingIds = draft.lines.map(function (l) { return l.productId; });
    var avail = products.filter(function (p) { return existingIds.indexOf(p.id) === -1; });
    var list = avail.length === 0
      ? '<p style="color:var(--ink-soft);text-align:center;padding:10px">همه اجناس در فاکتور اضافه شده‌اند</p>'
      : avail.map(function (p) {
          return '<div class="pick-item" data-pick="' + p.id + '"><b>' + esc(p.name) + '</b><small class="num">موجود: ' + qtyUnit(p.qty, p.unit) + '</small></div>';
        }).join("");
    openSheet(
      '<h2>انتخاب جنس</h2>' +
      '<button class="addline" id="pickNew">＋ جنس نو (که در اجناس نیست)</button>' +
      '<div class="pick">' + list + '</div>' +
      '<div class="actions"><button class="primary" id="pickBack">بازگشت به فاکتور</button></div>'
    );
    sheet.querySelectorAll("[data-pick]").forEach(function (it) {
      it.addEventListener("click", function () {
        var p = findP(it.dataset.pick);
        draft.lines.push({ productId: p.id, name: p.name, unit: p.unit, qty: 1, buyPrice: p.buy || 0 });
        renderPurchaseForm();
      });
    });
    $("#pickNew").addEventListener("click", openNewProductLine);
    $("#pickBack").addEventListener("click", renderPurchaseForm);
  }

  // فورم «جنس نو» داخل فاکتور خرید — با ثبت فاکتور خودکار در اجناس ثبت می‌شود.
  function openNewProductLine() {
    var type = "unit", unit = "piece";
    openSheet(
      '<h2>جنس نو</h2>' +
      '<div class="field"><label>نام جنس</label>' +
        '<input id="npName" type="text" placeholder="نام جنس" />' +
        '<div class="err" id="eNpName">نام جنس را بنویسید</div></div>' +
      '<div class="field"><label>نوع جنس</label>' +
        '<div class="seg" id="npType">' +
          '<button type="button" data-t="weighted">⚖️ وزنی</button>' +
          '<button type="button" data-t="unit" class="on">🧃 دانه‌ای</button>' +
        '</div></div>' +
      '<div class="field"><label>واحد</label>' +
        '<div class="seg" id="npUnit">' +
          '<button type="button" data-u="kg">کیلو</button>' +
          '<button type="button" data-u="piece" class="on">دانه</button>' +
        '</div></div>' +
      '<div class="field"><label>قیمت فروش (افغانی)</label>' +
        '<input id="npSell" type="number" inputmode="decimal" step="any" min="0" placeholder="0" /></div>' +
      '<p style="color:var(--ink-soft);font-size:13px;margin:-4px 0 12px">قیمت خرید و تعداد را در خود فاکتور می‌نویسید.</p>' +
      '<div class="actions"><button class="ghost" id="npBack">بازگشت</button>' +
        '<button class="primary" id="npAdd">＋ افزودن به فاکتور</button></div>'
    );
    sheet.querySelectorAll("#npType button").forEach(function (b) {
      b.addEventListener("click", function () {
        type = b.dataset.t; unit = type === "weighted" ? "kg" : "piece";
        sheet.querySelectorAll("#npType button").forEach(function (x) { x.classList.toggle("on", x === b); });
        sheet.querySelectorAll("#npUnit button").forEach(function (x) { x.classList.toggle("on", x.dataset.u === unit); });
      });
    });
    sheet.querySelectorAll("#npUnit button").forEach(function (b) {
      b.addEventListener("click", function () {
        unit = b.dataset.u;
        sheet.querySelectorAll("#npUnit button").forEach(function (x) { x.classList.toggle("on", x === b); });
      });
    });
    $("#npBack").addEventListener("click", openLinePicker);
    $("#npAdd").addEventListener("click", function () {
      var nm = $("#npName").value.trim();
      $("#eNpName").classList.toggle("show", !nm);
      if (!nm) return;
      var sell = parseFloat($("#npSell").value) || 0;
      draft.lines.push({ productId: id(), name: nm, unit: unit, type: type, sellPrice: sell, qty: 1, buyPrice: 0, isNew: true });
      renderPurchaseForm();
    });
    setTimeout(function () { $("#npName").focus(); }, 60);
  }

  function savePurchase() {
    syncDraftInputs();
    var name = (draft.supplierName || "").trim();
    var okName = !!name;
    if ($("#ePSup")) $("#ePSup").classList.toggle("show", !okName);
    var validLines = draft.lines.filter(function (l) { return l.qty > 0; });
    if (!okName) return;
    if (validLines.length === 0) { toast("حداقل یک جنس با تعداد بیشتر از صفر اضافه کنید", true); return; }

    var total = 0; validLines.forEach(function (l) { total += l.qty * l.buyPrice; });
    var paid = draft.paid || 0;
    var remaining = Math.max(0, total - paid);

    var sup = null;
    for (var i = 0; i < suppliers.length; i++) { if (suppliers[i].name.trim().toLowerCase() === name.toLowerCase()) { sup = suppliers[i]; break; } }
    if (!sup) { sup = { id: id(), name: name, phone: draft.phone || "", debt: 0 }; suppliers.push(sup); }
    else if (draft.phone && !sup.phone) sup.phone = draft.phone;

    validLines.forEach(function (l) {
      // جنس نو: اول در اجناس ثبت شود (تعداد ۰، بعد از حلقه پایین زیاد می‌شود)
      if (l.isNew && !findP(l.productId)) {
        products.push({ id: l.productId, name: l.name, type: l.type || "unit", unit: l.unit, buy: l.buyPrice, sell: l.sellPrice || 0, qty: 0, expiry: "" });
      }
      var p = findP(l.productId);
      if (p) { p.qty = +(p.qty + l.qty).toFixed(3); p.buy = l.buyPrice; }
    });
    sup.debt = +(sup.debt + remaining).toFixed(2);

    purchases.push({
      id: id(), supplierId: sup.id, supplierName: sup.name, date: draft.date || todayISO(),
      total: total, paid: paid, remaining: remaining,
      items: validLines.map(function (l) { return { productId: l.productId, productName: l.name, qty: l.qty, buyPrice: l.buyPrice }; })
    });

    save(LS_PUR, purchases); save(LS_SUP, suppliers); save(LS_P, products);
    draft = null; closeSheet();
    renderPurchases(); renderSuppliers(); renderProducts(); renderSaleGrid();
    toast("فاکتور خرید ثبت شد ✓ موجودی زیاد شد");
  }

  // ---------- Suppliers (قرض تامین‌کننده) ----------
  function renderSuppliers() {
    var el = $("#supplierList");
    if (suppliers.length === 0) {
      el.innerHTML = '<div class="empty"><div class="big">🤝</div><p>هنوز تامین‌کننده‌ای نیست.<br>با ثبت فاکتور خرید، تامین‌کننده ساخته می‌شود.</p></div>';
      return;
    }
    var sorted = suppliers.slice().sort(function (a, b) { return b.debt - a.debt; });
    el.innerHTML = sorted.map(function (s) {
      var low = s.debt > 0;
      return '<div class="prow u">' +
        '<div class="tapzone" data-supplier="' + s.id + '" role="button" tabindex="0">' +
          '<div class="ico">🤝</div>' +
          '<div class="info"><b>' + esc(s.name) + '</b><small>' + (s.phone ? esc(s.phone) : "بدون نمبر") + '</small></div>' +
        '</div>' +
        '<div class="qty"><div class="q num ' + (low ? "low" : "") + '">' + money(s.debt) + '</div><small>' + (low ? "قرض ما" : "تصفیه") + '</small></div>' +
        '</div>';
    }).join("");
  }

  function openSupplierDetail(s) {
    var theirs = purchases.filter(function (p) { return p.supplierId === s.id; })
      .sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    var rows = theirs.length === 0 ? '<p style="color:var(--ink-soft);text-align:center;padding:8px">فاکتوری نیست</p>'
      : theirs.map(function (pu) {

        }).join("");
    openSheet(
      '<h2>' + esc(s.name) + '</h2>' +
      (s.phone ? '<p style="margin:-6px 0 10px;color:var(--ink-soft)" class="num">' + esc(s.phone) + '</p>' : '') +
      '<div class="sumbox"><div class="sumrow total"><span>مجموع قرض ما</span><span class="rem num">' + money(s.debt) + '</span></div></div>' +
      (s.debt > 0 ? '<button class="addline" id="payBtn" style="border-style:solid;background:var(--primary);color:var(--primary-ink);border-color:var(--primary)">💵 پرداخت به تامین‌کننده</button>' : '') +

      '<div style="margin-top:6px">' + rows + '</div>' +
      '<div class="actions"><button class="primary" data-close>بستن</button></div>'
    );
    if (s.debt > 0) $("#payBtn").addEventListener("click", function () { openPayDialog(s); });
  }

  // سطرهای رسید پرداخت/دریافت (تاریخ + مبلغ)
  function payReceiptRows(list, key, refId) {
    var mine = list.filter(function (x) { return x[key] === refId; })
      .sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    if (mine.length === 0) return '<p style="color:var(--ink-soft);text-align:center;padding:8px">رسیدی ثبت نشده</p>';
    return mine.map(function (r) {
      return '<div class="iline"><div class="in"><b class="num">' + fmtDate(r.date) + '</b><small>رسید</small></div><div class="lt num" style="color:var(--primary)">' + money(r.amount) + '</div></div>';
    }).join("");
  }

  function openPayDialog(s) {
    openSheet(
      '<h2>پرداخت به ' + esc(s.name) + '</h2>' +
      '<p style="margin:-6px 0 12px;color:var(--ink-soft)">قرض فعلی: <b class="num">' + money(s.debt) + '</b></p>' +
      '<div class="field"><label>مقدار پرداخت (افغانی)</label>' +
        '<input id="payAmt" type="number" inputmode="decimal" step="any" min="0" placeholder="0" /></div>' +
      '<div class="actions"><button class="ghost" data-close>لغو</button>' +
        '<button class="primary" id="payOk">ثبت پرداخت</button></div>'
    );
    $("#payOk").addEventListener("click", function () {
      var amt = parseFloat($("#payAmt").value) || 0;
      if (amt <= 0) return;
      s.debt = +Math.max(0, s.debt - amt).toFixed(2);
      supPayments.push({ id: id(), supplierId: s.id, date: new Date().toISOString(), amount: amt });
      save(LS_SUP, suppliers); save(LS_SPAY, supPayments);
      renderSuppliers();
      openSupplierDetail(s); // بازکردن دوباره تا رسید جدید دیده شود
      toast("رسید پرداخت ثبت شد ✓");
    });
    setTimeout(function () { $("#payAmt").focus(); }, 60);

        '<div class="chev">‹</div>' +
      '</div>' +
      '<div class="menu-item" data-more="expenses">' +
        '<div class="mico" style="background:var(--primary-soft);color:var(--primary)">🏠</div>' +
        '<div class="mtx"><b>مصارف خانه</b><small>پیسه‌ای که از دوکان برای خرچ خانه کشیده می‌شود</small></div>' +
        '<div class="chev">‹</div>' +
      '</div>';
  }

  // ---------- Reports (گزارش‌ها) ----------
  var reportPeriod = "all"; // today | month | all — پیش‌فرض «همه» تا داده فوری دیده شود
  function periodStart(period) {
    var d = new Date(); d.setHours(0, 0, 0, 0);
    if (period === "today") return d;
    if (period === "month") return new Date(d.getFullYear(), d.getMonth(), 1);
    return new Date(0);
  }

  function computeReport(period) {
    var start = periodStart(period);
    var r = { totalSales: 0, cash: 0, credit: 0, cogs: 0, wasteLoss: 0, expenses: 0, profit: 0, perProduct: {} };
    sales.forEach(function (s) {
      if (new Date(s.date) < start) return;
      r.totalSales += s.total;
      if (s.paymentType === "cash") r.cash += s.total; else r.credit += s.total;
      (s.items || []).forEach(function (it) {
        var p = findP(it.productId);
        // قیمت خرید لحظهٔ فروش؛ اگر نبود (فروش قدیمی) قیمت خرید فعلی
        var buy = (it.buyPrice != null) ? it.buyPrice : (p ? (p.buy || 0) : 0);
        var cost = it.quantity * buy;
        var prof = it.quantity * (it.sellPrice - buy);
        r.cogs += cost;
        var pp = r.perProduct[it.productId] || (r.perProduct[it.productId] = { name: it.productName, qty: 0, sales: 0, profit: 0 });
        pp.qty += it.quantity; pp.sales += it.quantity * it.sellPrice; pp.profit += prof;
      });
    });
    waste.forEach(function (w) { if (new Date(w.date) >= start) r.wasteLoss += w.quantity * w.buyPrice; });
    expenses.forEach(function (x) { if (new Date(x.date) >= start) r.expenses += x.amount; });
    r.profit = r.totalSales - r.cogs - r.wasteLoss;
    return r;
  }

  function custDebtTotal() { var s = 0; customers.forEach(function (c) { s += c.debt; }); return s; }
  function supDebtTotal() { var s = 0; suppliers.forEach(function (x) { s += x.debt; }); return s; }

  function renderReports(el) {
    var r = computeReport(reportPeriod);
    function seg(v, label) {
      return '<button type="button" data-rp="' + v + '" class="' + (reportPeriod === v ? "on" : "") + '">' + label + '</button>';
    }
    function row(label, val, cls) {
      return '<div class="sumrow"><span>' + label + '</span><span class="num ' + (cls || "") + '">' + money(val) + '</span></div>';
    }
    var prods = Object.keys(r.perProduct).map(function (k) { return r.perProduct[k]; })
      .sort(function (a, b) { return b.profit - a.profit; });
    var prodHtml = prods.length === 0
      ? '<p style="color:var(--ink-soft);text-align:center;padding:10px;font-size:14px">در این دوره فروشی نبوده</p>'
      : prods.map(function (p) {
          var col = p.profit >= 0 ? "var(--primary)" : "var(--danger)";
          return '<div class="iline"><div class="in"><b>' + esc(p.name) + '</b><small class="num">فروش: ' + money(p.sales) + ' • تعداد: ' + nf.format(p.qty) + '</small></div>' +
            '<div class="lt num" style="color:' + col + '">' + money(p.profit) + '</div></div>';
        }).join("");

    el.innerHTML =
      '<div class="subhead"><button class="back moreBack" aria-label="بازگشت">→</button><h3>گزارش‌ها</h3></div>' +
      '<div class="seg" id="rpToggle" style="margin:10px 14px 4px">' + seg("today", "امروز") + seg("month", "این ماه") + seg("all", "همه") + '</div>' +
      (r.totalSales === 0 ? '<div class="warn-card" style="background:var(--credit-soft);border-color:var(--credit)"><div class="wi">ℹ️</div><div class="wtx"><b>در این دوره فروشی ثبت نشده</b><small style="color:var(--credit)">دورهٔ «همه» را ببینید یا یک فروش تازه ثبت کنید</small></div></div>' : '') +
      '<div style="padding:0 14px">' +
        '<div class="sumbox">' +
          row("مجموع فروش", r.totalSales) +
          row("فروش نقد", r.cash) +
          row("فروش قرض", r.credit) +
        '</div>' +
        '<div class="sumbox">' +
          row("قیمت تمام‌شد اجناس فروخته‌شده", r.cogs) +
          row("ضرر ضایعات", r.wasteLoss) +
          '<div class="sumrow total"><span>فایدهٔ دوکان</span><span class="num" style="color:' + (r.profit >= 0 ? "var(--primary)" : "var(--danger)") + '">' + money(r.profit) + '</span></div>' +
        '</div>' +
        '<div class="sumbox">' +
          row("مصارف خانه (جدا)", r.expenses) +
          '<div class="sumrow"><span>قرض مشتری‌ها (فعلی)</span><span class="rem num">' + money(custDebtTotal()) + '</span></div>' +
          '<div class="sumrow"><span>قرض تامین‌کننده (فعلی)</span><span class="rem num">' + money(supDebtTotal()) + '</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="listhead">فایده هر جنس (' + (reportPeriod === "today" ? "امروز" : reportPeriod === "month" ? "این ماه" : "همه") + ')</div>' +
      prodHtml;
  }

  // ---------- Expenses (مصارف خانه) ----------
  // مبلغ مؤثر یک مصرف = مبلغ اصلی + مجموع اصلاحیه‌های آن.
  function expenseEffective(origId) {
    var s = 0;
    expenses.forEach(function (x) { if (x.id === origId || x.correctionOf === origId) s += x.amount; });
    return s;
  }

  function renderExpenses(el) {
    var total = 0;
    expenses.forEach(function (x) { total += x.amount; });
    var sorted = expenses.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    var listHtml = sorted.length === 0
      ? '<p style="color:var(--ink-soft);text-align:center;padding:10px;font-size:14px">هنوز مصرفی ثبت نشده</p>'
      : sorted.map(function (x) {
          if (x.correctionOf) {
            var sign = x.amount < 0 ? "" : "+";
            return '<div class="iline">' +
              '<div class="in"><b><span class="reason-badge">اصلاحیه</span> ' + esc(x.note || "") + '</b><small class="num">' + fmtDate(x.date) + '</small></div>' +
              '<div class="lt num" style="color:var(--danger)">' + sign + money(x.amount) + '</div></div>';
          }
          return '<div class="iline">' +
            '<button class="wbtn" data-correct="' + x.id + '" style="background:var(--credit)">اصلاح</button>' +
            '<div class="in"><b>' + esc(x.note || "مصرف") + '</b><small class="num">' + fmtDate(x.date) + '</small></div>' +
            '<div class="lt num" style="color:var(--credit)">' + money(x.amount) + '</div></div>';
        }).join("");

    el.innerHTML =
      '<div class="subhead"><button class="back moreBack" aria-label="بازگشت">→</button><h3>مصارف خانه</h3></div>' +
      '<div style="padding:10px 14px 4px"><button class="addline" id="newExpenseBtn" style="margin:0;border-color:var(--primary);background:var(--primary-soft);color:var(--primary)">＋ ثبت مصرف جدید</button></div>' +
      '<div class="listhead">مصارف ثبت‌شده — مجموع: <span style="color:var(--credit)" class="num">' + money(total) + '</span></div>' +
      listHtml;
  }

  function openExpenseForm() {
    openSheet(
      '<h2>ثبت مصرف خانه</h2>' +
      '<div class="field"><label>مبلغ (افغانی)</label>' +
        '<input id="expAmt" type="number" inputmode="decimal" step="any" min="0" placeholder="0" />' +
        '<div class="err" id="eExpAmt">مبلغ را درست بنویسید</div></div>' +
      '<div class="field"><label>توضیح (اختیاری)</label>' +
        '<input id="expNote" type="text" placeholder="مثلاً: نان و سبزی" /></div>' +
      '<div class="actions"><button class="ghost" data-close>لغو</button>' +
        '<button class="primary" id="expOk">ثبت مصرف</button></div>'
    );
    $("#expOk").addEventListener("click", function () {
      var amt = parseFloat($("#expAmt").value);
      var bad = !($("#expAmt").value !== "" && !isNaN(amt) && amt > 0);
      $("#eExpAmt").classList.toggle("show", bad);
      if (bad) return;
      expenses.push({ id: id(), date: new Date().toISOString(), amount: amt, note: $("#expNote").value.trim() });
      save(LS_EXP, expenses);
      closeSheet(); renderMore();
      toast("مصرف ثبت شد ✓");
    });
    setTimeout(function () { $("#expAmt").focus(); }, 60);
  }

  function openCorrectionForm(orig) {
    var eff = expenseEffective(orig.id);
    openSheet(
      '<h2>اصلاح مصرف</h2>' +
      '<p style="margin:-6px 0 12px;color:var(--ink-soft);font-size:14px">' + esc(orig.note || "مصرف") + ' • مبلغ فعلی: <b class="num">' + money(eff) + '</b></p>' +
      '<div class="field"><label>مبلغ درست (افغانی)</label>' +
        '<input id="corAmt" type="number" inputmode="decimal" step="any" min="0" value="' + eff + '" />' +
        '<div class="err" id="eCorAmt">مبلغ را درست بنویسید</div></div>' +
      '<p style="color:var(--ink-soft);font-size:13px;margin:-4px 0 12px">مصرف اصلی پاک نمی‌شود؛ فقط یک «اصلاحیه» برای فرق ثبت می‌شود.</p>' +
      '<div class="actions"><button class="ghost" data-close>لغو</button>' +
        '<button class="primary" id="corOk">ثبت اصلاحیه</button></div>'
    );
    $("#corOk").addEventListener("click", function () {
      var val = parseFloat($("#corAmt").value);
      var bad = !($("#corAmt").value !== "" && !isNaN(val) && val >= 0);
      $("#eCorAmt").classList.toggle("show", bad);
      if (bad) return;
      var diff = +(val - eff).toFixed(2);
      if (diff === 0) { closeSheet(); toast("فرقی نبود"); return; }
      expenses.push({ id: id(), date: new Date().toISOString(), amount: diff, note: "اصلاحیه: " + (orig.note || "مصرف"), correctionOf: orig.id });
      save(LS_EXP, expenses);
      closeSheet(); renderMore();
      toast("اصلاحیه ثبت شد ✓");
    });
    setTimeout(function () { var i = $("#corAmt"); i.focus(); i.select(); }, 60);
  }


  function expiringProducts() {
    return products.filter(function (p) {
      var d = daysToExpiry(p.expiry);
      return d !== null && d <= EXPIRY_WARN_DAYS && p.qty > 0;
    }).sort(function (a, b) { return daysToExpiry(a.expiry) - daysToExpiry(b.expiry); });
  }

  function renderWaste(el) {
    var warnList = expiringProducts();
    var warnHtml = warnList.length === 0
      ? '<p style="color:var(--ink-soft);padding:8px 14px;font-size:14px">هیچ جنسی نزدیک خرابی نیست ✓</p>'
      : warnList.map(function (p) {
          var d = daysToExpiry(p.expiry);
          return '<div class="warn-card"><div class="wi">⏰</div>' +
            '<div class="wtx"><b>' + esc(p.name) + '</b><small>' + expiryLabel(d) + ' • موجود: ' + qtyUnit(p.qty, p.unit) + '</small></div>' +
            '<button class="wbtn" data-wexp="' + p.id + '">ثبت ضایعات</button></div>';
        }).join("");

    var totalLoss = 0;
    waste.forEach(function (w) { totalLoss += w.quantity * w.buyPrice; });
    var sorted = waste.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    var listHtml = sorted.length === 0
      ? '<p style="color:var(--ink-soft);text-align:center;padding:10px;font-size:14px">هنوز ضایعاتی ثبت نشده</p>'
      : sorted.map(function (w) {
          return '<div class="iline"><div class="in"><b>' + esc(w.productName) + '</b>' +
            '<small class="num">' + fmtDate(w.date) + ' • <span class="reason-badge">' + reasonLabel(w.reason) + '</span> • ' + qtyUnit(w.quantity, w.unit) + '</small></div>' +
            '<div class="lt num" style="color:var(--danger)">' + money(w.quantity * w.buyPrice) + '</div></div>';
        }).join("");

    el.innerHTML =
      '<div class="subhead"><button class="back moreBack" aria-label="بازگشت">→</button><h3>ضایعات و تاریخ خرابی</h3></div>' +
      '<div class="listhead">اخطار تاریخ خرابی (تا ' + EXPIRY_WARN_DAYS + ' روز)</div>' +
      warnHtml +
      '<div style="padding:10px 14px 4px"><button class="addline" id="newWasteBtn" style="margin:0">＋ ثبت ضایعات جدید</button></div>' +
      '<div class="listhead">ضایعات ثبت‌شده — مجموع ضرر: <span style="color:var(--danger)" class="num">' + money(totalLoss) + '</span></div>' +
      listHtml;
  }

  function openWastePicker() {
    if (products.length === 0) { toast("اول از بخش «اجناس» جنس اضافه کنید", true); return; }
    var list = products.map(function (p) {
      return '<div class="pick-item" data-wpick="' + p.id + '"><b>' + esc(p.name) + '</b><small class="num">موجود: ' + qtyUnit(p.qty, p.unit) + '</small></div>';
    }).join("");
    openSheet('<h2>انتخاب جنس ضایعاتی</h2><div class="pick">' + list + '</div>' +
      '<div class="actions"><button class="ghost" data-close>لغو</button></div>');
    sheet.querySelectorAll("[data-wpick]").forEach(function (it) {
      it.addEventListener("click", function () { var p = findP(it.dataset.wpick); if (p) openWasteForm(p, "spoiled"); });
    });
  }

  function openWasteForm(p, defaultReason) {
    var reason = defaultReason || "spoiled";
    openSheet(
      '<h2>ثبت ضایعات: ' + esc(p.name) + '</h2>' +
      '<p style="margin:-6px 0 12px;color:var(--ink-soft);font-size:14px">موجود: <b class="num">' + qtyUnit(p.qty, p.unit) + '</b> • قیمت خرید: <b class="num">' + money(p.buy) + '</b></p>' +
      '<div class="field"><label>سبب</label>' +
        '<div class="seg" id="wReason">' +
          '<button type="button" data-r="spoiled" class="' + (reason === "spoiled" ? "on" : "") + '">خراب</button>' +
          '<button type="button" data-r="expired" class="' + (reason === "expired" ? "on" : "") + '">تاریخ‌تیر</button>' +
        '</div></div>' +
      '<div class="field"><label>مقدار ضایع‌شده (' + unitLabel(p.unit) + ')</label>' +
        '<input id="wQty" type="number" inputmode="decimal" step="any" min="0" value="' + p.qty + '" /></div>' +
      '<div class="actions"><button class="ghost" data-close>لغو</button>' +
        '<button class="primary danger" id="wOk" style="background:var(--danger)">ثبت ضایعات</button></div>'
    );
    sheet.querySelectorAll("#wReason button").forEach(function (b) {
      b.addEventListener("click", function () {
        reason = b.dataset.r;
        sheet.querySelectorAll("#wReason button").forEach(function (x) { x.classList.toggle("on", x === b); });
      });
    });
    $("#wOk").addEventListener("click", function () {
      var qty = parseFloat($("#wQty").value) || 0;
      if (qty <= 0) return;
      recordWaste(p, qty, reason);
    });
  }

  function recordWaste(p, qty, reason) {
    p.qty = +(p.qty - qty).toFixed(3);
    waste.push({ id: id(), productId: p.id, productName: p.name, unit: p.unit, quantity: qty, buyPrice: p.buy || 0, date: new Date().toISOString(), reason: reason });
    save(LS_P, products); save(LS_WASTE, waste);
    closeSheet(); renderMore(); renderProducts(); renderSaleGrid();
    toast("ضایعات ثبت شد ✓ موجودی کم شد");
  }

  // ---------- Events ----------
  $("#saleGrid").addEventListener("click", function (e) {
    var t = e.target.closest(".tile"); if (t) onTileTap(t.dataset.id);
  });
  $("#saleGrid").addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { var t = e.target.closest(".tile"); if (t) { e.preventDefault(); onTileTap(t.dataset.id); } }
  });
  $("#cartArea").addEventListener("click", function (e) {
    var b = e.target.closest("[data-rem]"); if (b) removeLine(b.dataset.rem);
  });
  $("#btnCash").addEventListener("click", function () { finishSale("cash", null); });
  $("#btnCredit").addEventListener("click", openCreditDialog);

  $("#prodList").addEventListener("click", function (e) {
    var d = e.target.closest("[data-del]"); if (d) { var p = findP(d.dataset.del); if (p) confirmDelete(p); return; }
    var ed = e.target.closest("[data-edit]"); if (ed) { var pe = findP(ed.dataset.edit); if (pe) openProductForm(pe); }
  });
  $("#prodList").addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { var ed = e.target.closest("[data-edit]"); if (ed) { e.preventDefault(); var pe = findP(ed.dataset.edit); if (pe) openProductForm(pe); } }
  });
  $("#btnAdd").addEventListener("click", function () { openProductForm(null); });

  $("#btnNewPurchase").addEventListener("click", openPurchaseForm);
  $("#purchaseList").addEventListener("click", function (e) {
    var c = e.target.closest("[data-purchase]"); if (c) { var pu = findPurchase(c.dataset.purchase); if (pu) openPurchaseDetail(pu); }
  });
  $("#supplierList").addEventListener("click", function (e) {
    var c = e.target.closest("[data-supplier]"); if (c) { var s = findS(c.dataset.supplier); if (s) openSupplierDetail(s); }
  });
  $("#supplierList").addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { var c = e.target.closest("[data-supplier]"); if (c) { e.preventDefault(); var s = findS(c.dataset.supplier); if (s) openSupplierDetail(s); } }
  });
  $("#customerList").addEventListener("click", function (e) {
    var c = e.target.closest("[data-customer]"); if (c) { var cu = findC(c.dataset.customer); if (cu) openCustomerDetail(cu); }
  });
  $("#customerList").addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { var c = e.target.closest("[data-customer]"); if (c) { e.preventDefault(); var cu = findC(c.dataset.customer); if (cu) openCustomerDetail(cu); } }
  });
  document.querySelectorAll("#debtToggle button").forEach(function (b) {
    b.addEventListener("click", function () {
      debtView = b.dataset.d;
      document.querySelectorAll("#debtToggle button").forEach(function (x) { x.classList.toggle("on", x === b); });
      renderDebts();
    });
  });
  $("#moreArea").addEventListener("click", function (e) {
    var m = e.target.closest("[data-more]"); if (m) { moreView = m.dataset.more; renderMore(); return; }
    if (e.target.closest(".moreBack")) { moreView = null; renderMore(); return; }
    if (e.target.closest("#newWasteBtn")) { openWastePicker(); return; }
    var w = e.target.closest("[data-wexp]"); if (w) { var p = findP(w.dataset.wexp); if (p) openWasteForm(p, "expired"); return; }
    if (e.target.closest("#newExpenseBtn")) { openExpenseForm(); return; }
    var cor = e.target.closest("[data-correct]"); if (cor) { var ex = null; for (var i = 0; i < expenses.length; i++) if (expenses[i].id === cor.dataset.correct) ex = expenses[i]; if (ex) openCorrectionForm(ex); return; }
    var rp = e.target.closest("[data-rp]"); if (rp) { reportPeriod = rp.dataset.rp; renderMore(); }
  });

  $("#search").addEventListener("input", function () {
    $("#searchClr").style.display = this.value ? "block" : "none";
    renderSaleGrid();
  });
  $("#searchClr").addEventListener("click", function () { $("#search").value = ""; this.style.display = "none"; renderSaleGrid(); $("#search").focus(); });

  document.addEventListener("click", function (e) { if (e.target.closest("[data-close]")) closeSheet(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && overlay.classList.contains("open")) closeSheet(); });

  // Tabs
  function switchTab(scr) {
    currentTab = scr;
    ["sales", "products", "purchases", "debts", "more"].forEach(function (s) {
      $("#scr-" + s).classList.toggle("active", s === scr);
      $("#tab-" + s).classList.toggle("active", s === scr);
    });
    $("#cartbar").style.display = scr === "sales" ? "block" : "none";
    $("#fab").style.display = scr === "products" ? "flex" : "none";
    $("#fabBuy").style.display = scr === "purchases" ? "flex" : "none";
    var subs = { sales: "فروش تیز", products: "اجناس و موجودی", purchases: "فاکتور خرید", debts: "دفتر قرض‌ها", more: "بیشتر" };
    $("#hsub").textContent = subs[scr] || "";
    if (scr === "products") renderProducts();
    else if (scr === "purchases") renderPurchases();
    else if (scr === "debts") renderDebts();
    else if (scr === "more") { moreView = null; renderMore(); }
    else renderSaleGrid();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll("nav.tabs button").forEach(function (b) {
    b.addEventListener("click", function () { switchTab(b.dataset.scr); });
  });

  // ---------- Init ----------
  renderSaleGrid();
  renderCart();
  switchTab("sales");
})();
</script>
</html>
