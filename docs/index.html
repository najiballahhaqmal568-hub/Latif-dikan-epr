      sheet.querySelectorAll("#gnType button").forEach(function (b) {

    function commit() {

      if (picked.isNew && !findP(picked.id)) {

      var oldQty = p.qty > 0 ? p.qty : 0, oldBuy = p.buy || 0;

  // ---------- Reports (گزارش‌ها) ----------
  var reportPeriod = "all"; // today | month | all — پیش‌فرض «همه» تا داده فوری دیده شود
  function periodStart(period) {
    var d = new Date(); d.setHours(0, 0, 0, 0);
    if (period === "today") return d;
    if (period === "month") {
      // «این ماه» = ماه هجری شمسی (نه میلادی)
      var j = toJalali(d);
      if (j) {
        var start = jalaliToDate(j.jy, j.jm, 1);
        if (start) return start;
      }
      return new Date(d.getFullYear(), d.getMonth(), 1); // اگر تبدیل ناکام شد
    }
    return new Date(0);
  }

  function computeReport(period) {
    var start = periodStart(period);
    var r = { totalSales: 0, cash: 0, credit: 0, cogs: 0, wasteLoss: 0, expenses: 0, profit: 0, netProfit: 0,
              cashIn: 0, cashOut: 0, cashBox: 0, cashShort: 0, expensesGoods: 0, estCogs: 0, estNames: {}, perProduct: {},
              // فروش دوکان و فروش بازار جدا — تا معلوم شود کدام یکی چقدر می‌دهد.
              // فایدهٔ اینجا پیش از ضایعات و کسری صندوق است (آن‌ها به کانال بند نیستند).
              shopSales: 0, bazaarSales: 0, shopProfit: 0, bazaarProfit: 0 };
    sales.forEach(function (s) {
      if (new Date(s.date) < start) return;
      var isBazaar = saleChannel(s) === "bazaar";
      r.totalSales += s.total;
      if (isBazaar) r.bazaarSales += s.total; else r.shopSales += s.total;
      if (s.paymentType === "cash") r.cash += s.total; else r.credit += s.total;
      (s.items || []).forEach(function (it) {
        var p = findP(it.productId);
        // قیمت خرید لحظهٔ فروش؛ اگر نبود (فروش قدیمی) قیمت خرید فعلی
        var buy = (it.buyPrice != null) ? it.buyPrice : (p ? (p.buy || 0) : 0);
        var cost = it.quantity * buy;
        var prof = it.quantity * (it.sellPrice - buy);
        r.cogs += cost;
        if (isBazaar) r.bazaarProfit += prof; else r.shopProfit += prof;
        // اگر قیمت خرید لحظهٔ فروش تخمینی بود (یا جنس هنوز تخمینی است)
        var wasEst = (it.buyEst !== undefined) ? it.buyEst : (p ? !!p.buyEstimated : false);
        if (wasEst) { r.estCogs += cost; r.estNames[it.productName] = 1; }
        var pp = r.perProduct[it.productId] || (r.perProduct[it.productId] = { name: it.productName, qty: 0, sales: 0, profit: 0 });
        pp.qty += it.quantity; pp.sales += it.quantity * it.sellPrice; pp.profit += prof;
      });
    });
    waste.forEach(function (w) { if (new Date(w.date) >= start) r.wasteLoss += w.quantity * w.buyPrice; });
    expenses.forEach(function (x) {
      if (new Date(x.date) < start) return;
      r.expenses += x.amount;
      // مصرف «به جنس» پول نقد نیست؛ در صندوق نمی‌آید ولی مصرف خانه هست
      if (isGoodsExpense(x)) r.expensesGoods += x.amount;
    });
    r.profit = r.totalSales - r.cogs - r.wasteLoss;
    r.netProfit = r.profit - r.expenses;

    // صندوق نقد: پیسه‌ای که باید در دست باشد.
    // از همان رویدادهای cashEvents() ساخته می‌شود — پس قانون «چه چیزی پول
    // است» اینجا دوباره نوشته نمی‌شود و با صفحهٔ صندوق همیشه جور می‌ماند.
    cashEvents().forEach(function (e) {
      if (new Date(e.date) < start) return;
      if (e.kind === "adjust") {
        // کسری شمارش = ضرر واقعی؛ زیادت مثل پول داخل‌شده
        if (e.amount >= 0) r.cashIn += e.amount;
        else { r.cashOut += -e.amount; r.cashShort += -e.amount; }
      } else if (CASH_OUT_KINDS[e.kind]) r.cashOut += -e.amount;
      else r.cashIn += e.amount;
    });
    r.shopProfit = +r.shopProfit.toFixed(2); r.bazaarProfit = +r.bazaarProfit.toFixed(2);
    r.shopSales = +r.shopSales.toFixed(2); r.bazaarSales = +r.bazaarSales.toFixed(2);
    // عمداً اینجا گرد نمی‌شود: اگر هر جزء جدا گرد شود، جمع اجزا با کل جور
    // در نمی‌آید (فایدهٔ هر جنس با فایدهٔ کل ۲ پیسه فرق می‌کرد). گردکردن
    // کار نمایش است و در money() انجام می‌شود.
    r.cashBox = +(r.cashIn - r.cashOut).toFixed(2);
    // کسری صندوق مثل کسری شمارش اجناس، از فایده کم می‌شود
    r.profit = +(r.profit - r.cashShort).toFixed(2);
    r.netProfit = +(r.profit - r.expenses).toFixed(2);
    return r;
  }

  function custDebtTotal() { var s = 0; customers.forEach(function (c) { s += custDebt(c); }); return s; }
  function supDebtTotal() { var s = 0; suppliers.forEach(function (x) { s += supDebt(x); }); return s; }

  // برچسب دوره با نام ماه شمسی، تا معلوم باشد «این ماه» کدام ماه است

    if (reportPeriod === "today") return "امروز — " + fmtDateLong(new Date().toISOString());

  // اخطار صادقانه: چه اندازه از فایدهٔ این دوره روی قیمت تخمینی بنا است

        '</div>' +

          (r.expensesGoods ? '<div class="sumrow"><span style="padding-inline-start:14px;color:var(--ink-soft);font-size:13.5px">از آن، جنس از گدام (به قیمت خرید)</span><span class="num" style="color:var(--ink-soft)">' + money(r.expensesGoods) + '</span></div>' : '') +

        '</div>' +

  // ---------- Online sync (Supabase) ----------
  var READONLY = false;
  var SYNC = { clientId: null, pushTimer: null, pollTimer: null, status: "خاموش", lastTs: 0, busy: false,
               photoTs: 0, photoTimer: null };

  function syncCfg() {
    return {
      role: localStorage.getItem("dukan.sync.role") || "owner",
      shop: (localStorage.getItem("dukan.sync.shop") || "").trim(),
      url: (localStorage.getItem("dukan.sync.url") || "").trim().replace(/\/+$/, ""),
      key: (localStorage.getItem("dukan.sync.key") || "").trim(),
      enabled: localStorage.getItem("dukan.sync.enabled") === "1"
    };
  }

  function collectData() {
    refreshDebtMirrors(); // فیلد debt فقط برای بک‌آپ تازه می‌شود
    return { products: products, sales: sales, suppliers: suppliers, purchases: purchases, customers: customers, supPayments: supPayments, custPayments: custPayments, waste: waste, expenses: expenses, stockCounts: stockCounts, cashEntries: cashEntries };
  }
  function applyData(d) {
    if (!d) return;
    if (d.products) products = d.products;
    if (d.sales) sales = d.sales;
    if (d.suppliers) suppliers = d.suppliers;
    if (d.purchases) purchases = d.purchases;
    if (d.customers) customers = d.customers;
    if (d.supPayments) supPayments = d.supPayments;
    if (d.custPayments) custPayments = d.custPayments;
    if (d.waste) waste = d.waste;
    if (d.expenses) expenses = d.expenses;
    if (d.stockCounts) stockCounts = d.stockCounts;
    if (d.cashEntries) cashEntries = d.cashEntries;
    save0(LS_P, products); save0(LS_S, sales); save0(LS_SUP, suppliers); save0(LS_PUR, purchases); save0(LS_CUST, customers);
    save0(LS_SPAY, supPayments); save0(LS_CPAY, custPayments); save0(LS_WASTE, waste); save0(LS_EXP, expenses); save0(LS_COUNTS, stockCounts);
    save0(LS_CASH, cashEntries);
    // دیتای رسیده ممکن است از نسخهٔ کهنه باشد (بدون «قرض قبلی») — کوچ داده شود
    invalidateDebts();
    migrateMonthKeysToJalali();
    migrateDebtsToLedger();
    renderCart(); switchTab(currentTab);
  }

  function setSyncStatus(s) { SYNC.status = s; var el = document.getElementById("syncStatus"); if (el) el.textContent = s; }
  function fmtTime(ms) { if (!ms) return ""; var d = new Date(ms); function p(n) { return n < 10 ? "0" + n : n; } return fmtDate(d.toISOString()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()); }
  function syncClientId() { var c = localStorage.getItem("dukan.sync.client"); if (!c) { c = id() + id(); localStorage.setItem("dukan.sync.client", c); } return c; }

  function sbHeaders(cfg) { return { "apikey": cfg.key, "Authorization": "Bearer " + cfg.key, "Content-Type": "application/json" }; }
  function sbUrl(cfg, q) { return cfg.url + "/rest/v1/dukan_shops" + (q || ""); }

  // خواندن سند دوکان از Supabase
  function syncPull() {
    var cfg = syncCfg();
    return fetch(sbUrl(cfg, "?shop=eq." + encodeURIComponent(cfg.shop) + "&select=payload,ts,by"), { headers: sbHeaders(cfg) })
      .then(function (r) { if (!r.ok) return r.text().then(function (t) { throw new Error("HTTP " + r.status + " — " + t.slice(0, 180)); }); return r.json(); })
      .then(function (rows) { return (rows && rows.length) ? rows[0] : null; });
  }
  // نوشتن (upsert) سند دوکان
  function syncPushNow() {
    var cfg = syncCfg();
    if (cfg.role !== "owner" || !cfg.url || !cfg.key || !cfg.shop) return Promise.resolve();
    var ts = Date.now();
    var body = [{ shop: cfg.shop, payload: collectData(), ts: ts, by: SYNC.clientId }];
    return fetch(sbUrl(cfg, "?on_conflict=shop"), {
      method: "POST",
      headers: Object.assign({ "Prefer": "resolution=merge-duplicates,return=minimal" }, sbHeaders(cfg)),
      body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error("HTTP " + r.status + " " + t.slice(0, 120)); });
      SYNC.lastTs = ts; setSyncStatus("سنک شد — " + fmtTime(ts));
    }).catch(function (e) { setSyncStatus("خطا در فرستادن: " + (e.message || e)); });
  }

  function syncOnLocalSave() {
    var cfg = syncCfg();
    if (!cfg.enabled || cfg.role !== "owner" || READONLY) return;
    clearTimeout(SYNC.pushTimer);
    SYNC.pushTimer = setTimeout(function () { syncPushNow(); }, 1500);
  }

  // ---------- سنک عکس‌ها (جدا از دیتای مالی) ----------
  // عکس‌ها در یک سند جداگانه می‌روند (کد دوکان + «__photos»). دلیلش:
  // سند اصلی با هر فروش فرستاده می‌شود؛ اگر عکس‌ها هم داخلش بودند، هر
  // فروش یک مگابایت اینترنت می‌خورد. عکس‌ها فقط وقتی می‌روند که عوض شوند.
  function photosShop(cfg) { return cfg.shop + "__photos"; }
  function syncPushPhotos() {
    var cfg = syncCfg();
    if (!cfg.enabled || cfg.role !== "owner" || READONLY || !cfg.url || !cfg.key || !cfg.shop) return Promise.resolve();
    var ts = Date.now();
    var body = [{ shop: photosShop(cfg), payload: { photos: photoCache }, ts: ts, by: SYNC.clientId }];
    return fetch(sbUrl(cfg, "?on_conflict=shop"), {
      method: "POST",
      headers: Object.assign({ "Prefer": "resolution=merge-duplicates,return=minimal" }, sbHeaders(cfg)),
      body: JSON.stringify(body)
    }).then(function (r) {
      if (r.ok) SYNC.photoTs = ts;
    }).catch(function () {});
  }
  function syncPhotosOnChange() {
    clearTimeout(SYNC.photoTimer);
    SYNC.photoTimer = setTimeout(function () { syncPushPhotos(); }, 3000);
  }
  // فقط ts خوانده می‌شود (سبک)؛ اگر تازه‌تر بود، آن‌وقت خود عکس‌ها گرفته می‌شوند
  function syncPullPhotos(force) {
    var cfg = syncCfg();
    if (!cfg.enabled || !cfg.url || !cfg.key || !cfg.shop) return Promise.resolve();
    var key = encodeURIComponent(photosShop(cfg));
    return fetch(sbUrl(cfg, "?shop=eq." + key + "&select=ts,by"), { headers: sbHeaders(cfg) })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (rows) {
        var row = (rows && rows.length) ? rows[0] : null;
        if (!row) return null;
        if (!force && !(row.ts > (SYNC.photoTs || 0) && row.by !== SYNC.clientId)) return null;
        return fetch(sbUrl(cfg, "?shop=eq." + key + "&select=payload,ts"), { headers: sbHeaders(cfg) })
          .then(function (r) { return r.ok ? r.json() : []; })
          .then(function (rs) { return (rs && rs.length) ? rs[0] : null; });
      })
      .then(function (row) {
        if (!row || !row.payload || !row.payload.photos) return;
        var ph = row.payload.photos;
        SYNC.photoTs = row.ts || Date.now();
        return photoClear().then(function () {
          var chain = Promise.resolve();
          Object.keys(ph).forEach(function (k) { chain = chain.then(function () { return photoSave(k, ph[k]); }); });
          return chain;
        }).then(function () { renderSaleGrid(); renderProducts(); });
      })
      .catch(function () {});
  }

  // چک دوره‌ای برای معلومات جدید (برادر زنده، و مالک از دستگاه دیگر)
  function syncPoll() {
    if (SYNC.busy) return;
    SYNC.busy = true;
    syncPull().then(function (row) {
      SYNC.busy = false;
      syncPullPhotos(false); // عکس‌ها سند جدا دارند و مستقل چک می‌شوند
      if (!row) { setSyncStatus(READONLY ? "هنوز معلوماتی از دوکان نیامده" : "روشن — هنوز چیزی نفرستاده‌اید"); return; }
      if (row.ts && row.ts > SYNC.lastTs && row.by !== SYNC.clientId) {
        SYNC.lastTs = row.ts;
        applyData(row.payload);
        setSyncStatus((READONLY ? "زنده (فقط دیدن) — " : "سنک شد — ") + fmtTime(row.ts));
      } else if (!READONLY) {
        setSyncStatus("روشن (مالک) — " + fmtTime(SYNC.lastTs || row.ts));
      }
    }).catch(function (e) { SYNC.busy = false; setSyncStatus("خطا: " + (e.message || e)); });
  }

  function syncStart() {
    var cfg = syncCfg();
    if (!cfg.url || !cfg.key || !cfg.shop) { toast("اول URL و کلید Supabase و کد دوکان را پر کنید", true); return; }
    SYNC.clientId = syncClientId();
    localStorage.setItem("dukan.sync.enabled", "1");
    setSyncStatus("در حال وصل شدن...");
    if (SYNC.pollTimer) { clearInterval(SYNC.pollTimer); SYNC.pollTimer = null; }
    syncPullPhotos(true); // یک‌بار عکس‌ها هم بیایند (برای تیلفون نو یا برادر)
    syncPull().then(function (row) {
      if (cfg.role === "viewer") {
        READONLY = true; document.body.classList.add("readonly");
        if (row && row.payload) { SYNC.lastTs = row.ts || 0; applyData(row.payload); setSyncStatus("زنده (فقط دیدن) — " + fmtTime(row.ts)); }
        else setSyncStatus("وصل شد — هنوز معلوماتی از دوکان نیامده");
      } else {
        READONLY = false; document.body.classList.remove("readonly");
        if (row && row.payload) { SYNC.lastTs = row.ts || 0; applyData(row.payload); setSyncStatus("سنک شد از آنلاین"); }
        else { syncPushNow(); }
      }
      // چک دوره‌ای هر ۸ ثانیه
      SYNC.pollTimer = setInterval(syncPoll, 8000);
      if (moreView === "sync") renderMore();
    }).catch(function (e) { setSyncStatus("خطا در وصل: " + (e.message || e)); toast("خطا در سنک: " + (e.message || e), true); });
  }

  function syncStop() {
    if (SYNC.pollTimer) { clearInterval(SYNC.pollTimer); SYNC.pollTimer = null; }
    READONLY = false; document.body.classList.remove("readonly");
    localStorage.setItem("dukan.sync.enabled", "0");
    setSyncStatus("خاموش"); toast("سنک خاموش شد");
    if (moreView === "sync") renderMore();
  }

  function renderSync(el) {
    var cfg = syncCfg();
    var role = cfg.role;
    el.innerHTML =
      '<div class="subhead"><button class="back moreBack" aria-label="بازگشت">→</button><h3>سنک آنلاین و بک‌آپ</h3></div>' +
      '<div class="sync-status" id="syncStatus">' + esc(SYNC.status) + '</div>' +
      '<div class="sync-form" style="padding:0 14px">' +
        '<div class="field"><label>نقش این تلیفون</label><div class="seg" id="syncRole">' +
          '<button type="button" data-r="owner" class="' + (role === "owner" ? "on" : "") + '">مالک (لطیف)</button>' +
          '<button type="button" data-r="viewer" class="' + (role === "viewer" ? "on" : "") + '">فقط دیدن (برادر)</button>' +
        '</div></div>' +
        '<div class="field"><label>کد دوکان (یکسان در هر دو تلیفون)</label>' +
          '<input id="syncShop" type="text" value="' + esc(cfg.shop) + '" placeholder="dukan-latif-7788" style="direction:ltr;text-align:left" />' +
          '<button class="ghost" id="syncGen" style="margin-top:8px;padding:8px 12px">ساختن کد تصادفی</button></div>' +
        '<div class="field"><label>Project URL (از Supabase)</label>' +
          '<input id="syncUrl" type="text" value="' + esc(localStorage.getItem("dukan.sync.url") || "") + '" placeholder="https://xxxx.supabase.co" style="direction:ltr;text-align:left" /></div>' +
        '<div class="field"><label>anon key (کلید عمومی از Supabase)</label>' +
          '<textarea id="syncKey" placeholder="eyJhbGciOi..." style="min-height:80px">' + esc(localStorage.getItem("dukan.sync.key") || "") + '</textarea></div>' +
        '<div class="actions"><button class="ghost" id="syncSave">ذخیره تنظیمات</button>' +
          (cfg.enabled ? '<button class="primary" id="syncOff" style="background:var(--danger)">خاموش‌کردن سنک</button>' : '<button class="primary" id="syncOn">روشن‌کردن سنک</button>') +
        '</div>' +
        '<div style="margin:14px 0 24px;font-size:13px;color:var(--ink-soft);line-height:2.1">' +
          '<b>چطور Supabase بسازم؟</b><br>' +
          '۱) به <span style="direction:ltr">supabase.com</span> بروید و با GitHub وارد شوید → New project.<br>' +
          '۲) یک جدول با SQL بسازید (کد را برایتان می‌فرستم).<br>' +
          '۳) از Settings → API، «Project URL» و «anon public» key را کاپی و اینجا بچسپانید.<br>' +
          '۴) نقش/کد دوکان را انتخاب، ذخیره و «روشن‌کردن سنک». در تلیفون برادر همان‌ها را با نقش «فقط دیدن» بگذارید.<br>' +
          '<b>عکس‌ها</b> در یک سند جدا می‌روند و فقط وقتی فرستاده می‌شوند که عوض شوند — تا هر فروش اینترنت نخورد.' +
        '</div>' +
